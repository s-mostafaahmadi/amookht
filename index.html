  const skillEntries=Object.entries(skillTimes).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]),skillTotal=skillEntries.reduce((n,[,v])=>n+v,0),palette=['#38bdf8','#a855f7','#fb7185','#f59e0b','#34d399','#6366f1','#f472b6','#22d3ee'];let angle=0;const donutStops=skillEntries.length?skillEntries.map(([,v],i)=>{const start=angle;angle+=v/skillTotal*360;return`${palette[i%palette.length]} ${start}deg ${angle}deg`}).join(','):'#303349 0deg 360deg';
  const activityRate=totalActivities?Math.round(completedActivities/totalActivities*100):0,userInitial=safeText((S.user.name||'L').trim().charAt(0).toUpperCase()),userAvatar=S.user.avatarDataUrl?`<img src="${safeText(S.user.avatarDataUrl)}" alt="avatar">`:userInitial;
  return`<div class="history-shell min-h-screen pb-28 text-slate-100"><main class="history-board max-w-[1500px] mx-auto p-3 md:p-6"><header class="history-topbar"><div class="flex items-center gap-3"><div class="history-avatar">${userAvatar}</div><div><p class="text-xs text-slate-400">Learning analytics</p><h1 class="text-xl md:text-3xl font-black">Hallo, ${safeText(S.user.name||'Learner')}</h1></div></div><div class="flex items-center gap-2"><label class="history-period"><span>Zeitraum</span><select onchange="S.historyFilter=this.value;saveData();render()">${periods.map(p=>`<option value="${p.v}" ${timeFilter===p.v?'selected':''}>${p.l}</option>`).join('')}</select></label><button onclick="toggleDark()" class="history-icon-btn" aria-label="Darstellung wechseln">${S.dark?'☀️':'◐'}</button></div></header>
  <div class="history-layout"><aside class="history-side-card"><div><span class="history-eyebrow">FORTSCHRITT</span><h2 class="mt-2 text-2xl font-black">Deine Lernreise</h2><p class="mt-2 text-sm text-slate-400 leading-6">Alle Pläne, Lernzeiten und Ergebnisse kompakt an einem Ort.</p></div><div class="history-completion"><div class="history-ring" style="--value:${activityRate*3.6}deg"><div><b>${activityRate}%</b><span>erledigt</span></div></div></div><div class="space-y-3">${[['Lernpläne',filtered.length,'#38bdf8'],['Aktivitäten',`${completedActivities}/${totalActivities}`,'#a855f7'],['Lernzeit',timeStr(totalSeconds),'#fb7185']].map(x=>`<div class="history-mini-stat"><i style="background:${x[2]}"></i><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><button onclick="navigateApp('dashboard')" class="history-primary-btn">${t('common.continue')} <span>→</span></button></aside>
  <section class="history-center"><article class="history-panel history-trend"><div class="history-panel-head"><div><span class="history-eyebrow">REPORT</span><h2>Lernleistung</h2></div><div class="history-score-pill"><small>Lernzeit / Tag - Trend ${trendText}</small><b>${chartAverage==null?'--':fmtChartTime(chartAverage)}</b></div></div><div class="history-chart-wrap">${chartValues.length?`<svg viewBox="0 0 ${chartW} ${chartH}" role="img" aria-label="Lernzeit pro Tag mit Minutenachse"><defs><linearGradient id="historyArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>${chartTicks.map(v=>{const y=padT+plotH-(v/chartMax*plotH);return`<g><line x1="${padL}" y1="${y}" x2="${chartW-padR}" y2="${y}" class="history-gridline"/><text x="${padL-8}" y="${y+4}" text-anchor="end" class="history-axis-label">${fmtChartTime(v)}</text></g>`}).join('')}<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" class="history-axis-line"/><line x1="${padL}" y1="${padT+plotH}" x2="${chartW-padR}" y2="${padT+plotH}" class="history-axis-line"/><polygon points="${areaPoints}" fill="url(#historyArea)"/><polyline points="${points}" class="history-line"/>${pointList.map((pt,i)=>`<g><circle cx="${pt.x}" cy="${pt.y}" r="${i===pointList.length-1?5:3}" class="history-dot"><title>${new Date(`${chronological[i].date}T00:00:00`).toLocaleDateString('de-DE')} - ${fmtChartTime(pt.value)}</title></circle>${pointList.length<=10?`<text x="${pt.x}" y="${Math.max(12,pt.y-10)}" text-anchor="middle" class="history-point-label">${fmtChartTime(pt.value)}</text>`:''}</g>`).join('')}</svg>`:`<div class="history-empty-chart"><span>--</span><p>Noch keine Lernzeit fuer diesen Zeitraum.</p></div>`}</div><div class="history-chart-labels" style="padding-left:58px">${chronological.map(d=>`<span>${new Date(`${d.date}T00:00:00`).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})}</span>`).join('')}</div></article>
  <article class="history-panel"><div class="history-panel-head"><div><span class="history-eyebrow">TÄGLICHE ÜBERSICHT</span><h2>Letzte Lernpläne</h2></div><span class="text-xs text-slate-400">Tippen für Details</span></div>${filtered.length?`<div class="history-days">${filtered.map((day,index)=>{const rowKey=day.date,expanded=S.expandedHistoryPlan===rowKey,groupedTimes={};Object.entries(day.activityTimes||{}).forEach(([id,value])=>{const skill=historySkillId(id);groupedTimes[skill]=(groupedTimes[skill]||0)+(Number(value)||0)});const skillIds=[...new Set([...Object.keys(groupedTimes),...Object.keys(day.skillScores||{}).filter(id=>id!=='gesamt')])],score=Number.isFinite(day.score)?day.score:null;return`<article class="history-day ${expanded?'is-open':''}"><div class="history-day-row"><button type="button" onclick='toggleHistoryDay(${JSON.stringify(rowKey)})' aria-expanded="${expanded}" class="history-day-main"><span class="history-day-index">${String(index+1).padStart(2,'0')}</span><span class="min-w-0 flex-1"><b>${new Date(`${day.date}T00:00:00`).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'})}</b><small>${safeText(day.examName||EXAM_PLANS[day.examType]?.name||'TestDaF')} · ${day.comp||0}/${day.acts||0} Aktivitäten</small></span><span class="history-day-time">${timeStr(day.time||0)}</span><span class="history-day-score ${score>=70?'good':score!=null?'warn':''}">${score==null?'—':score}</span><span class="history-chevron">⌄</span></button></div>${expanded?`<div class="history-day-detail">${skillIds.length?skillIds.map((id,i)=>`<div><span><i style="background:${palette[i%palette.length]}"></i>${historyActivityLabel(id)}</span><b>${timeStr(groupedTimes[id]||0)}</b><strong>${Number.isFinite(day.skillScores?.[id])?day.skillScores[id]+'/100':'—'}</strong></div>`).join(''):`<p>Noch keine Skill-Daten gespeichert.</p>`}</div>`:''}</article>`}).join('')}</div>`:`<div class="history-empty-chart py-14"><span>◇</span><p>Keine Lerndaten in diesem Zeitraum</p><button onclick="navigateApp('dashboard')">Erste Aktivität starten</button></div>`}</article></section>
  <aside class="history-right"><article class="history-panel history-distribution"><div class="history-panel-head"><div><span class="history-eyebrow">VERTEILUNG</span><h2>Lernzeit nach Skill</h2></div></div><div class="history-donut" style="background:conic-gradient(${donutStops})"><div><b>${Math.round(totalSeconds/60)}</b><span>Minuten</span></div></div><div class="history-legend">${skillEntries.length?skillEntries.slice(0,6).map(([id,value],i)=>`<div><i style="background:${palette[i%palette.length]}"></i><span>${historyActivityLabel(id)}</span><b>${Math.round(value/60)}m</b></div>`).join(''):`<p>Noch keine Lernzeit erfasst.</p>`}</div></article>
  <article class="history-panel"><div class="history-panel-head"><div><span class="history-eyebrow">SKILL-ZIELE</span><h2>Wochenfokus</h2></div></div><div class="history-goals">${SKILLS.map((skill,i)=>{const key=skill.id==='vocab'?'wortschatz':skill.id,actual=skillTimes[key]||0,targetMinutes=Number(S.skillTargets[key]||15),targetSeconds=targetMinutes*60,progress=Math.min(100,Math.round(actual/targetSeconds*100)||0);return`<label><span><i style="background:${palette[i%palette.length]}"></i>${skill.l}<b>${progress}%</b></span><div><em style="width:${progress}%;background:${palette[i%palette.length]}"></em></div><small>${timeStr(actual)} / ${targetMinutes} Min</small><input aria-label="Ziel für ${skill.l}" type="range" min="5" max="120" step="5" value="${targetMinutes}" onchange="setSkillTarget('${key}',this.value)"></label>`}).join('')}</div></article></aside></div></main></div>`;
}function setSkillTarget(skill,val){
  const v=parseInt(val)||0;
  if(!S.skillTargets)S.skillTargets={};
  S.skillTargets[skill]=v;
  saveData();render();
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(S.saveTimer);flushStateToServer()}});
window.addEventListener('beforeunload',()=>{clearTimeout(S.saveTimer);flushStateToServer()});
const session=DB.getSession();
if(session&&REQUIRE_SERVER_ACCOUNT&&!authTokens()){DB.clearSession();S.authError=t('auth.sessionExpired');S.screen='auth';render()}
else if(session)loginAs(session,!!authTokens()).catch(()=>{DB.clearSession();localStorage.removeItem(AMOOKHT_TOKEN_KEY);S.currentUser=null;S.authError=t('auth.loadFailed');S.screen='auth';render()});else render();

document.addEventListener('keydown',event=>{if(event.key==='Escape'&&S.mobileNavOpen){S.mobileNavOpen=false;render()}});

if(!window.__errorReviewKeysBound){window.__errorReviewKeysBound=true;document.addEventListener('keydown',event=>{if(!S.reviewMode||!S.currentReview)return;const tag=String(event.target?.tagName||'').toLowerCase();if(event.code==='Space'&&!S.reviewReveal&&tag!=='textarea'&&tag!=='input'){event.preventDefault();revealReviewAnswer();return}if(S.reviewReveal&&tag!=='textarea'&&tag!=='input'){const vocabulary=errorMeta(S.currentReview).kind==='vocabulary',keys=vocabulary?['1','2','3']:['1','2','3','4'];if(keys.includes(event.key)){event.preventDefault();finishReview(Number(event.key)-1)}}})}
</script>
