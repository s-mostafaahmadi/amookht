function contentRecord(value){return !!value&&typeof value==='object'&&!Array.isArray(value)}
function contentArray(value){return Array.isArray(value)?value:value==null?[]:[value]}
function contentStableId(prefix,text,index=0){let hash=2166136261;for(const ch of String(text||'')){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619)}return`custom-${prefix}-${(hash>>>0).toString(36)}-${index+1}`}
function normalizeSkillImportShape(data,skill=currentContentSkill()){
  const aliases=skill==='hoeren'?['hoeren','hören','horen']:[skill];
  const wrapped=contentRecord(data)?aliases.map(name=>data[name]).find(contentRecord):null;
  const root=wrapped||data;
  if(!contentRecord(root))return root;
  if(Array.isArray(root.items))return{items:root.items};
  if(skill==='wortschatz')return{items:Array.isArray(root.vocab)?root.vocab:Array.isArray(root.words)?root.words:[root]};
  if(skill==='grammatik')return{items:Array.isArray(root.grammar)?root.grammar:Array.isArray(root.structures)?root.structures:[root]};
  if(skill==='sprechen'&&Array.isArray(root.tasks))return{items:root.tasks.map(v=>({...v,help:v.help||root.help||null}))};
  return{items:[root]};

function validateContentQuestion(question,path,errors,{typeRequired=false}={}){
  if(!contentRecord(question)){errors.push(`${path} must be an object.`);return}
  if(!String(question.q||question.question||'').trim())errors.push(`${path}.q is required.`);
  if(typeRequired&&!String(question.type||question.question_type||'').trim())errors.push(`${path}.type is required.`);
  if(!String(question.diff||question.difficulty||question.cefr_level||'').trim())errors.push(`${path}.diff is required.`);
  if(!(Number(question.time||question.recommended_answering_time_seconds||question.recommended_time_seconds)>0))errors.push(`${path}.time must be a positive number of seconds.`);
  if(!String(question.a||question.answer||question.correct_answer||'').trim())errors.push(`${path}.a is required.`);
}
function validateTopicContent(data,skill=currentContentSkill(),key=currentContentTopic()){
  const errors=[];
  if(!contentRecord(data))return['Root must be a JSON object.'];
  const items=data.items;
  if(!Array.isArray(items))return['items must be an array.'];
  if(!items.length)errors.push(`No usable ${skill} content found for topic "${key}".`);
  if(['lesen','hoeren','schreiben'].includes(skill)&&items.length!==1)errors.push(`${skill} must contain exactly one item (one text/task).`);
  items.forEach((item,index)=>{
    const path=`items[${index}]`;
    if(!contentRecord(item)){errors.push(`${path} must be an object.`);return}
    if(skill==='wortschatz'){
      [['w','word'],['art','article'],['pl','plural'],['lvl','l','cefr_level'],['en','meaning_english'],['nat','t','meaning_native'],['syn','synonym'],['ant','antonym'],['ex','example_sentence'],['ex_t','example_translation'],['note','usage_note']].forEach(keys=>{if(!String(keys.map(k=>item[k]).find(v=>v!=null)||'').trim())errors.push(`${path}.${keys[0]} is required (use "-" if not applicable).`)});
      const col=item.col||item.collocations;if(!Array.isArray(col)||col.length<3)errors.push(`${path}.col must contain at least 3 collocations.`);
    }else if(skill==='grammatik'){
      ['title','expl','formula','ex','ex_t'].forEach(field=>{const aliases={expl:['expl','explanation'],ex:['ex','example_sentence'],ex_t:['ex_t','example_translation']}[field]||[field];if(!String(aliases.map(k=>item[k]).find(v=>v!=null)||'').trim())errors.push(`${path}.${field} is required.`)});
      const mistakes=item.mistakes||item.common_mistakes||contentArray(item.mistake);if(!Array.isArray(mistakes)||!mistakes.length)errors.push(`${path}.mistakes must be a non-empty array.`);
      if(!Array.isArray(item.exercises)||!item.exercises.length)errors.push(`${path}.exercises must be a non-empty array.`);
      else item.exercises.forEach((q,i)=>validateContentQuestion(typeof q==='string'?{q,diff:S.user.level||'B2',time:60,a:'Musterantwort'}:q,`${path}.exercises[${i}]`,errors));
    }else if(skill==='lesen'||skill==='hoeren'){
      const text=String(item.text||item.script||item.reading_text||'').trim();
      if(!String(item.title||'').trim())errors.push(`${path}.title is required.`);
      if(!text)errors.push(`${path}.text is required.`);
      if(text.length<120)errors.push(`${path}.text is too short; provide a complete text, not a placeholder.`);
      if(skill==='lesen'){
        if(!(Number(item.words||item.approximate_word_count)>0))errors.push(`${path}.words must be a positive number.`);
        if(!(Number(item.time||item.recommended_reading_time_minutes)>0))errors.push(`${path}.time must be a positive number of minutes.`);
      }else{
        if(!(Number(item.duration||item.estimated_duration_minutes)>0))errors.push(`${path}.duration must be a positive number of minutes.`);
        if(!String(item.speed||item.speaking_speed_level||'').trim())errors.push(`${path}.speed is required.`);
        const pre=item.pre_vocab||item.important_vocabulary;if(!Array.isArray(pre)||pre.length!==10)errors.push(`${path}.pre_vocab must contain exactly 10 entries.`);
      }
      if(!Array.isArray(item.questions)||item.questions.length<2)errors.push(`${path}.questions must contain at least 2 questions.`);
      else item.questions.forEach((q,i)=>validateContentQuestion(q,`${path}.questions[${i}]`,errors,{typeRequired:skill==='lesen'}));
    }else if(skill==='schreiben'){
      const minWords=Number(item.min_w||item.required_length_words?.min),maxWords=Number(item.max_w||item.required_length_words?.max);
      if(!String(item.writing_task||item.task||'').trim())errors.push(`${path}.writing_task is required.`);
      if(!(minWords>0))errors.push(`${path}.min_w must be a positive number.`);
      if(!(maxWords>0))errors.push(`${path}.max_w must be a positive number.`);
      if(maxWords<minWords)errors.push(`${path}.max_w must be greater than or equal to min_w.`);
      if(!(Number(item.time||item.recommended_writing_time_minutes)>0))errors.push(`${path}.time must be a positive number of minutes.`);
      if(!contentRecord(item.help))errors.push(`${path}.help must be an object.`);
      else ['vocab','col','redemittel','grammar','connectors','outline'].forEach(field=>{const aliases={vocab:['vocab','key_vocabulary'],col:['col','collocations'],grammar:['grammar','grammar_structures']}[field]||[field];const value=aliases.map(k=>item.help[k]).find(Array.isArray);if(!value?.length)errors.push(`${path}.help.${field} must be a non-empty array.`)});
    }else if(skill==='sprechen'){
      if(!String(item.q||item.question||'').trim())errors.push(`${path}.q is required.`);
      if(!(Number(item.prep||item.preparation_time_seconds)>0))errors.push(`${path}.prep must be positive seconds.`);
      if(!(Number(item.time||item.speaking_time_seconds)>0))errors.push(`${path}.time must be positive seconds.`);
      const structure=item.structure||item.recommended_answer_structure;if(!(Array.isArray(structure)?structure.length:String(structure||'').trim()))errors.push(`${path}.structure is required.`);
    }
  });
  if(skill==='sprechen'&&items.length!==6)errors.push('sprechen must contain exactly 6 tasks.');
  if(skill==='sprechen'&&items.length>=6){
    items.slice(0,4).forEach((item,i)=>{if(!String(item.aspect||'').trim())errors.push(`items[${i}].aspect is required for speaking tasks 1-4.`)});
    items.slice(4,6).forEach((item,i)=>{if(item.custom_aspect_required!==true)errors.push(`items[${i+4}].custom_aspect_required must be true.`)});
  }
  return errors;
}
function normalizeContentImport(raw,key=currentContentTopic(),skill=currentContentSkill()){

  const out={...data};delete out.topic_id;delete out.topic;delete out.skill;
  const normalized=normalizeSkillImportShape(out,skill),errors=validateTopicContent(normalized,skill,key);
  if(errors.length)throw new Error(errors.join(' | '));
  return normalized;
}

function errorKind(error){
  const value=String(error?.type||error?.category||'other').toLowerCase();
  if(/wort|vocab|word|nicht gewusst/.test(value))return'vocabulary';
  if(/gramm/.test(value))return'grammar';
  if(/lesen|read/.test(value))return'reading';
  if(/h[o?]ren|hoeren|listen/.test(value))return'listening';
  if(/schreib|writ/.test(value))return'writing';
  if(/sprech|speak/.test(value))return'speaking';
  return'other';
}

function switchAuthMode(mode){S.authMode=mode;S.authStep='form';S.authError='';S.authNotice='';S.authPending=null;S.authDraft={email:'',name:'',password:''};render()}
function validEmailSyntax(email){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(String(email||'').trim())}

function updateAuthPasswordHints(password){const rules=passwordRuleState(password);document.querySelectorAll('[data-password-rule]').forEach(item=>{const ok=!!rules[item.dataset.passwordRule];item.classList.toggle('text-emerald-500',ok);item.classList.toggle('text-slate-500',!ok);const icon=item.querySelector('i');if(icon)icon.textContent=ok?'✓':'○'})}
function authWaitLabel(seconds){const value=Math.max(1,Number(seconds)||1);if(value>=3600)return t('auth.waitHours',{count:Math.ceil(value/3600)});return t('auth.waitMinutes',{count:Math.ceil(value/60)})}
function authErrorMessage(error){const details=error?.details||{},code=error?.code||'';if(code==='invalid_credentials'&&Number.isFinite(Number(details.attempts_remaining)))return t('auth.invalidAttempts',{count:Number(details.attempts_remaining)});if(code==='login_locked')return t('auth.loginLocked',{duration:authWaitLabel(details.retry_after),level:Number(details.lock_level)||1});const keyByCode={invalid_email:'auth.emailInvalid',email_not_deliverable:'auth.emailInvalid',weak_password:'auth.passwordInvalid',email_exists:'auth.emailExists',name_required:'auth.nameRequired',email_service_unavailable:'auth.emailUnavailable',email_delivery_failed:'auth.emailDeliveryFailed',too_many_requests:'auth.tooMany',verification_expired:'auth.codeExpired',invalid_verification_code:'auth.codeInvalid',verification_locked:'auth.codeLocked',verification_in_progress:'auth.inProgress',invalid_credentials:'auth.invalid',email_not_verified:'auth.emailNotVerified',account_disabled:'auth.accountDisabled',validation_error:'auth.invalidInput'};const key=keyByCode[code];if(key)return t(key);if(error?.status===409)return t('auth.emailExists');if(error?.status===429)return t('auth.tooMany');if(error?.status>=500)return t('auth.serverDetail',{message:error.message||''});return error?.message||t('auth.unexpected')}

?'text-gray-300':'text-gray-700'}">${t('auth.password')}</label><input id="aP" type="password" autocomplete="${isLogin?'current-password':'new-password'}" value="${safeText(draft.password)}" placeholder="••••••••" oninput="S.authDraft.password=this.value;updateAuthPasswordHints(this.value)" onkeydown="if(event.key==='Enter')doAuth()" class="w-full px-4 py-3 rounded-xl border-2 ${S.dark?'bg-gray-700 border-gray-600 text-white focus:border-indigo-400':'border-gray-200 focus:border-indigo-400'} outline-none transition">${!isLogin?`<div class="grid grid-cols-2 gap-1.5 mt-2 text-[11px]">${rule('length','auth.ruleLength')}${rule('lower','auth.ruleLower')}${rule('upper','auth.ruleUpper')}${rule('number','auth.ruleNumber')}</div>`:''}</div>${!isLogin?`<div><label for="aN" class="block mb-1.5 text-sm font-medium ${S.dark?'text-gray-300':'text-gray-700'}">${t('auth.name')}</label><input id="aN" type="text" autocomplete="name" value="${safeText(draft.name)}" placeholder="${t('auth.yourName')}" oninput="S.authDraft.name=this.value" onkeydown="if(event.key==='Enter')doAuth()" class="w-full px-4 py-3 rounded-xl border-2 ${S.dark?'bg-gray-700 border-gray-600 text-white focus:border-indigo-400':'border-gray-200 focus:border-indigo-400'} outline-none transition"></div>`:''}<button ${S.authBusy?'disabled':''} onclick="doAuth()" class="w-full py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-500 to-purple-500 disabled:opacity-50 transition shadow-lg mt-2">${S.authBusy?t('auth.pleaseWait'):(isLogin?t('auth.login'):t('auth.sendCode'))}</button>${isLogin?`<p class="text-center text-[11px] leading-5 text-slate-500">${t('auth.lockPolicy')}</p>`:''}</div>`}</div><button onclick="S.dark=!S.dark;document.documentElement.classList.toggle('dark',S.dark);render()" class="mt-4 mx-auto block p-2 rounded-lg ${S.dark?'bg-gray-700 text-yellow-300':'bg-white text-gray-600'} shadow-sm">${S.dark?'☀️':'🌙'}</button></div></div>`;
}
async function doAuth(){
  if(S.authBusy)return;const email=String(($('#aE')||{}).value??S.authDraft.email??'').trim().toLowerCase(),pass=String(($('#aP')||{}).value??S.authDraft.password??''),name=S.authMode==='register'?String(($('#aN')||{}).value??S.authDraft.name??'').trim():'';S.authDraft={email,name,password:pass};S.authError='';S.authNotice='';
  if(!email||!pass){S.authError=t('auth.required');render();return}if(!validEmailSyntax(email)){S.authError=t('auth.emailInvalid');render();return}if(S.authMode==='register'&&!name){S.authError=t('auth.nameRequired');render();return}if(S.authMode==='register'&&!strongPassword(pass)){S.authError=t('auth.passwordInvalid');render();return}
  S.authBusy=true;render();try{if(S.authMode==='register'){const started=await apiRequest('/auth/register/request',{method:'POST',body:JSON.stringify({email,password:pass,display_name:name})});S.authPending={verificationId:started.verification_id,email:started.email,name,password:pass};S.authDraft={email:started.email,name,password:''};S.authStep='verify';S.authNotice=t('auth.codeSent');S.authError='';return}const tokens=await apiRequest('/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});localStorage.setItem(AMOOKHT_TOKEN_KEY,JSON.stringify(tokens));const users=DB.getUsers();users[email]={password:DB.hash(pass),name:users[email]?.name||email.split('@')[0]};DB.saveUsers(users);S.authDraft={email:'',name:'',password:''};await loginAs(email,true)}catch(error){console.warn('Authentication failed:',error);localStorage.removeItem(AMOOKHT_TOKEN_KEY);DB.clearSession();S.currentUser=null;S.serverConnected=false;S.syncStatus='local';S.authError=authErrorMessage(error)}finally{S.authBusy=false;if(S.screen==='auth')render()}
}
async function verifyRegistrationCode(){
  if(S.authBusy||!S.authPending)return;const code=String(document.getElementById('authCode')?.value||'').trim();S.authError='';S.authNotice='';if(!/^\d{5}$/.test(code)){S.authError=t('auth.codeInvalid');render();return}S.authBusy=true;render();try{const pending=S.authPending,tokens=await apiRequest('/auth/register/verify',{method:'POST',body:JSON.stringify({verification_id:pending.verificationId,code})});localStorage.setItem(AMOOKHT_TOKEN_KEY,JSON.stringify(tokens));const users=DB.getUsers();users[pending.email]={password:DB.hash(pending.password),name:pending.name};DB.saveUsers(users);if(!DB.getData(pending.email))DB.saveData(pending.email,{user:{name:pending.name,level:'',examDate:'',dailyMinutes:60,weakSkills:[],topic:'',subtopic:'',customTopic:'',examPlan:'',customPlans:[],profileCompleted:false,nativeLanguage:'fa',timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Tehran',learningGoal:'',notifications:true,reducedMotion:false,avatarDataUrl:''},plan:null,completed:[],points:0,history:[],streak:0,errors:[],favorites:[]});const email=pending.email;S.authPending=null;S.authDraft={email:'',name:'',password:''};S.authStep='form';await loginAs(email,true)}catch(error){console.warn('Verification failed:',error);S.authError=authErrorMessage(error)}finally{S.authBusy=false;if(S.screen==='auth')render()}
}

  const lang=S.uiLanguage||'fa',map=uiCopyMap(),dir='ltr';document.documentElement.lang=lang;document.documentElement.dir='ltr';root.setAttribute('dir','ltr');

function render(){

  applyAppPreferences();
  switch(S.screen){
    case'landing':html(a,renderLanding());break;
    case'auth':html(a,renderAuth());break;
    case'planSelect':html(a,renderPlanSelect());break;
    case'testdafSim':html(a,renderTestDaFSimulation());break;
    case'customPlanBuilder':html(a,renderCustomPlanBuilder());break;
    case'customActivity':html(a,renderCustomActivity());break;
    case'onboarding':html(a,renderOnboarding());break;
    case'dashboard':html(a,renderDashboard());break;
    case'vocabulary':html(a,renderVocabulary());break;
    case'grammar':html(a,renderGrammar());break;
    case'writing':html(a,renderWriting());break;
    case'listening':html(a,renderListening());break;
    case'vocabReview':html(a,renderVocabReview());break;
    case'gesamttest':html(a,renderGesamttest());break;
    case'contractActivity':html(a,renderContractActivity());break;
    case'errorbook':html(a,renderErrorBook());break;
    case'favorites':html(a,renderFavorites());break;
    case'summary':html(a,renderSummary());break;
    case'history':html(a,renderHistory());break;
    case'settings':html(a,renderSettings());break;

function navigateApp(target){
  S.mobileNavOpen=false;
  if(S.activeActivity&&S.screen!=='dashboard'){pauseActivity();S.activeActivity=null}
  if(target==='history'){openHistory();return}
  if(target==='testdafSim')S.testdafExamLibraryView=true;
  if(target==='dashboard'&&!S.user.examPlan){S.screen='planSelect'}else if(target==='dashboard'&&!S.plan){S.screen='onboarding'}else S.screen=target;
  saveData();render();if(target==='testdafSim')loadGlobalTestdafExams().then(()=>{if(S.screen==='testdafSim')render()});
}

const BUILTIN_TESTDAF_EXAM_ID='builtin-testdaf-1';
function testdafExamLibraryEntries(){const builtin={id:BUILTIN_TESTDAF_EXAM_ID,title:'TestDaF Modellprüfung 1',description:'Vollständige TestDaF-Simulation mit 40 Leseaufgaben, 35 Höraufgaben, Schreiben und 7 Sprechaufgaben.',builtin:true,created_at:'2026-07-28',data:AMOOKHT_TESTDAF_SIM_DATA};return[builtin,...(S.testdafExamLibraryRemote||[]).filter(exam=>exam?.id&&exam.id!==BUILTIN_TESTDAF_EXAM_ID&&exam.data)]}
function selectedTestdafExam(){const entries=testdafExamLibraryEntries();return entries.find(exam=>exam.id===S.selectedTestdafExamId)||entries[0]}
async function loadGlobalTestdafExams(){try{const payload=await apiRequest('/testdaf-exams',{},false);S.testdafExamLibraryRemote=Array.isArray(payload?.exams)?payload.exams:[];S.testdafExamLibraryLoaded=true;S.testdafExamMessage=''}catch(error){console.warn('TestDaF exam library unavailable:',error);S.testdafExamLibraryRemote=S.testdafExamLibraryRemote||[];S.testdafExamLibraryLoaded=true;S.testdafExamMessage='Die öffentliche Prüfungsliste konnte nicht aktualisiert werden.'}return S.testdafExamLibraryRemote}
function validateTestdafExamData(data){if(!data||typeof data!=='object')throw new Error('Die Prüfungsdaten fehlen.');for(const section of['lesen','hoeren','schreiben','sprechen'])if(!data[section]||typeof data[section]!=='object')throw new Error(`Bereich ${section} fehlt.`);const lesenTexts=data.lesen.texts,hoerenTexts=data.hoeren.texts,sprechenTasks=data.sprechen.tasks;if(!Array.isArray(lesenTexts)||lesenTexts.length!==4)throw new Error('Lesen benötigt genau 4 Texte.');const lesenQuestions=lesenTexts.reduce((sum,item)=>sum+(Array.isArray(item?.questions)?item.questions.length:0),0);if(lesenQuestions!==40)throw new Error(`Lesen benötigt genau 40 Fragen; gefunden: ${lesenQuestions}.`);if(!Array.isArray(hoerenTexts)||hoerenTexts.length!==4)throw new Error('Hören benötigt genau 4 Texte.');const hoerenQuestions=hoerenTexts.reduce((sum,item)=>sum+(Array.isArray(item?.questions)?item.questions.length:0),0);if(hoerenQuestions!==35)throw new Error(`Hören benötigt genau 35 Fragen; gefunden: ${hoerenQuestions}.`);if(!Array.isArray(data.schreiben.chart)||data.schreiben.chart.length<3||Number(data.schreiben.min)!==350||Number(data.schreiben.max)!==400)throw new Error('Schreiben benötigt eine Grafik und den Wortbereich 350–400.');if(!Array.isArray(sprechenTasks)||sprechenTasks.length!==7)throw new Error('Sprechen benötigt genau 7 Aufgaben.');return{lesenQuestions,hoerenQuestions,sprechenTasks:sprechenTasks.length}}
function parseTestdafExamFile(raw){const source=String(raw||'').replace(/^\uFEFF/,'').trim();let payload=null;try{payload=JSON.parse(source)}catch{const match=source.match(/^(?:const|let|var)\s+(?:AMOOKHT_TESTDAF_EXAM|AMOOKHT_TESTDAF_SIM_DATA)\s*=\s*([\s\S]*?);?\s*$/);if(!match)throw new Error('Nur JSON oder eine von Amookht exportierte testdaf-simulation-data.js ist erlaubt.');try{payload=JSON.parse(match[1].trim())}catch{throw new Error('Die JS-Datei enthält kein gültiges exportiertes JSON. Bitte zuerst die Amookht-Vorlage herunterladen.')}}const meta=payload?.meta||{},data=payload?.data||payload?.exam?.data||payload;const stats=validateTestdafExamData(data);return{meta,data,stats}}
async function handleTestdafExamFile(input){const file=input?.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw new Error('Die Datei darf höchstens 5 MB groß sein.');const parsed=parseTestdafExamFile(await file.text()),fallback=file.name.replace(/\.(?:json|js)$/i,'').replace(/[-_]+/g,' ');S.testdafExamImport={id:parsed.meta.id||'',title:parsed.meta.title||fallback||'Neue TestDaF-Prüfung',description:parsed.meta.description||'',source_filename:file.name,data:parsed.data,stats:parsed.stats};S.testdafExamMessage='Datei geprüft: 40 Lesen · 35 Hören · 1 Schreiben · 7 Sprechen.'}catch(error){S.testdafExamImport=null;S.testdafExamMessage='Importfehler: '+error.message}finally{input.value=''}render()}
function updateTestdafExamImport(field,value){if(!S.testdafExamImport)return;S.testdafExamImport[field]=String(value||'')}
function cancelTestdafExamImport(){S.testdafExamImport=null;S.testdafExamMessage='';render()}
function downloadTestdafExam(examId=BUILTIN_TESTDAF_EXAM_ID){if(!isGlobalContentAdmin())return;const exam=testdafExamLibraryEntries().find(item=>item.id===examId);if(!exam)return;const payload={meta:{id:exam.builtin?'':exam.id,title:exam.title,description:exam.description,format_version:1},data:exam.data},source=`const AMOOKHT_TESTDAF_EXAM=${JSON.stringify(payload,null,2)};\n`,blob=new Blob([source],{type:'text/javascript;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a'),slug=String(exam.title||'testdaf-exam').toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-').replace(/^-|-$/g,'');link.href=url;link.download=`${slug||'testdaf'}-simulation-data.js`;link.click();URL.revokeObjectURL(url)}
async function saveImportedTestdafExam(){const draft=S.testdafExamImport;if(!draft)return;draft.title=String(draft.title||'').trim();if(draft.title.length<3){S.testdafExamMessage='Bitte einen Namen mit mindestens 3 Zeichen eingeben.';render();return}try{validateTestdafExamData(draft.data);const result=await apiRequest('/testdaf-exams',{method:'POST',body:JSON.stringify({id:draft.id||null,title:draft.title,description:draft.description||'',source_filename:draft.source_filename||'',data:draft.data})});S.testdafExamImport=null;await loadGlobalTestdafExams();S.testdafExamMessage=`„${result.exam.title}“ wurde für alle Benutzer veröffentlicht.`;render()}catch(error){S.testdafExamMessage='Speichern fehlgeschlagen: '+error.message;render()}}
async function deleteGlobalTestdafExam(examId){if(!isGlobalContentAdmin()||examId===BUILTIN_TESTDAF_EXAM_ID)return;if(!confirm('Diese öffentliche Prüfung für alle Benutzer löschen?'))return;try{await apiRequest(`/testdaf-exams/${encodeURIComponent(examId)}`,{method:'DELETE'});if(S.selectedTestdafExamId===examId){S.selectedTestdafExamId=BUILTIN_TESTDAF_EXAM_ID;S.testdafSim=S.testdafExamStates[BUILTIN_TESTDAF_EXAM_ID]||newTestdafSimState(BUILTIN_TESTDAF_EXAM_ID)}await loadGlobalTestdafExams();S.testdafExamMessage='Prüfung gelöscht.';saveData();render()}catch(error){S.testdafExamMessage='Löschen fehlgeschlagen: '+error.message;render()}}
function rememberTestdafExamVisit(examId,completed=false){const now=new Date().toISOString(),old=S.testdafExamVisits?.[examId]||{};S.testdafExamVisits=S.testdafExamVisits||{};S.testdafExamVisits[examId]={...old,firstVisitedAt:old.firstVisitedAt||now,lastVisitedAt:now,lastVisitedDate:today(),completedAt:completed?(old.completedAt||now):old.completedAt||null}}
function testdafExamStatus(examId){const visit=S.testdafExamVisits?.[examId],state=S.testdafExamStates?.[examId],completed=!!(visit?.completedAt||state?.finished),started=!!state?.started;if(completed)return{kind:'done',label:S.uiLanguage==='fa'?'✓ انجام‌شده':S.uiLanguage==='en'?'✓ Completed':'✓ Abgeschlossen'};if(visit||started)return{kind:started?'progress':'visited',label:S.uiLanguage==='fa'?'✓ بازدید شده':S.uiLanguage==='en'?'✓ Visited':'✓ Besucht'};return{kind:'new',label:S.uiLanguage==='fa'?'جدید':S.uiLanguage==='en'?'New':'Neu'}}
function openTestdafExam(examId){const exam=testdafExamLibraryEntries().find(item=>item.id===examId);if(!exam)return;const currentId=S.selectedTestdafExamId||BUILTIN_TESTDAF_EXAM_ID;S.testdafExamStates=S.testdafExamStates||{};if(S.testdafSim)S.testdafExamStates[currentId]=S.testdafSim;S.selectedTestdafExamId=examId;S.testdafSim=S.testdafExamStates[examId]||newTestdafSimState(examId);S.testdafExamStates[examId]=S.testdafSim;rememberTestdafExamVisit(examId,false);S.testdafExamLibraryView=false;saveData();render()}

function renderTestdafExamLibrary(){const exams=testdafExamLibraryEntries(),admin=isGlobalContentAdmin(),message=S.testdafExamMessage||'';return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gradient-to-br from-indigo-50 via-white to-cyan-50 text-gray-900'} pb-28"><main class="max-w-6xl mx-auto p-4 pt-7"><header class="flex flex-wrap items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-[.18em] text-indigo-500">TestDaF Exam</p><h1 class="mt-2 text-3xl md:text-5xl font-black">Prüfungsbibliothek</h1><p class="mt-3 text-sm text-gray-500">Wähle eine öffentliche Modellprüfung. Dein Fortschritt wird pro Prüfung und Konto gespeichert.</p></div><button onclick="loadGlobalTestdafExams().then(()=>render())" class="px-4 py-2.5 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow font-bold">Liste aktualisieren</button></header>${message?`<div class="mt-5 p-4 rounded-2xl ${message.includes('fehler')||message.includes('fehlgeschlagen')?'bg-red-100 text-red-700':'bg-indigo-100 text-indigo-700'} text-sm font-semibold">${safeText(message)}</div>`:''}<section class="mt-7 grid md:grid-cols-2 xl:grid-cols-3 gap-4">${exams.map((exam,index)=>{const status=testdafExamStatus(exam.id),visit=S.testdafExamVisits?.[exam.id],state=S.testdafExamStates?.[exam.id],date=visit?.lastVisitedAt?new Date(visit.lastVisitedAt).toLocaleDateString(S.uiLanguage==='fa'?'fa-IR':S.uiLanguage==='en'?'en-GB':'de-DE'):'';return`<article class="relative overflow-hidden rounded-3xl border ${status.kind==='done'?'border-emerald-400':status.kind==='visited'||status.kind==='progress'?'border-amber-400':S.dark?'border-gray-700':'border-white'} ${S.dark?'bg-gray-800':'bg-white'} shadow-xl p-6"><div class="absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r ${index%3===0?'from-indigo-500 to-cyan-400':index%3===1?'from-purple-500 to-pink-500':'from-emerald-500 to-cyan-500'}"></div><div class="flex items-start justify-between gap-3"><div><span class="inline-flex px-2.5 py-1 rounded-full text-[10px] font-black ${status.kind==='done'?'bg-emerald-100 text-emerald-700':status.kind==='visited'||status.kind==='progress'?'bg-amber-100 text-amber-700':'bg-indigo-100 text-indigo-700'}">${safeText(status.label)}</span><h2 class="mt-3 text-xl font-black">${safeText(exam.title)}</h2></div><span class="text-3xl">${exam.builtin?'🎓':'📝'}</span></div><p class="mt-3 min-h-12 text-sm leading-6 text-gray-500">${safeText(exam.description||'Öffentliche TestDaF-Modellprüfung')}</p><div class="mt-4 flex flex-wrap gap-2 text-[10px]"><span class="px-2 py-1 rounded bg-indigo-100 text-indigo-700">40 Lesen</span><span class="px-2 py-1 rounded bg-purple-100 text-purple-700">35 Hören</span><span class="px-2 py-1 rounded bg-amber-100 text-amber-700">1 Schreiben</span><span class="px-2 py-1 rounded bg-rose-100 text-rose-700">7 Sprechen</span></div>${date?`<p class="mt-3 text-xs text-gray-400">Zuletzt besucht: ${safeText(date)}${state?.finished?' · abgeschlossen':''}</p>`:''}<button onclick='openTestdafExam(${JSON.stringify(exam.id)})' class="mt-5 w-full py-3 rounded-xl bg-indigo-600 text-white font-black">${state?.started?(state.finished?'Ergebnis öffnen':'Fortsetzen'):'Prüfung auswählen'}</button>${admin?`<div class="mt-2 grid ${exam.builtin?'grid-cols-1':'grid-cols-2'} gap-2"><button onclick='downloadTestdafExam(${JSON.stringify(exam.id)})' class="py-2 rounded-xl bg-cyan-100 text-cyan-700 text-xs font-bold">JS herunterladen</button>${exam.builtin?'':`<button onclick='deleteGlobalTestdafExam(${JSON.stringify(exam.id)})' class="py-2 rounded-xl bg-red-100 text-red-700 text-xs font-bold">Entfernen</button>`}</div>`:''}</article>`}).join('')}</section>${admin?renderTestdafExamAdminPanel():''}</main></div>`}
function renderTestdafExamAdminPanel(){const draft=S.testdafExamImport;return`<section class="mt-7 rounded-3xl ${S.dark?'bg-gray-800 border-gray-700':'bg-white border-indigo-100'} border shadow-xl p-5 md:p-7"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="text-xs font-black text-emerald-500 uppercase tracking-[.16em]">Administrator</p><h2 class="mt-1 text-2xl font-black">Öffentliche Prüfung hinzufügen</h2><p class="mt-2 text-sm text-gray-500">Nur validierte Prüfungen werden für alle Benutzer veröffentlicht.</p></div><button onclick="downloadTestdafExam(BUILTIN_TESTDAF_EXAM_ID)" class="px-4 py-2.5 rounded-xl bg-cyan-100 text-cyan-700 text-sm font-bold">testdaf-simulation-data.js herunterladen</button></div><label class="mt-5 min-h-28 rounded-2xl border-2 border-dashed ${S.dark?'border-gray-600 bg-gray-900':'border-indigo-200 bg-indigo-50/50'} flex flex-col items-center justify-center text-center p-5 cursor-pointer"><b>JS- oder JSON-Prüfungsdatei auswählen</b><span class="mt-1 text-xs text-gray-500">Amookht-Export · maximal 5 MB</span><input type="file" accept=".js,.json,application/json,text/javascript" class="hidden" onchange="handleTestdafExamFile(this)"></label>${draft?`<div class="mt-5 grid md:grid-cols-2 gap-3"><label class="text-sm font-bold">Prüfungsname<input value="${safeText(draft.title)}" oninput="updateTestdafExamImport('title',this.value)" class="mt-1 w-full px-4 py-3 rounded-xl border ${S.dark?'bg-gray-900 border-gray-700':'border-gray-200'}"></label><label class="text-sm font-bold">Quelldatei<input disabled value="${safeText(draft.source_filename)}" class="mt-1 w-full px-4 py-3 rounded-xl border opacity-60 ${S.dark?'bg-gray-900 border-gray-700':'bg-gray-100 border-gray-200'}"></label><label class="md:col-span-2 text-sm font-bold">Beschreibung<textarea oninput="updateTestdafExamImport('description',this.value)" class="mt-1 w-full h-24 px-4 py-3 rounded-xl border ${S.dark?'bg-gray-900 border-gray-700':'border-gray-200'}">${s const TESTDAF_SIM_SECTIONS={lesen:{label:'Lesen',minutes:60,parts:4,items:40,desc:'4 akademische Lesetexte mit insgesamt 40 Aufgaben.'},hoeren:{label:'Hören',minutes:40,parts:4,items:35,desc:'4 Hörtexte mit Auswahl-, Lücken- und Zusammenfassungsaufgaben.'},schreiben:{label:'Schreiben',minutes:60,parts:1,items:1,desc:'1 Grafikaufgabe und ein strukturierter Text mit 350–400 Wörtern.'},sprechen:{label:'Sprechen',minutes:35,parts:7,items:7,desc:'7 hochschultypische Aufgaben mit Vorbereitung und Audioaufnahme.'}};
function testdafSimData(){return selectedTestdafExam()?.data||AMOOKHT_TESTDAF_SIM_DATA}
function newTestdafSimState(examId=S.selectedTestdafExamId||BUILTIN_TESTDAF_EXAM_ID){return{version:3,examId,started:false,finished:false,active:'overview',sectionStarts:{},answers:{lesen:{},hoeren:{},schreiben:'',sprechen:{}},recordings:{},done:{}}}
function ensureTestdafSimState(){const examId=S.selectedTestdafExamId||BUILTIN_TESTDAF_EXAM_ID;S.testdafExamStates=S.testdafExamStates||{};let state=S.testdafExamStates[examId];if(!state&&S.testdafSim?.examId===examId)state=S.testdafSim;if(!state&&examId===BUILTIN_TESTDAF_EXAM_ID&&S.testdafSim&&!S.testdafSim.examId)state=S.testdafSim;if(!state)state=newTestdafSimState(examId);if(state.version!==3||state.examId!==examId)state={...newTestdafSimState(examId),...state,version:3,examId};state.answers=state.answers||{lesen:{},hoeren:{},schreiben:'',sprechen:{}};state.answers.lesen=state.answers.lesen||{};state.answers.hoeren=state.answers.hoeren||{};state.answers.sprechen=state.answers.sprechen||{};state.recordings=state.recordings||{};state.sectionStarts=state.sectionStarts||{};state.done=state.done||{};S.testdafSim=state;S.testdafExamStates[examId]=state;return state}
function resetTestDaFSimulation(){if(S.speakingRecorder?.state==='recording')S.speakingRecorder.stop();const id=S.selectedTestdafExamId||BUILTIN_TESTDAF_EXAM_ID;S.testdafSim=newTestdafSimState(id);S.testdafExamStates=S.testdafExamStates||{};S.testdafExamStates[id]=S.testdafSim;S.simSpeakingStatus='idle';saveData();render()}
function startTestDaFSimulation(){const sim=ensureTestdafSimState();sim.started=true;sim.active='overview';sim.finished=false;rememberTestdafExamVisit(sim.examId,false);saveData();render()}
function openTestDaFSimSection(id){const sim=ensureTestdafSimState();sim.started=true;sim.active=id;if(!sim.sectionStarts[id])sim.sectionStarts[id]=Date.now();rememberTestdafExamVisit(sim.examId,false);saveData();render()}
function pauseTestDaFSimSection(){ensureTestdafSimState().active='overview';if(S.testdafSimTimer){clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}saveData();render()}
function simTotalItems(id,data=testdafSimData()){if(id==='lesen'||id==='hoeren')return data[id].texts.reduce((sum,part)=>sum+part.questions.length,0);if(id==='schreiben')return 1;if(id==='sprechen')return data.sprechen.tasks.length;return 0}
function simHasAnswer(value){return value!==undefined&&value!==null&&String(value).trim()!==''}
function simAnsweredCount(id,data=testdafSimData()){const sim=ensureTestdafSimState();if(id==='lesen'||id==='hoeren')return Object.values(sim.answers[id]||{}).filter(simHasAnswer).length;if(id==='schreiben')return simWordCount(sim.answers.schreiben)>0;if(id==='sprechen')return Object.keys(sim.recordings||{}).length;return 0}
function normalizeSimAnswer(value){return String(value??'').toLocaleLowerCase('de-DE').normalize('NFKC').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}
function simQuestionCorrect(question,value){if(question.type==='mc')return Number(value)===Number(question.answer);const actual=normalizeSimAnswer(value);return String(question.answer||'').split('|').some(answer=>normalizeSimAnswer(answer)===actual)}
function simAutoStats(id,data=testdafSimData()){let correct=0,total=0;if(id!=='lesen'&&id!=='hoeren')return{correct,total};data[id].texts.forEach((part,pi)=>part.questions.forEach((q,qi)=>{if(q.type==='summary')return;total++;if(simQuestionCorrect(q,ensureTestdafSimState().answers[id]?.[`${pi}-${qi}`]))correct++}));return{correct,total}}
function simWordCount(value){return String(value||'').trim()?String(value).trim().split(/\s+/).length:0}
function simWritingAnswer(value){ensureTestdafSimState().answers.schreiben=value;const count=simWordCount(value),counter=$('#simWritingCount');if(counter){counter.textContent=`${count} Wörter`;counter.className=`font-bold ${count>=350&&count<=400?'text-emerald-500':'text-amber-500'}`}saveData()}
function finishTestDaFSimSection(id){const sim=ensureTestdafSimState(),data=testdafSimData(),answered=simAnsweredCount(id,data),total=simTotalItems(id,data);if(id==='sprechen'&&S.speakingRecorder?.state==='recording'){alert('Bitte stoppen Sie zuerst die laufende Aufnahme.');return}if(id==='schreiben'){const words=simWordCount(sim.answers.schreiben);if(words<350||words>400){alert(`Der Text muss 350–400 Wörter enthalten. Aktuell: ${words}.`);return}}if(answered<total&&!confirm(`${total-answered} Aufgabe(n) sind noch unbeantwortet. Abschnitt trotzdem abgeben?`))return;if(S.testdafSimTimer){clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}sim.done[id]=true;sim.active='overview';delete sim.sectionStarts[id];if(['lesen','hoeren','schreiben','sprechen'].every(key=>sim.done[key])){sim.finished=true;sim.finishedAt=sim.finishedAt||new Date().toISOString();rememberTestdafExamVisit(sim.examId,true)}else rememberTestdafExamVisit(sim.examId,false);S.testdafExamStates[sim.examId]=sim;saveData();render()}
function simAnswer(section,key,value){const sim=ensureTestdafSimState();sim.answers[section]=sim.answers[section]||{};sim.answers[section][key]=value;saveData();const data=testdafSimData(),counter=$('#simAnswered');if(counter)counter.textContent=`${simAnsweredCount(section,data)}/${simTotalItems(section,data)}`}
function simRemaining(section){const sim=ensureTestdafSimState(),started=sim.sectionStarts[section]||Date.now(),limit=(TESTDAF_SIM_SECTIONS[section]?.minutes||0)*60,elapsed=Math.floor((Date.now()-started)/1000);return Math.max(0,limit-elapsed)}
function playSimHoeren(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}catch(e){console.warn('speech synthesis unavailable',e)}}
function stopSimHoeren(){try{speechSynthesis.cancel()}catch{}}
function renderTestDaFSimulation(){
  if(S.testdafExamLibraryView!==false)return renderTestdafExamLibrary();
  const exam=selectedTestdafExam(),sim=ensureTestdafSimState(),data=testdafSimData(),done=sim.done||{},sections=['lesen','hoeren','schreiben','sprechen'];
  if(!sim.started)return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gradient-to-br from-indigo-50 via-white to-cyan-50'} pb-28"><main class="max-w-5xl mx-auto p-4 pt-8"><button onclick="showTestdafExamLibrary()" class="px-4 py-2 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow">← Prüfungsbibliothek</button><section class="mt-6 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow-xl overflow-hidden"><div class="h-2 bg-gradient-to-r from-indigo-600 via-cyan-500 to-emerald-500"></div><div class="p-8 md:p-10"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="text-sm font-bold text-indigo-500">TestDaF Prüfungssimulation</p><h1 class="mt-2 text-3xl md:text-5xl font-black">${safeText(exam.title)}</h1></div>${testdafExamStatus(exam.id).kind!=='new'?`<span class="px-3 py-1.5 rounded-full bg-amber-100 text-amber-700 text-xs font-black">${safeText(testdafExamStatus(exam.id).label)}</span>`:''}</div><p class="mt-4 max-w-3xl leading-8 ${S.dark?'text-gray-300':'text-gray-600'}">${safeText(exam.description||'Eine vollständige TestDaF-Modellprüfung.')}</p><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-8">${sections.map(id=>`<div class="p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><b>${TESTDAF_SIM_SECTIONS[id].label}</b><p class="text-xs mt-1 text-gray-500">${TESTDAF_SIM_SECTIONS[id].minutes} min · ${TESTDAF_SIM_SECTIONS[id].parts} Teile · ${TESTDAF_SIM_SECTIONS[id].items} Aufgaben</p></div>`).join('')}</div><button onclick="startTestDaFSimulation()" class="mt-8 px-7 py-4 rounded-2xl bg-indigo-600 text-white font-black shadow-lg">Simulation starten</button></div></section></main></div>`;
  if(sim.active&&sim.active!=='overview')return renderTestDaFSimSection(sim.active,data[sim.active]);
  const completed=sections.filter(key=>done[key]).length,lesenStats=simAutoStats('lesen',data),hoerenStats=simAutoStats('hoeren',data);
  return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gray-50 text-gray-900'} pb-28"><main class="max-w-6xl mx-auto p-4 pt-6"><header class="flex flex-wrap items-center justify-between gap-3 mb-5"><div class="flex items-start gap-3"><button onclick="showTestdafExamLibrary()" class="mt-1 px-3 py-2 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow text-sm font-bold">← Liste</button><div><p class="text-xs font-bold text-indigo-500">TestDaF Simulation</p><h1 class="text-2xl md:text-3xl font-black">${safeText(exam.title)}</h1><p class="text-sm text-gray-500 mt-1">${completed}/4 Bereiche abgeschlossen</p></div></div><button onclick="resetTestDaFSimulation()" class="px-4 py-2 rounded-xl bg-red-100 text-red-700 font-bold">Neu starten</button></header>${sim.finished?`<section class="mb-5 p-6 rounded-3xl bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800"><div class="flex items-start justify-between gap-3"><div><h2 class="text-2xl font-black text-emerald-700 dark:text-emerald-300">✓ Simulation abgeschlossen</h2><p class="mt-1 text-sm text-emerald-600">Diese Prüfung bleibt in deiner Liste als abgeschlossen markiert.</p></div><button onclick="showTestdafExamLibrary()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-bold">Weitere Prüfung</button></div><div class="grid sm:grid-cols-4 gap-3 mt-4 text-sm"><div><b>Lesen</b><p>${lesenStats.correct}/${lesenStats.total} automatisch richtig</p></div><div><b>Hören</b><p>${hoerenStats.correct}/${hoerenStats.total} objektiv richtig</p></div><div><b>Schreiben</b><p>${simWordCount(sim.answers.schreiben)} Wörter</p></div><div><b>Sprechen</b><p>${Object.keys(sim.recordings||{}).length}/7 Aufnahmen</p></div></div></section>`:''}<section class="grid md:grid-cols-2 gap-4">${sections.map(id=>`<button onclick="openTestDaFSimSection('${id}')" class="text-left p-6 rounded-3xl border ${done[id]?'border-emerald-300 bg-emerald-50 dark:bg-emerald-900/20':'border-transparent '+(S.dark?'bg-gray-800':'bg-white')} shadow hover:-translate-y-1 transition"><div class="flex justify-between gap-3"><div><h2 class="text-2xl font-black">${TESTDAF_SIM_SECTIONS[id].label}</h2><p class="mt-2 text-sm text-gray-500">${TESTDAF_SIM_SECTIONS[id].desc}</p></div><span class="text-sm font-bold ${done[id]?'text-emerald-600':'text-indigo-600'}">${done[id]?'Done':simAnsweredCount(id,data)?'Weiter':'Start'}</span></div><div class="mt-5 flex flex-wrap gap-2 text-xs"><span class="px-2 py-1 rounded bg-indigo-100 text-indigo-700">${TESTDAF_SIM_SECTIONS[id].minutes} min</span><span class="px-2 py-1 rounded bg-slate-100 text-slate-600">${TESTDAF_SIM_SECTIONS[id].parts} Teile</span><span class="px-2 py-1 rounded bg-cyan-100 text-cyan-700">${simAnsweredCount(id,data)}/${simTotalItems(id,data)} beantwortet</span></div></button>`).join('')}</section></main></div>`;
}
function renderTestDaFSimSection(id,content){const meta=TESTDAF_SIM_SECTIONS[id],remaining=simRemaining(id),data=testdafSimData();if(S.testdafSimTimer)clearInterval(S.testdafSimTimer);S.testdafSimTimer=setInterval(()=>{if(S.screen==='testdafSim'&&ensureTestdafSimState().active===id){const e=$('#simTimer');if(e)e.textContent=timeStr(simRemaining(id))}else{clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}},1000);return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gray-50 text-gray-900'} pb-28"><main class="max-w-5xl mx-auto p-4 pt-6"><header class="sticky top-0 z-30 flex items-center justify-between gap-2 mb-4 p-3 rounded-2xl ${S.dark?'bg-gray-900/95':'bg-gray-50/95'} backdrop-blur"><button onclick="pauseTestDaFSimSection()" class="px-3 py-2 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow">Übersicht</button><div class="text-center"><h1 class="font-black text-lg">${meta.label}</h1><div class="flex items-center justify-center gap-2 text-xs"><span id="simTimer" class="font-mono text-indigo-500">${timeStr(remaining)}</span><span class="text-gray-400">·</span><span id="simAnswered" class="font-bold">${simAnsweredCount(id,data)}/${simTotalItems(id,data)}</span></div></div><button onclick="finishTestDaFSimSection('${id}')" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">Abgeben</button></header>${id==='lesen'?renderSimLesen(content):id==='hoeren'?renderSimHoeren(content):id==='schreiben'?renderSimSchreiben(content):renderSimSprechen(content)}</main></div>`}
function renderSimLesen(content){let globalNo=0;return`<div class="space-y-5">${content.texts.map((part,pi)=>`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-indigo-500 font-bold">Text ${pi+1} · ${part.questions.length} Aufgaben</p><h2 class="font-black text-xl mt-1">${safeText(part.title)}</h2></div><span class="text-xs text-gray-500">${part.time} min</span></div><article data-learning-content class="mt-4 leading-8 whitespace-pre-line ${S.dark?'text-gray-200':'text-gray-700'}">${safeText(part.text)}</article><div class="mt-5 space-y-4">${part.questions.map((q,qi)=>{const key=`${pi}-${qi}`,val=ensureTestdafSimState().answers?.lesen?.[key],number=++globalNo;return`<div class="favorite-anchor p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}">${favoriteButton({kind:'reading',skill:'lesen',sourceId:'sim-reading-'+key,title:q.q,subtitle:part.title||'TestDaF Lesen',answer:q.options?.[Number(q.answer)]||q.options?.[q.c]||q.a||'',context:part.text||'',source:'testdaf-exam'},'favorite-overlay')}<b class="block pr-16">${number}. ${safeText(q.q)}</b><div class="mt-3 grid gap-2">${q.options.map((opt,oi)=>`<label class="flex gap-2 items-start text-sm p-2 rounded-xl hover:bg-indigo-50 dark:hover:bg-gray-800"><input type="radio" name="sim-l-${key}" class="mt-1" ${String(val)===String(oi)?'checked':''} onchange="simAnswer('lesen','${key}',${oi})"><span>${safeText(opt)}</span></label>`).join('')}</div></div>`}).join('')}</div></section>`).join('')}</div>`}
function renderSimHoerenQuestion(q,key,number){const val=ensureTestdafSimState().answers?.hoeren?.[key],typeLabel=q.type==='mc'?'Mehrfachauswahl':q.type==='gap'?'Lücke':'Zusammenfassung';return`<div class="favorite-anchor mt-4 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}">${favoriteButton({kind:'listening',skill:'hoeren',sourceId:'sim-listening-'+key,title:q.q,subtitle:typeLabel,answer:q.options?.[Number(q.answer)]||q.options?.[q.c]||q.a||q.answer||'',source:'testdaf-exam'},'favorite-overlay')}<div class="flex items-start gap-2 pr-16"><span class="shrink-0 px-2 py-1 rounded-lg bg-purple-100 text-purple-700 text-[10px] font-bold">${typeLabel}</span><b>${number}. ${safeText(q.q)}</b></div>${q.type==='mc'?`<div class="mt-3 grid gap-2">${q.options.map((opt,oi)=>`<label class="flex gap-2 items-start text-sm p-2 rounded-xl hover:bg-purple-50 dark:hover:bg-gray-800"><input type="radio" name="sim-h-${key}" class="mt-1" ${String(val)===String(oi)?'checked':''} onchange="simAnswer('hoeren','${key}',${oi})"><span>${safeText(opt)}</span></label>`).join('')}</div>`:q.type==='gap'?`<input value="${safeText(val||'')}" oninput="simAnswer('hoeren','${key}',this.value)" class="mt-3 w-full px-4 py-3 rounded-xl border ${S.dark?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}" placeholder="Kurze Antwort …">`:`<textarea oninput="simAnswer('hoeren','${key}',this.value)" class="mt-3 w-full h-28 p-3 rounded-xl border ${S.dark?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}" placeholder="1–2 Sätze …">${safeText(val||'')}</textarea>`}</div>`}
function renderSimHoeren(content){let globalNo=0;return`<div class="space-y-5">${content.texts.map((part,pi)=>`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-purple-500 font-bold">Audio ${pi+1} · ${safeText(part.kind)} · ${part.questions.length} Aufgaben</p><h2 class="font-black text-xl mt-1">${safeText(part.title)}</h2></div><span class="text-xs text-gray-500">${part.time} min</span></div><div class="mt-4 flex flex-wrap gap-2"><button type="button" onclick="playSimHoeren(${JSON.stringify(part.text)})" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-sm">Audio abspielen</button><button type="button" onclick="stopSimHoeren()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-gray-700 text-sm font-bold">Stoppen</button></div><details class="mt-4 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><summary class="font-bold cursor-pointer">Transkript erst nach dem Hören kontrollieren</summary><p data-learning-content class="mt-3 leading-8 whitespace-pre-line">${safeText(part.text)}</p></details>${part.questions.map((q,qi)=>renderSimHoerenQuestion(q,`${pi}-${qi}`,++globalNo)).join('')}</section>`).join('')}</div>`}
function renderSimSchreiben(content){const val=ensureTestdafSimState().answers?.schreiben||'',count=simWordCount(val);return`<section class="favorite-anchor p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow">${favoriteButton({kind:'writing',skill:'schreiben',sourceId:content.id||content.title,title:content.task||content.title,subtitle:content.title||'TestDaF Schreiben',context:content.chartTitle||'',source:'testdaf-exam'},'favorite-overlay')}<div class="flex flex-wrap justify-between gap-3 pr-16"><div><p class="text-xs text-amber-500 font-bold">Grafikbeschreibung · Argumentation</p><h2 class="text-2xl font-black">${safeText(content.title)}</h2></div><span class="text-xs text-gray-500">${content.time} min</span></div><p class="mt-3 leading-7">${safeText(content.task)}</p><div class="mt-5 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><b>${safeText(content.chartTitle)}</b><div class="mt-4 grid grid-cols-5 gap-2">${content.chart.map(([y,v])=>`<div class="text-center"><div class="h-36 flex items-end justify-center"><span class="w-8 md:w-10 rounded-t bg-gradient-to-t from-indigo-600 to-cyan-400" style="height:${v}%"></span></div><small>${y}</small><b class="block">${v}%</b></div>`).join('')}</div></div><textarea oninput="simWritingAnswer(this.value)" class="mt-5 w-full min-h-[420px] p-4 rounded-2xl border ${S.dark?'bg-gray-900 border-gray-700':'bg-gray-50 border-gray-200'}" placeholder="Schreiben Sie hier 350–400 Wörter …">${safeText(val)}</textarea><div class="mt-2 flex justify-between text-xs"><span>Grafik beschreiben · Ursachen erklären · Position begründen</span><span id="simWritingCount" class="font-bold ${count>=350&&count<=400?'text-emerald-500':'text-amber-500'}">${count} Wörter</span></div></section>`}
async function startSimSpeakingRecording(index){const sim=ensureTestdafSimState(),task=testdafSimData().sprechen.tasks[index];if(!task||!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){S.simSpeakingStatus='unsupported';render();return}try{if(S.speakingRecorder?.state==='recording')return;const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});S.speakingStream=stream;S.speakingChunks=[];const preferred=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'].find(type=>MediaRecorder.isTypeSupported(type)),recorder=preferred?new MediaRecorder(stream,{mimeType:preferred}):new MediaRecorder(stream);S.speakingRecorder=recorder;S.simSpeakingTask=index;recorder.ondataavailable=e=>{if(e.data?.size)S.speakingChunks.push(e.data)};recorder.onstop=async()=>{const mime=(recorder.mimeType||'audio/webm').split(';')[0],blob=new Blob(S.speakingChunks,{type:mime});stopSpeakingStream();await uploadSimSpeakingRecording(blob,mime,index)};recorder.start(250);S.simSpeakingStatus='recording';sim.recordingStartedAt=Date.now();if(S.speakingRecordingInterval)clearInterval(S.speakingRecordingInterval);S.speakingRecordingInterval=setInterval(()=>{const elapsed=Math.floor((Date.now()-sim.recordingStartedAt)/1000),el=$(`#simSpeakingTime-${index}`);if(el)el.textContent=timeStr(elapsed);if(elapsed>=Math.min(600,task.time))stopSimSpeakingRecording()},500);render()}catch(error){console.warn(error);S.simSpeakingStatus='denied';render()}}
function stopSimSpeakingRecording(){if(S.speakingRecorder?.state==='recording'){S.simSpeakingStatus='uploading';if(S.simSpeakingStopTimeout)clearTimeout(S.simSpeakingStopTimeout);S.speakingRecorder.stop();render()}}
async function uploadSimSpeakingRecording(blob,mime,index){const sim=ensureTestdafSimState();try{const form=new FormData();form.append('user_id',S.currentUser);form.append('plan_id',`testdaf-simulation-${S.selectedTestdafExamId||BUILTIN_TESTDAF_EXAM_ID}`);form.append('task_id',`testdaf-sim-${index+1}`);form.append('audio',blob,`testdaf-sim-${index+1}.${mime.includes('ogg')?'ogg':mime.includes('mp4')?'m4a':'webm'}`);const response=await fetch(`${APP_API_BASE}/speaking/recordings`,{method:'POST',body:form});if(!response.ok)throw new Error(`Upload failed: ${response.status}`);const saved=await response.json();sim.recordings[index]={...saved,savedAt:new Date().toISOString()};sim.answers.sprechen[index]=`Audioaufnahme gespeichert: ${saved.id}`;S.recordingDate=today();S.simSpeakingStatus='saved'}catch(error){console.warn(error);const localUrl=URL.createObjectURL(blob);sim.recordings[index]={playback_url:localUrl,local:true,savedAt:new Date().toISOString()};sim.answers.sprechen[index]='Audioaufnahme lokal verfügbar';S.simSpeakingStatus='local-saved'}saveData();render()}
function simRecordingPlayback(recording){if(!recording?.playback_url)return'';return recording.local?recording.playback_url:`${APP_API_BASE.replace(/\/v1$/,'')}${recording.playback_url}`}
function renderSimSprechen(content){const sim=ensureTestdafSimState();return`<div class="space-y-4"><section class="p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-900/20 text-sm"><b>Prüfungsmodus:</b> Lesen Sie die Aufgabe, nutzen Sie die Vorbereitungszeit und nehmen Sie anschließend Ihre Antwort auf. Es gibt kein Textfeld.</section>${content.tasks.map((task,i)=>{const recording=sim.recordings?.[i],playback=simRecordingPlayback(recording),active=S.simSpeakingTask===i,status=active?S.simSpeakingStatus:'idle';return`<section class="favorite-anchor p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow">${favoriteButton({kind:'speaking',skill:'sprechen',sourceId:task.id||'sim-speaking-'+i,title:task.q,subtitle:task.type||'TestDaF Sprechen',context:'Vorbereitung '+task.prep+'s - Sprechen '+task.time+'s',source:'testdaf-exam'},'favorite-overlay')}<div class="flex flex-wrap justify-between gap-3 pr-16"><div><p class="text-xs text-indigo-500 font-bold">Aufgabe ${i+1} · ${safeText(task.type)}</p><h2 class="font-black text-xl mt-1">${safeText(task.q)}</h2></div><div class="text-right text-xs text-gray-500"><div>Vorbereitung ${task.prep}s</div><div>Sprechen ${task.time}s</div></div></div><div class="mt-5 p-5 rounded-2xl text-center ${status==='recording'?'bg-red-50 dark:bg-red-900/20 ring-2 ring-red-400':S.dark?'bg-gray-900':'bg-gray-50'}"><div class="mx-auto w-12 h-12 rounded-full grid place-items-center ${status==='recording'?'bg-red-500 text-white animate-pulse':'bg-indigo-100 text-indigo-600'}">${iconSvg('microphone')}</div><p id="simSpeakingTime-${i}" class="mt-2 font-mono font-bold">${status==='recording'?'00:00':recording?'Gespeichert':'Bereit'}</p><p class="mt-1 text-xs text-gray-500">${status==='recording'?'Aufnahme läuft …':status==='uploading'?'Aufnahme wird gespeichert …':status==='denied'?'Mikrofonzugriff wurde abgelehnt.':status==='unsupported'?'Dieser Browser unterstützt keine Audioaufnahme.':status==='local-saved'?'Lokal gespeichert; Server war nicht erreichba function renderPlanSelect(){return`<div class="min-h-screen flex items-center justify-center p-4 ${S.dark?'bg-gray-900':'bg-gradient-to-br from-indigo-50 via-white to-rose-50'}"><div class="w-full max-w-4xl"><div class="text-center mb-8"><div class="text-5xl mb-3">📚</div><h1 class="text-3xl font-bold ${S.dark?'text-white':'text-gray-900'}">Lernplan auswählen</h1><p dir="rtl" class="mt-2 ${S.dark?'text-gray-400':'text-gray-500'}">مسیر یادگیری مورد نظر را انتخاب کنید یا پلن اختصاصی خودتان را بسازید</p></div><div class="grid md:grid-cols-2 gap-5">${[...Object.values(EXAM_PLANS),...(S.user.customPlans||[])].map(plan=>`<button type="button" onclick="selectExamPlan('${plan.id}')" class="group relative overflow-hidden text-left p-6 rounded-3xl border-2 ${S.user.examPlan===plan.id?'border-indigo-500 ring-4 ring-indigo-100 dark:ring-indigo-900/30':S.dark?'border-gray-700 bg-gray-800':'border-white bg-white'} shadow-xl hover:-translate-y-1 hover:shadow-2xl transition"><div class="absolute inset-x-0 top-0 h-2 ${plan.id==='testdaf'?'bg-gradient-to-r from-indigo-500 to-purple-500':'bg-gradient-to-r from-red-500 to-rose-500'}"></div>${plan.id.startsWith('custom-')?`<span role="button" tabindex="0" aria-label="پلن حذف شود" onclick="event.stopPropagation();requestDeletePlan('${plan.id}')" class="absolute top-4 right-4 z-10 w-9 h-9 rounded-xl bg-red-50 dark:bg-red-900/40 text-red-500 flex items-center justify-center hover:bg-red-100 dark:hover:bg-red-900/70 transition">🗑️</span>`:''}<div class="flex items-start gap-4"><div class="w-16 h-16 rounded-2xl ${plan.id==='testdaf'?'bg-indigo-100 dark:bg-indigo-900/30':'bg-rose-100 dark:bg-rose-900/30'} flex items-center justify-center text-3xl">${plan.icon}</div><div class="flex-1"><h2 class="text-2xl font-bold ${S.dark?'text-white':'text-gray-900'}">${plan.name}</h2><p dir="rtl" class="text-sm leading-6 mt-2 ${S.dark?'text-gray-400':'text-gray-500'}">${plan.description}</p></div></div><div class="mt-6 flex items-center justify-between"><sp function renderCustomPlanBuilder(){const b=S.customBuilder;if(!b){S.screen='planSelect';return''}const steps=['هویت پلن','هدف و سطح','بخش‌ها و زمان','بررسی نهایی'];return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gradient-to-br from-cyan-50 via-white to-indigo-50'} p-4 pb-24"><div class="max-w-2xl mx-auto pt-6"><div class="flex items-center justify-between mb-5"><button onclick="S.screen='planSelect';render()" class="px-3 py-2 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow">← پلن‌ها</button><span class="text-sm font-bold">${steps[b.step]} · ${b.step+1}/4</span></div><div class="h-2 rounded-full ${S.dark?'bg-gray-700':'bg-gray-200'} overflow-hidden mb-6"><div class="h-full bg-gradient-to-r from-cyan-500 to-indigo-600" style="width:${(b.step+1)*25}%"></div></div><section class="rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow-xl p-6 md:p-8">${b.step===0?`<div dir="rtl"><h1 class="text-2xl font-bold mb-5">پلن شما چه هویتی دارد؟</h1><div class="grid grid-cols-[90px_1fr] gap-3"><input aria-label="آیکن" value="${safeText(b.icon)}" oninput="customBuilderSet('icon',this.value)" class="px-3 py-3 text-center text-2xl rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"><input value="${safeText(b.name)}" oninput="customBuilderSet('name',this.value)" placeholder="نام پلن؛ مثلاً طراحی گرافیک" class="px-4 py-3 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></div><textarea oninput="customBuilderSet('description',this.value)" placeholder="توضیح کوتاه پلن" class="mt-3 w-full h-24 px-4 py-3 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}">${safeText(b.description)}</textarea></div>`:b.step===1?`<div dir="rtl"><h1 class="text-2xl font-bold mb-5">هدف و سطح یادگیری</h1><label class="text-sm">هدف اصلی</label><textarea oninput="customBuilderSet('goal',this.value)" class="mt-2 w-full h-24 px-4 py-3 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}" placeholder="در پایان این پلن چه چیزی به دست می‌آورید؟">${safeText(b.goal)}</textarea><div class="grid sm:grid-cols-2 gap-3 mt-4"><div><label class="text-sm">سطح فعلی</label><select onchange="customBuilderSet('level',this.value)" class="mt-2 w-full px-4 py-3 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}">${['Anfänger','Mittelstufe','Fortgeschritten'].map(x=>`<option ${b.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="text-sm">تاریخ هدف</label><input type="date" value="${b.targetDate}" onchange="customBuilderSet('targetDate',this.value)" class="mt-2 w-full px-4 py-3 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></div></div></div>`:b.step===2?`<div dir="rtl"><h1 class="text-2xl font-bold mb-5">محتوا و زمان‌بندی</h1><label class="text-sm">موضوع اصلی</label><input value="${safeText(b.topic)}" oninput="customBuilderSet('topic',this.value)" placeholder="موضوع یا حوزه یادگیری" class="mt-2 w-full px-4 py-3 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"><label class="block text-sm mt-4">بخش‌ها — با ویرگول جدا کنید</label><textarea oninput="customBuilderSet('modules',this.value.split(',').map(x=>x.trim()).filter(Boolean))" class="mt-2 w-full h-28 px-4 py-3 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}">${safeText(b.modules.join(', '))}</textarea><label class="block text-sm mt-4">زمان روزانه: <b id="customMinutes">${b.dailyMinutes} دقیقه</b></label><input type="range" min="15" max="240" step="15" value="${b.dailyMinutes}" oninput="customBuilderSet('dailyMinutes',Number(this.value));$('#customMinutes').textContent=this.value+' دقیقه'" class="w-full mt-3 accent-indigo-600"></div>`:`<div dir="rtl"><div class="text-center text-5xl">${safeText(b.icon)}</div><h1 class="text-3xl font-bold text-center mt-3">${safeText(b.name)}</h1><p class="text-center mt-2 text-gray-500">${safeText(b.description)}</p><div class="mt-6 grid sm:grid-co function rebuildDailyHistory(day={}){

async function generatePlan(){
  if(S.resourceLoading)return;
  await loadStoredResources();
  const mins=S.user.dailyMinutes;const examName=examPlanLabel();
  const weak=S.user.weakSkills||[];
  const defs=[

    ['sprechen','microphone','Sprechen',13],['schreiben','pencil-square','Schreiben',14],['grammatik','language','Grammatik',12],

  const activities=defs.map((d,index)=>{

  const act=S.plan?.activities.find(a=>a.id===id);if(!act)return;S.activeActivity=act;
  switch(act.type){
    case'custom':
      if(!S.activityProgress[id])S.activityProgress[id]={notes:'',questionStart:S.activityTimers[id]||0};S.screen='customActivity';break;
    case'contract':
      if(!S.activityProgress[id])S.activityProgress[id]={current:0,answers:{},questionStart:S.activityTimers[id]||0};
      S.screen='contractActivity';break;
    case'vocabulary':S.vocabData=getVocabForTopic();if(S.activityProgress.vocab){S.vocabIndex=S.activityProgress.vocab.index}else{S.vocabIndex=0;S.activityProgress.vocab={index:0,ratings:[]}}S.vocabFlipped=false;S.screen='vocabulary';break;
    case'grammar':if(S.activityProgress.grammar){S.grammarQuiz={...S.activityProgress.grammar}}else{S.grammarQuiz={current:0,score:0,answers:[],done:false,answerTimes:[]};S.activityProgress.grammar=S.grammarQuiz}S.screen='grammar';break;
    case'writing':if(S.activityProgress.writing){S.writingText=S.activityProgress.writing.text;S.writingTimer=S.activityProgress.writing.timer}else{S.writingText='';S.writingTimer=0;S.activityProgress.writing={text:'',timer:0}}S.screen='writing';break;
    case'listening':
      if(S.activityProgress.listening){S.listeningData=S.activityProgress.listening.data;S.listeningStep=S.activityProgress.listening.step;S.listeningAnswers=S.activityProgress.listening.answers||[];S.listeningDone=S.activityProgress.listening.done||false}
      else{S.listeningData=getHoerenForTopic();S.listeningStep=0;S.listeningAnswers=[];S.listeningDone=false;S.activityProgress.listening={data:S.listeningData,step:0,answers:[],done:false}}
      S.screen='listening';break;
    case'vocab-review':
      if(S.activityProgress.vocabReview){S.vocabReviewData=S.activityProgress.vocabReview.data;S.vocabReviewIndex=S.activityProgress.vocabReview.index;S.vocabReviewFlipped=S.activityProgress.vocabReview.flipped||false}
      else{S.vocabReviewData=getVocabForTopic().sort(()=>Math.random()-.5).slice(0,6);S.vocabReviewIndex=0;S.vocabReviewFlipped=false;S.activityProgress.vocabReview={data:S.vocabReviewData,index:0,flipped:false}}
      S.screen='vocabReview';break;
    case'gesamttest':
      if(S.activityProgress.gesamttest){S.gesamttest={...S.activityProgress.gesamttest}}
      else{S.gesamttest={current:0,score:0,answers:[],done:false,sections:generateGesamttest()};S.activityProgress.gesamttest={...S.gesamttest}}
      S.screen='gesamttest';break;
    default:completeActivity(id);return;
  }
  startTimer(id);render();
}
function pauseActivity(){
  if(S.speakingRecorder?.state==='recording')stopSpeakingRecording();
  if(!S.activeActivity)return;const id=S.activeActivity.id;
  if(S.activeActivity.type==='contract'){saveData()}
  else if(S.activeActivity.type==='vocabulary')S.activityProgress.vocab={index:S.vocabIndex,ratings:S.activityProgress.vocab?.ratings||[]};
  else if(S.activeActivity.type==='grammar')S.activityProgress.grammar={...S.grammarQuiz};
  else if(S.activeActivity.type==='writing')S.activityProgress.writing={text:S.writingText,timer:S.writingTimer};
  else if(S.activeActivity.type==='listening')S.activityProgress.listening={data:S.listeningData,step:S.listeningStep,answers:S.listeningAnswers,done:S.listeningDone};
  else if(S.activeActivity.type==='vocab-review')S.activityProgress.vocabReview={data:S.vocabReviewData,index:S.vocabReviewIndex,flipped:S.vocabReviewFlipped,ratings:S.activityProgress.vocabReview?.ratings||[]};
  else if(S.activeActivity.type==='gesamttest')S.activityProgress.gesamttest={...S.gesamttest};
  stopTimers();saveData();S.screen='dashboard';render();
}
function archiveCurrentPlan(reason='manual-day-end'){
  if(!S.plan)return null;stopTimers();
  const acts=S.plan.activities?.length||0,comp=S.completedActivities.length;
  return upsertDailyHistorySegment(currentPlanHistorySnapshot({closedAt:new Date().toISOString(),closeReason:reason,partial:comp<acts}));
}async function finishDailyPlan(){
  if(!S.plan)return;
  archiveCurrentPlan('manual-day-end');
  await cleanupSpeakingRecordings('day-ended');
  S.plan=null;S.learningResources=null;S.dataSource=null;S.completedActivities=[];S.activityProgress={};S.activityTimers={};S.activityPoints={};S.activeActivity=null;S.showPlanEditor=false;
  saveData();S.screen='summary';render();
}
async function startFreshDailyPlan(){
  if(S.plan)archiveCurrentPlan('fresh-start');
  await cleanupSpeakingRecordings('fresh-start');
  S.plan=null;S.learningResources=null;S.dataSource=null;S.completedActivities=[];S.activityProgress={};S.activityTimers={};S.activityPoints={};S.activeActivity=null;S.showPlanEditor=false;
  saveData();S.screen='onboarding';S.step=5;render();
}
function ensureTodayPlan(){
  if(S.plan&&S.plan.date&&S.plan.date!==today()){
    archiveCurrentPlan('new-day');cleanupSpeakingRecordings('new-day');
    S.plan=null;S.learningResources=null;S.dataSource=null;S.completedActivities=[];S.activityProgress={};S.activityTimers={};S.activityPoints={};S.activeActivity=null;S.showPlanEditor=false;saveData();
  }
}
function completeActivity(id){
  const act=S.plan?.activities.find(a=>a.id===id);
  if(!S.completedActivities.includes(id)){S.completedActivities.push(id);if(act)S.totalMinutes+=act.dur}
  const day=upsertDailyHistorySegment(currentPlanHistorySnapshot()),finished=(S.plan?.activities?.length||0)>0&&S.completedActivities.length>=(S.plan?.activities?.length||0);
  if(finished)cleanupSpeakingRecordings('plan-complete');
  stopTimers();S.activeActivity=null;saveData();S.screen='dashboard';render();
}
function calcPoints(id,pm){
  const el=S.activityTimers[id]||0,ps=pm*60;let p=0;
  if(id==='vocab'){const pr=S.activityProgress.vocab;if(pr&&pr.ratings)pr.ratings.forEach(r=>{p+=r===2?15:r===1?8:2});if(el<=ps&&pr&&pr.ratings)p+=20}
  else if(id==='grammar'){const g=S.grammarQuiz;p=g.score*10;if(g.answerTimes)g.answerTimes.forEach((t,i)=>{if(t<=getGrammarForTopic()[i]?.tl||40)p+=5});if(el<=ps)p+=25}
  else if(id==='writing'){const w=S.writingText.trim()?S.writingText.trim().split(/\s+/).length:0;p+=w>=200?30:Math.round(w/200*30);if(el<=ps)p+=20}
  else if(id==='hoeren'){const l=S.listeningGrading;if(l)p=l.score*15;if(el<=ps)p+=15}
  else if(id==='vocab_review'){const pr=S.activityProgress.vocabReview;if(pr&&pr.ratings)pr.ratings.forEach(r=>{p+=r===2?12:r===1?6:2});if(el<=ps)p+=15}
  else if(id==='gesamttest'){const g=S.gesamttest;p=g.score*12;if(el<=ps)p+=20}
  else if(actIsContract(id)){const pr=S.activityProgress[id];p=Object.values(pr?.answers||{}).filter(Boolean).length*5;if(el<=ps)p+=20}
  return p;
}

function answerListening(i){
  if(S.listeningAnswers[S.listeningStep-1]!==undefined)return;
  S.listeningAnswers[S.listeningStep-1]=i;
  S.activityProgress.listening.answers=[...S.listeningAnswers];
  render();
}

function nextListeningQ(){
  const h=S.listeningData;
  if(S.listeningStep<h.questions.length){S.listeningStep++;S.activityProgress.listening.step=S.listeningStep;render()}
  else{finishListening()}
}

async function finishListening(){
  S.listeningDone=true;S.activityProgress.listening.done=true;
  stopTimers();

  // Calculate score locally first
  const h=S.listeningData;
  let correct=0;
  h.questions.forEach((q,i)=>{if(S.listeningAnswers[i]===q.c)correct++;else rememberLearningError({type:'hoeren',category:'listening',question:q.q||'',userAnswer:S.listeningAnswers[i]!==undefined?q.o?.[S.listeningAnswers[i]]:'Keine Antwort',correctAnswer:q.o?.[q.c]||'',explanation:q.ex||'',context:h.text||'',source:'hoeren',sourceKey:`${S.plan?.id||today()}:hoeren:${i}`})});
  const localScore={score:correct,total:h.questions.length,feedback:''};

  S.listeningGrading=localScore;render();
}

const ERROR_KIND_META={vocabulary:{labelKey:'skill.vocabulary',short:'W',color:'#7c3aed',bg:'#ede9fe'},grammar:{labelKey:'skill.grammar',short:'G',color:'#e11d48',bg:'#ffe4e6'},reading:{labelKey:'skill.reading',short:'L',color:'#2563eb',bg:'#dbeafe'},listening:{labelKey:'skill.listening',short:'H',color:'#0891b2',bg:'#cffafe'},writing:{labelKey:'skill.writing',short:'S',color:'#d97706',bg:'#fef3c7'},speaking:{labelKey:'skill.speaking',short:'SP',color:'#059669',bg:'#d1fae5'},other:{labelKey:'skill.other',short:'A',color:'#64748b',bg:'#e2e8f0'}};
function errorMeta(errorOrKind){const kind=typeof errorOrKind==='string'?errorOrKind:errorKind(errorOrKind),meta=ERROR_KIND_META[kind]||ERROR_KIND_META.other;return{kind,...meta,label:t(meta.labelKey)}}
function errorTitle(error){const meta=errorMeta(error);if(meta.kind==='vocabulary')return error.userAnswer||error.question||'Wort';return error.question||error.userAnswer||error.category||'Lernfehler'}
function errorSubline(error){return error.correctAnswer||error.explanation||error.context||'Noch keine Musterantwort gespeichert.'}
function errorIsDue(error){if(error.isMastered||!error.nextReview)return false;return error.nextReview<=today()&&(!error.nextReviewAt||new Date(error.nextReviewAt).getTime()<=Date.now())}
function errorDueLabel(error){if(error.isMastered)return t('mistakes.mastered');if(errorIsDue(error))return t('mistakes.dueNow');if(error.nextReviewAt){const minutes=Math.max(1,Math.ceil((new Date(error.nextReviewAt).getTime()-Date.now())/60000));if(minutes<60)return t('mistakes.inMinutes',{count:minutes})}if(error.nextReview){const locale=S.uiLanguage==='fa'?'fa-IR':S.uiLanguage==='en'?'en-GB':'de-DE';return new Date(error.nextReview+'T12:00:00').toLocaleDateString(locale,{day:'2-digit',month:'short'})}return t('common.new')}
function errorMatchesFilter(error,filter){if(!filter||filter==='all')return true;if(filter==='due')return errorIsDue(error);if(filter==='mastered')return !!error.isMastered||error.intervalDays>=60;return errorKind(error)===filter}
function aggregateErrorRanking(kind){const grouped=new Map();S.errors.map(normalizeLearningError).filter(error=>errorKind(error)===kind).forEach(error=>{const raw=kind==='vocabulary'?(error.userAnswer||error.question):(error.question||error.userAnswer||error.category),label=String(raw||'Unbekannt').trim(),key=label.toLocaleLowerCase();const current=grouped.get(key)||{label,count:0};current.count+=Math.max(1,error.mistakeCount||1);grouped.set(key,current)});return[...grouped.values()].sort((a,b)=>b.count-a.count).slice(0,5)}
function errorRetention(){const history=S.errors.flatMap(error=>Array.isArray(error.history)?error.history:[]);if(!history.length)return 0;return Math.round(history.filter(item=>Number(item.rating??item.quality)>=2).length/history.length*100)}
function currentErrorStreak(){const reviews=S.errors.flatMap(error=>(error.history||[]).map(item=>({...item}))).sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));let streak=0;for(const item of reviews){if(Number(item.rating??item.quality)>=2)streak++;else break}return streak}
function renderErrorRanking(kind,title){const meta=errorMeta(kind),rows=aggregateErrorRanking(kind),max=rows[0]?.count||1;return `<div class="error-ranking" style="--rank-bg:${meta.bg};--rank-color:${meta.color}"><h3><span>${meta.short}</span>${title}</h3>${rows.length?rows.map((row,index)=>`<div class="error-rank-row"><i>#${index+1}</i><div class="error-rank-label"><b title="${safeText(row.label)}">${safeText(row.label)}</b><div class="error-rank-bar"><i style="width:${Math.max(8,row.count/max*100)}%"></i></div></div><strong>${row.count}x</strong></div>`).join(''):`<div class="error-empty-mini">${t('mistakes.noData')}</div>`}</div>`}
function setErrorFilter(kind){S.errorFilter=kind;render()}
function filterErrorCards(value){const query=String(value||'').trim().toLocaleLowerCase();document.querySelectorAll('[data-error-search]').forEach(card=>{card.hidden=query&&!card.dataset.errorSearch.includes(query)})}
function vocabularyReviewParts(error){
  const source=String(error.source||'').toLowerCase(),flashcard=/vocab|wort/.test(source)||error.question==='Flashcard vocabulary'||String(error.category||'').toLowerCase().includes('nicht gewusst');
  if(flashcard)return{word:error.userAnswer||error.question,meaning:error.correctAnswer||'',example:error.explanation||'',context:error.context||''};
  return{word:error.correctAnswer||error.userAnswer||'',meaning:error.question||error.explanation||'',example:error.explanation||'',context:error.context||''};
}

function renderReviewMode(){

function startReview(id){const error=S.errors.find(item=>item.id===id);if(!error)return;S.currentReview=error;S.reviewQueue=[id];S.reviewSessionTotal=1;S.reviewMode=true;S.reviewReveal=false;S.reviewAttempt='';S.reviewStartedAt=Date.now();S.errorToast='';render()}
function startAllReviews(){let due=getDueErrors();if(S.errorFilter&&S.errorFilter!=='all')due=due.filter(error=>errorMatchesFilter(error,S.errorFilter));if(!due.length){S.errorToast=t('review.noneDue');render();return}S.reviewQueue=due.map(error=>error.id);S.reviewSessionTotal=S.reviewQueue.length;S.currentReview=S.errors.find(error=>error.id===S.reviewQueue[0]);S.reviewMode=true;S.reviewReveal=false;S.reviewAttempt='';S.reviewStartedAt=Date.now();S.errorToast='';render()}
function revealReviewAnswer(){const input=document.getElementById('reviewAttempt');S.reviewAttempt=String(input?.value||'').trim();S.reviewReveal=true;render()}
function finishReview(rating){if(!S.currentReview||!S.reviewReveal)return;const id=S.currentReview.id,timeSpent=S.reviewStartedAt?Math.round((Date.now()-S.reviewStartedAt)/1000):0;reviewError(id,Number(rating),timeSpent);S.reviewQueue=(S.reviewQueue||[]).filter(item=>item!==id);const nextId=S.reviewQueue[0];if(nextId){S.currentReview=S.errors.find(error=>error.id===nextId);S.reviewReveal=false;S.reviewAttempt='';S.reviewStartedAt=Date.now();render();return}S.reviewMode=false;S.currentReview=null;S.reviewReveal=false;S.reviewAttempt='';S.reviewStartedAt=0;S.errorToast=t('review.complete');render()}
function exitReviewMode(){S.reviewMode=false;S.currentReview=null;S.reviewQueue=[];S.reviewReveal=false;S.reviewAttempt='';S.reviewStartedAt=0;render()}
function addErrorManual(){S.manualErrorOpen=!S.manualErrorOpen;S.errorToast='';render()}
function saveManualErrorForm(){const kind=document.getElementById('manualErrorKind')?.value||'other',question=document.getElementById('manualErrorQuestion')?.value.trim()||'',wrong=document.getElementById('manualErrorWrong')?.value.trim()||'',correct=document.getElementById('manualErrorCorrect')?.value.trim()||'',explanation=document.getElementById('manualErrorExplanation')?.value.trim()||'';if(!wrong||!correct){S.errorToast=t('review.required');render();return}const meta=errorMeta(kind);addError({type:kind,category:meta.label,question,userAnswer:wrong,correctAnswer:correct,explanation,context:'',source:'manual',severity:1,mistakeCount:1,createdAt:new Date().toISOString()});S.manualErrorOpen=false;S.errorToast=t('review.saved');render()}
