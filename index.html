    sprechen:`Create exactly 6 TestDaF-style speaking tasks at ${level} level. Tasks 1-4 must each provide a different non-empty aspect; tasks 5-6 must use aspect:"" and custom_aspect_required:true so the learner supplies two aspects. Include q,aspect,prep,time,structure in every task; prep/time are seconds. Add complete help to at least task 1.`

function contentRecord(value){return !!value&&typeof value==='object'&&!Array.isArray(value)}
function contentArray(value){return Array.isArray(value)?value:value==null?[]:[value]}
function contentStableId(prefix,text,index=0){let hash=2166136261;for(const ch of String(text||'')){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619)}return`custom-${prefix}-${(hash>>>0).toString(36)}-${index+1}`}
function normalizeSkillImportShape(data,skill=currentContentSkill()){
  const aliases=skill==='hoeren'?['hoeren','hören','horen']:[skill];
  const wrapped=contentRecord(data)?aliases.map(name=>data[name]).find(contentRecord):null;
  const root=wrapped||data;
  if(!contentRecord(root))return root;
  if(Array.isArray(root.items))return{items:root.items};
  if(skill==='wortschatz')return{items:Array.isArray(root.vocab)?root.vocab:Array.isArray(root.words)?root.words:[root]};
  if(skill==='grammatik')return{items:Array.isArray(root.grammar)?root.grammar:Array.isArray(root.structures)?root.structures:[root]};
  if(skill==='sprechen'&&Array.isArray(root.tasks))return{items:root.tasks.map(v=>({...v,help:v.help||root.help||null}))};
  return{items:[root]};
}
function validateContentQuestion(question,path,errors,{typeRequired=false}={}){
  if(!contentRecord(question)){errors.push(`${path} must be an object.`);return}
  if(!String(question.q||question.question||'').trim())errors.push(`${path}.q is required.`);
  if(typeRequired&&!String(question.type||question.question_type||'').trim())errors.push(`${path}.type is required.`);
  if(!String(question.diff||question.difficulty||question.cefr_level||'').trim())errors.push(`${path}.diff is required.`);
  if(!(Number(question.time||question.recommended_answering_time_seconds||question.recommended_time_seconds)>0))errors.push(`${path}.time must be a positive number of seconds.`);
  if(!String(question.a||question.answer||question.correct_answer||'').trim())errors.push(`${path}.a is required.`);
}
function validateTopicContent(data,skill=currentContentSkill(),key=currentContentTopic()){
  const errors=[];
  if(!contentRecord(data))return['Root must be a JSON object.'];
  const items=data.items;
  if(!Array.isArray(items))return['items must be an array.'];
  if(!items.length)errors.push(`No usable ${skill} content found for topic "${key}".`);
  if(['lesen','hoeren','schreiben'].includes(skill)&&items.length!==1)errors.push(`${skill} must contain exactly one item (one text/task).`);
  items.forEach((item,index)=>{
    const path=`items[${index}]`;
    if(!contentRecord(item)){errors.push(`${path} must be an object.`);return}
    if(skill==='wortschatz'){
      [['w','word'],['art','article'],['pl','plural'],['lvl','l','cefr_level'],['en','meaning_english'],['nat','t','meaning_native'],['syn','synonym'],['ant','antonym'],['ex','example_sentence'],['ex_t','example_translation'],['note','usage_note']].forEach(keys=>{if(!String(keys.map(k=>item[k]).find(v=>v!=null)||'').trim())errors.push(`${path}.${keys[0]} is required (use "-" if not applicable).`)});
      const col=item.col||item.collocations;if(!Array.isArray(col)||col.length<3)errors.push(`${path}.col must contain at least 3 collocations.`);
    }else if(skill==='grammatik'){
      ['title','expl','formula','ex','ex_t'].forEach(field=>{const aliases={expl:['expl','explanation'],ex:['ex','example_sentence'],ex_t:['ex_t','example_translation']}[field]||[field];if(!String(aliases.map(k=>item[k]).find(v=>v!=null)||'').trim())errors.push(`${path}.${field} is required.`)});
      const mistakes=item.mistakes||item.common_mistakes||contentArray(item.mistake);if(!Array.isArray(mistakes)||!mistakes.length)errors.push(`${path}.mistakes must be a non-empty array.`);
      if(!Array.isArray(item.exercises)||!item.exercises.length)errors.push(`${path}.exercises must be a non-empty array.`);
      else item.exercises.forEach((q,i)=>validateContentQuestion(typeof q==='string'?{q,diff:S.user.level||'B2',time:60,a:'Musterantwort'}:q,`${path}.exercises[${i}]`,errors));
    }else if(skill==='lesen'||skill==='hoeren'){
      const text=String(item.text||item.script||item.reading_text||'').trim();
      if(!String(item.title||'').trim())errors.push(`${path}.title is required.`);
      if(!text)errors.push(`${path}.text is required.`);
      if(text.length<120)errors.push(`${path}.text is too short; provide a complete text, not a placeholder.`);
      if(skill==='lesen'){
        if(!(Number(item.words||item.approximate_word_count)>0))errors.push(`${path}.words must be a positive number.`);
        if(!(Number(item.time||item.recommended_reading_time_minutes)>0))errors.push(`${path}.time must be a positive number of minutes.`);
      }else{
        if(!(Number(item.duration||item.estimated_duration_minutes)>0))errors.push(`${path}.duration must be a positive number of minutes.`);
        if(!String(item.speed||item.speaking_speed_level||'').trim())errors.push(`${path}.speed is required.`);
        const pre=item.pre_vocab||item.important_vocabulary;if(!Array.isArray(pre)||pre.length!==10)errors.push(`${path}.pre_vocab must contain exactly 10 entries.`);
      }
      if(!Array.isArray(item.questions)||item.questions.length<2)errors.push(`${path}.questions must contain at least 2 questions.`);
      else item.questions.forEach((q,i)=>validateContentQuestion(q,`${path}.questions[${i}]`,errors,{typeRequired:skill==='lesen'}));
    }else if(skill==='schreiben'){
      const minWords=Number(item.min_w||item.required_length_words?.min),maxWords=Number(item.max_w||item.required_length_words?.max);
      if(!String(item.writing_task||item.task||'').trim())errors.push(`${path}.writing_task is required.`);
      if(!(minWords>0))errors.push(`${path}.min_w must be a positive number.`);
      if(!(maxWords>0))errors.push(`${path}.max_w must be a positive number.`);
      if(maxWords<minWords)errors.push(`${path}.max_w must be greater than or equal to min_w.`);
      if(!(Number(item.time||item.recommended_writing_time_minutes)>0))errors.push(`${path}.time must be a positive number of minutes.`);
      if(!contentRecord(item.help))errors.push(`${path}.help must be an object.`);
      else ['vocab','col','redemittel','grammar','connectors','outline'].forEach(field=>{const aliases={vocab:['vocab','key_vocabulary'],col:['col','collocations'],grammar:['grammar','grammar_structures']}[field]||[field];const value=aliases.map(k=>item.help[k]).find(Array.isArray);if(!value?.length)errors.push(`${path}.help.${field} must be a non-empty array.`)});
    }else if(skill==='sprechen'){
      if(!String(item.q||item.question||'').trim())errors.push(`${path}.q is required.`);
      if(!(Number(item.prep||item.preparation_time_seconds)>0))errors.push(`${path}.prep must be positive seconds.`);
      if(!(Number(item.time||item.speaking_time_seconds)>0))errors.push(`${path}.time must be positive seconds.`);
      const structure=item.structure||item.recommended_answer_structure;if(!(Array.isArray(structure)?structure.length:String(structure||'').trim()))errors.push(`${path}.structure is required.`);
    }
  });
  if(skill==='sprechen'&&items.length!==6)errors.push('sprechen must contain exactly 6 tasks.');
  if(skill==='sprechen'&&items.length>=6){
    items.slice(0,4).forEach((item,i)=>{if(!String(item.aspect||'').trim())errors.push(`items[${i}].aspect is required for speaking tasks 1-4.`)});
    items.slice(4,6).forEach((item,i)=>{if(item.custom_aspect_required!==true)errors.push(`items[${i+4}].custom_aspect_required must be true.`)});
  }
  return errors;
}
function normalizeContentImport(raw,key=currentContentTopic(),skill=currentContentSkill()){
  let data=raw?.topics?raw.topics[key]||Object.values(raw.topics)[0]:raw?.content?raw.content:raw;

  const out={...data};delete out.topic_id;delete out.topic;delete out.skill;
  const normalized=normalizeSkillImportShape(out,skill),errors=validateTopicContent(normalized,skill,key);
  if(errors.length)throw new Error(errors.join(' | '));
  return normalized;
}

const REVIEW_INTERVALS=[0,3,7,30,120]; // days
function calcNextReview(count,quality){
  if(quality<3){return{nextDate:new Date(Date.now()+Math.max(1,REVIEW_INTERVALS[Math.min(count,4)]/2)*864e5).toISOString().split('T')[0],interval:Math.max(1,REVIEW_INTERVALS[Math.min(count,4)]/2),mastered:false}}
  if(count<REVIEW_INTERVALS.length){return{nextDate:new Date(Date.now()+REVIEW_INTERVALS[count]*864e5).toISOString().split('T')[0],interval:REVIEW_INTERVALS[count],mastered:false}}
  return{nextDate:null,interval:0,mastered:true}
}

function addError(err){
  const id='err_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  const reviewDates=REVIEW_INTERVALS.map(d=>new Date(Date.now()+d*864e5).toISOString().split('T')[0]);
  S.errors.push({...err,id,reviewCount:0,nextReview:today(),reviewDates,isMastered:false,history:[]});
  saveData();
}
function rememberLearningError(err){
  if(!err)return false;
  const sourceKey=err.sourceKey||[err.type,err.category,err.userAnswer,err.correctAnswer,err.question].join('|');
  if(S.errors.some(e=>(e.sourceKey||'')===sourceKey))return false;
  addError({type:err.type||'practice',category:err.category||err.type||'practice',question:err.question||'',userAnswer:String(err.userAnswer||'').slice(0,800),correctAnswer:String(err.correctAnswer||'').slice(0,800),explanation:err.explanation||'',context:err.context||'',source:err.source||'auto',severity:err.severity||1,sourceKey,createdAt:new Date().toISOString(),planId:S.plan?.id||null});
  return true;
}
function rememberVocabUnknown(item,source='vocabulary'){
  if(!item)return;
  const word=item.word||item.w||'';
  rememberLearningError({type:'wortschatz',category:'Nicht gewusst',question:'Flashcard vocabulary',userAnswer:word,correctAnswer:item.meaning_native||item.meaning_english||item.t||item.en||'',explanation:item.example_sentence||item.ex||'',context:(item.collocations||[]).join(' ? '),source,sourceKey:`${source}:vocab:${word}`});
}
function reviewError(id,quality,timeSpent){
  const e=S.errors.find(x=>x.id===id);if(!e)return;
  e.history.push({quality,date:today(),timeSpent});
  e.reviewCount++;
  const r=calcNextReview(e.reviewCount,quality);
  e.nextReview=r.nextDate;e.isMastered=r.mastered;

  saveData();
}
function getDueErrors(){
  const t=today();
  return S.errors.filter(e=>!e.isMastered&&e.nextReview&&e.nextReview<=t);
}

function uiCopyMap(){const idx=S.uiLanguage==='en'?1:S.uiLanguage==='de'?2:0,map=new Map;UI_COPY.forEach(row=>row.forEach(v=>map.set(v,row[idx])));return map}
function setUILanguage(lang){if(!UI_LANGUAGE_NAMES[lang])return;S.uiLanguage=lang;localStorage.setItem('amookht_ui_language',lang);document.documentElement.lang=lang;document.documentElement.dir='ltr';if(S.currentUser)saveData();render()}
function renderLanguageSwitcher(){return`<div dir="ltr" style="position:fixed!important;top:.75rem!important;right:.75rem!important;left:auto!important;bottom:auto!important;inset-inline-start:auto!important;inset-inline-end:.75rem!important;direction:ltr!important;" class="lo-language-switcher z-[160] gap-1 p-1 rounded-xl border ${S.dark?'bg-slate-900/90 border-slate-700':'bg-white/90 border-slate-200'} shadow-lg backdrop-blur" role="group" aria-label="Interface language">${Object.entries(UI_LANGUAGE_NAMES).map(([code,name])=>`<button type="button" lang="${code}" onclick="event.preventDefault();event.stopPropagation();setUILanguage('${code}')" aria-pressed="${S.uiLanguage===code}" class="min-h-9 w-full px-2 rounded-lg text-[11px] sm:text-xs font-bold ${S.uiLanguage===code?'bg-indigo-600 text-white shadow':'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'}"><span>${name}</span></button>`).join('')}</div>`}
function localizeInterface(root){
  const lang=S.uiLanguage||'fa',map=uiCopyMap(),dir='ltr';document.documentElement.lang=lang;document.documentElement.dir='ltr';root.setAttribute('dir','ltr');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){const raw=node.nodeValue,trim=raw.trim();if(trim&&map.has(trim))node.nodeValue=raw.replace(trim,map.get(trim))}
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(attr=>{const val=el.getAttribute(attr);if(val&&map.has(val))el.setAttribute(attr,map.get(val))}));
  root.querySelectorAll('[dir]').forEach(el=>{if(el.closest('[data-learning-content]'))return;el.setAttribute('dir',dir)});
  root.insertAdjacentHTML('beforeend',renderLanguageSwitcher());
}

function render(){
  const a=$('#app');
  a.dataset.screen=S.screen;
  applyAppPreferences();
  switch(S.screen){
    case'landing':html(a,renderLanding());break;
    case'auth':html(a,renderAuth());break;
    case'planSelect':html(a,renderPlanSelect());break;
    case'testdafSim':html(a,renderTestDaFSimulation());break;
    case'customPlanBuilder':html(a,renderCustomPlanBuilder());break;
    case'customActivity':html(a,renderCustomActivity());break;
    case'onboarding':html(a,renderOnboarding());break;
    case'dashboard':html(a,renderDashboard());break;
    case'vocabulary':html(a,renderVocabulary());break;
    case'grammar':html(a,renderGrammar());break;
    case'writing':html(a,renderWriting());break;
    case'listening':html(a,renderListening());break;
    case'vocabReview':html(a,renderVocabReview());break;
    case'gesamttest':html(a,renderGesamttest());break;
    case'contractActivity':html(a,renderContractActivity());break;
    case'errorbook':html(a,renderErrorBook());break;
    case'summary':html(a,renderSummary());break;
    case'history':html(a,renderHistory());break;
    case'settings':html(a,renderSettings());break;
    case'contentBank':html(a,renderContentBankPage());break;
    case'appSettings':html(a,renderAppSettings());break;
    default:html(a,renderAuth());
  }
  renderGlobalNav(a);if(S.pendingTopicChange)a.insertAdjacentHTML('beforeend',renderTopicChangeModal());if(S.pendingPlanDelete)a.insertAdjacentHTML('beforeend',renderDeletePlanModal());localizeInterface(a);
}

function navigateApp(target){
  if(S.activeActivity&&S.screen!=='dashboard'){pauseActivity();S.activeActivity=null}
  if(target==='history'){openHistory();return}
  if(target==='dashboard'&&!S.user.examPlan){S.screen='planSelect'}else if(target==='dashboard'&&!S.plan){S.screen='onboarding'}else S.screen=target;
  saveData();render();
}

const TESTDAF_SIM_SECTIONS={lesen:{label:'Lesen',minutes:60,parts:4,items:40,desc:'4 akademische Lesetexte mit insgesamt 40 Aufgaben.'},hoeren:{label:'Hören',minutes:40,parts:4,items:35,desc:'4 Hörtexte mit Auswahl-, Lücken- und Zusammenfassungsaufgaben.'},schreiben:{label:'Schreiben',minutes:60,parts:1,items:1,desc:'1 Grafikaufgabe und ein strukturierter Text mit 350–400 Wörtern.'},sprechen:{label:'Sprechen',minutes:35,parts:7,items:7,desc:'7 hochschultypische Aufgaben mit Vorbereitung und Audioaufnahme.'}};
function testdafSimData(){return AMOOKHT_TESTDAF_SIM_DATA}
function newTestdafSimState(){return{version:2,started:false,finished:false,active:'overview',sectionStarts:{},answers:{lesen:{},hoeren:{},schreiben:'',sprechen:{}},recordings:{},done:{}}}
function ensureTestdafSimState(){if(!S.testdafSim||S.testdafSim.version!==2)S.testdafSim=newTestdafSimState();S.testdafSim.answers=S.testdafSim.answers||{lesen:{},hoeren:{},schreiben:'',sprechen:{}};S.testdafSim.answers.lesen=S.testdafSim.answers.lesen||{};S.testdafSim.answers.hoeren=S.testdafSim.answers.hoeren||{};S.testdafSim.answers.sprechen=S.testdafSim.answers.sprechen||{};S.testdafSim.recordings=S.testdafSim.recordings||{};S.testdafSim.sectionStarts=S.testdafSim.sectionStarts||{};S.testdafSim.done=S.testdafSim.done||{};return S.testdafSim}
function resetTestDaFSimulation(){if(S.speakingRecorder?.state==='recording')S.speakingRecorder.stop();S.testdafSim=newTestdafSimState();S.simSpeakingStatus='idle';saveData();render()}
function startTestDaFSimulation(){const sim=ensureTestdafSimState();sim.started=true;sim.active='overview';sim.finished=false;saveData();render()}
function openTestDaFSimSection(id){const sim=ensureTestdafSimState();sim.started=true;sim.active=id;if(!sim.sectionStarts[id])sim.sectionStarts[id]=Date.now();saveData();render()}
function pauseTestDaFSimSection(){ensureTestdafSimState().active='overview';if(S.testdafSimTimer){clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}saveData();render()}
function simTotalItems(id,data=testdafSimData()){if(id==='lesen'||id==='hoeren')return data[id].texts.reduce((sum,part)=>sum+part.questions.length,0);if(id==='schreiben')return 1;if(id==='sprechen')return data.sprechen.tasks.length;return 0}
function simHasAnswer(value){return value!==undefined&&value!==null&&String(value).trim()!==''}
function simAnsweredCount(id,data=testdafSimData()){const sim=ensureTestdafSimState();if(id==='lesen'||id==='hoeren')return Object.values(sim.answers[id]||{}).filter(simHasAnswer).length;if(id==='schreiben')return simWordCount(sim.answers.schreiben)>0;if(id==='sprechen')return Object.keys(sim.recordings||{}).length;return 0}
function normalizeSimAnswer(value){return String(value??'').toLocaleLowerCase('de-DE').normalize('NFKC').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}
function simQuestionCorrect(question,value){if(question.type==='mc')return Number(value)===Number(question.answer);const actual=normalizeSimAnswer(value);return String(question.answer||'').split('|').some(answer=>normalizeSimAnswer(answer)===actual)}
function simAutoStats(id,data=testdafSimData()){let correct=0,total=0;if(id!=='lesen'&&id!=='hoeren')return{correct,total};data[id].texts.forEach((part,pi)=>part.questions.forEach((q,qi)=>{if(q.type==='summary')return;total++;if(simQuestionCorrect(q,ensureTestdafSimState().answers[id]?.[`${pi}-${qi}`]))correct++}));return{correct,total}}
function simWordCount(value){return String(value||'').trim()?String(value).trim().split(/\s+/).length:0}
function simWritingAnswer(value){ensureTestdafSimState().answers.schreiben=value;const count=simWordCount(value),counter=$('#simWritingCount');if(counter){counter.textContent=`${count} Wörter`;counter.className=`font-bold ${count>=350&&count<=400?'text-emerald-500':'text-amber-500'}`}saveData()}
function finishTestDaFSimSection(id){const sim=ensureTestdafSimState(),data=testdafSimData(),answered=simAnsweredCount(id,data),total=simTotalItems(id,data);if(id==='sprechen'&&S.speakingRecorder?.state==='recording'){alert('Bitte stoppen Sie zuerst die laufende Aufnahme.');return}if(id==='schreiben'){const words=simWordCount(sim.answers.schreiben);if(words<350||words>400){alert(`Der Text muss 350–400 Wörter enthalten. Aktuell: ${words}.`);return}}if(answered<total&&!confirm(`${total-answered} Aufgabe(n) sind noch unbeantwortet. Abschnitt trotzdem abgeben?`))return;if(S.testdafSimTimer){clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}sim.done[id]=true;sim.active='overview';delete sim.sectionStarts[id];if(['lesen','hoeren','schreiben','sprechen'].every(k=>sim.done[k]))sim.finished=true;saveData();render()}
function simAnswer(section,key,value){const sim=ensureTestdafSimState();sim.answers[section]=sim.answers[section]||{};sim.answers[section][key]=value;saveData();const data=testdafSimData(),counter=$('#simAnswered');if(counter)counter.textContent=`${simAnsweredCount(section,data)}/${simTotalItems(section,data)}`}
function simRemaining(section){const sim=ensureTestdafSimState(),started=sim.sectionStarts[section]||Date.now(),limit=(TESTDAF_SIM_SECTIONS[section]?.minutes||0)*60,elapsed=Math.floor((Date.now()-started)/1000);return Math.max(0,limit-elapsed)}

function renderTestDaFSimulation(){const sim=ensureTestdafSimState(),data=testdafSimData(),done=sim.done||{},sections=['lesen','hoeren','schreiben','sprechen'];if(!sim.started)return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gradient-to-br from-indigo-50 via-white to-cyan-50'} pb-28"><main class="max-w-5xl mx-auto p-4 pt-8"><button onclick="navigateApp('planSelect')" class="px-4 py-2 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow">Back to Plans</button><section class="mt-6 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow-xl overflow-hidden"><div class="h-2 bg-gradient-to-r from-indigo-600 via-cyan-500 to-emerald-500"></div><div class="p-8 md:p-10"><p class="text-sm font-bold text-indigo-500">TestDaF Prüfungssimulation</p><h1 class="mt-2 text-3xl md:text-5xl font-black">Vollständige TestDaF-Simulation</h1><p class="mt-4 max-w-3xl leading-8 ${S.dark?'text-gray-300':'text-gray-600'}">Eine zusammenhängende Hochschulprüfung mit 40 Leseaufgaben, 35 Höraufgaben, einer Grafik-Schreibaufgabe und 7 mündlichen Audioaufgaben.</p><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-8">${sections.map(id=>`<div class="p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><b>${TESTDAF_SIM_SECTIONS[id].label}</b><p class="text-xs mt-1 text-gray-500">${TESTDAF_SIM_SECTIONS[id].minutes} min · ${TESTDAF_SIM_SECTIONS[id].parts} Teile · ${TESTDAF_SIM_SECTIONS[id].items} Aufgaben</p></div>`).join('')}</div><button onclick="startTestDaFSimulation()" class="mt-8 px-7 py-4 rounded-2xl bg-indigo-600 text-white font-black shadow-lg">Simulation starten</button></div></section></main></div>`;if(sim.active&&sim.active!=='overview')return renderTestDaFSimSection(sim.active,data[sim.active]);const completed=sections.filter(k=>done[k]).length,lesenStats=simAutoStats('lesen',data),hoerenStats=simAutoStats('hoeren',data);return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gray-50 text-gray-900'} pb-28"><main class="max-w-6xl mx-auto p-4 pt-6"><header class="flex flex-wrap items-center justify-between gap-3 mb-5"><div><p class="text-xs font-bold text-indigo-500">TestDaF Simulation</p><h1 class="text-3xl font-black">Prüfungsübersicht</h1><p class="text-sm text-gray-500 mt-1">${completed}/4 Bereiche abgeschlossen</p></div><button onclick="resetTestDaFSimulation()" class="px-4 py-2 rounded-xl bg-red-100 text-red-700 font-bold">Neu starten</button></header>${sim.finished?`<section class="mb-5 p-6 rounded-3xl bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800"><h2 class="text-2xl font-black text-emerald-700 dark:text-emerald-300">Simulation abgeschlossen</h2><div class="grid sm:grid-cols-4 gap-3 mt-4 text-sm"><div><b>Lesen</b><p>${lesenStats.correct}/${lesenStats.total} automatisch richtig</p></div><div><b>Hören</b><p>${hoerenStats.correct}/${hoerenStats.total} objektiv richtig</p></div><div><b>Schreiben</b><p>${simWordCount(sim.answers.schreiben)} Wörter</p></div><div><b>Sprechen</b><p>${Object.keys(sim.recordings||{}).length}/7 Aufnahmen</p></div></div></section>`:''}<section class="grid md:grid-cols-2 gap-4">${sections.map(id=>`<button onclick="openTestDaFSimSection('${id}')" class="text-left p-6 rounded-3xl border ${done[id]?'border-emerald-300 bg-emerald-50 dark:bg-emerald-900/20':'border-transparent '+(S.dark?'bg-gray-800':'bg-white')} shadow hover:-translate-y-1 transition"><div class="flex justify-between gap-3"><div><h2 class="text-2xl font-black">${TESTDAF_SIM_SECTIONS[id].label}</h2><p class="mt-2 text-sm text-gray-500">${TESTDAF_SIM_SECTIONS[id].desc}</p></div><span class="text-sm font-bold ${done[id]?'text-emerald-600':'text-indigo-600'}">${done[id]?'Done':simAnsweredCount(id,data)?'Weiter':'Start'}</span></div><div class="mt-5 flex flex-wrap gap-2 text-xs"><span class="px-2 py-1 rounded bg-indigo-100 text-indigo-700">${TESTDAF_SIM_SECTIONS[id].minutes} min</span><span class="px-2 py-1 rounded bg-slate-100 text-slate-600">${TESTDAF_SIM_SECTIONS[id].parts} Teile</span><span class="px-2 py-1 rounded bg-cyan-100 text-cyan-700">${simAnsweredCount(id,data)}/${simTotalItems(id,data)} beantwortet</span></div></button>`).join('')}</section></main></div>`}
function renderTestDaFSimSection(id,content){const meta=TESTDAF_SIM_SECTIONS[id],remaining=simRemaining(id),data=testdafSimData();if(S.testdafSimTimer)clearInterval(S.testdafSimTimer);S.testdafSimTimer=setInterval(()=>{if(S.screen==='testdafSim'&&ensureTestdafSimState().active===id){const e=$('#simTimer');if(e)e.textContent=timeStr(simRemaining(id))}else{clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}},1000);return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gray-50 text-gray-900'} pb-28"><main class="max-w-5xl mx-auto p-4 pt-6"><header class="sticky top-0 z-30 flex items-center justify-between gap-2 mb-4 p-3 rounded-2xl ${S.dark?'bg-gray-900/95':'bg-gray-50/95'} backdrop-blur"><button onclick="pauseTestDaFSimSection()" class="px-3 py-2 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow">Übersicht</button><div class="text-center"><h1 class="font-black text-lg">${meta.label}</h1><div class="flex items-center justify-center gap-2 text-xs"><span id="simTimer" class="font-mono text-indigo-500">${timeStr(remaining)}</span><span class="text-gray-400">·</span><span id="simAnswered" class="font-bold">${simAnsweredCount(id,data)}/${simTotalItems(id,data)}</span></div></div><button onclick="finishTestDaFSimSection('${id}')" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">Abgeben</button></header>${id==='lesen'?renderSimLesen(content):id==='hoeren'?renderSimHoeren(content):id==='schreiben'?renderSimSchreiben(content):renderSimSprechen(content)}</main></div>`}
function renderSimLesen(content){let globalNo=0;return`<div class="space-y-5">${content.texts.map((part,pi)=>`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-indigo-500 font-bold">Text ${pi+1} · ${part.questions.length} Aufgaben</p><h2 class="font-black text-xl mt-1">${safeText(part.title)}</h2></div><span class="text-xs text-gray-500">${part.time} min</span></div><article data-learning-content class="mt-4 leading-8 whitespace-pre-line ${S.dark?'text-gray-200':'text-gray-700'}">${safeText(part.text)}</article><div class="mt-5 space-y-4">${part.questions.map((q,qi)=>{const key=`${pi}-${qi}`,val=ensureTestdafSimState().answers?.lesen?.[key],number=++globalNo;return`<div class="p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><b>${number}. ${safeText(q.q)}</b><div class="mt-3 grid gap-2">${q.options.map((opt,oi)=>`<label class="flex gap-2 items-start text-sm p-2 rounded-xl hover:bg-indigo-50 dark:hover:bg-gray-800"><input type="radio" name="sim-l-${key}" class="mt-1" ${String(val)===String(oi)?'checked':''} onchange="simAnswer('lesen','${key}',${oi})"><span>${safeText(opt)}</span></label>`).join('')}</div></div>`}).join('')}</div></section>`).join('')}</div>`}
function renderSimHoerenQuestion(q,key,number){const val=ensureTestdafSimState().answers?.hoeren?.[key],typeLabel=q.type==='mc'?'Mehrfachauswahl':q.type==='gap'?'Lücke':'Zusammenfassung';return`<div class="mt-4 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><div class="flex items-start gap-2"><span class="shrink-0 px-2 py-1 rounded-lg bg-purple-100 text-purple-700 text-[10px] font-bold">${typeLabel}</span><b>${number}. ${safeText(q.q)}</b></div>${q.type==='mc'?`<div class="mt-3 grid gap-2">${q.options.map((opt,oi)=>`<label class="flex gap-2 items-start text-sm p-2 rounded-xl hover:bg-purple-50 dark:hover:bg-gray-800"><input type="radio" name="sim-h-${key}" class="mt-1" ${String(val)===String(oi)?'checked':''} onchange="simAnswer('hoeren','${key}',${oi})"><span>${safeText(opt)}</span></label>`).join('')}</div>`:q.type==='gap'?`<input value="${safeText(val||'')}" oninput="simAnswer('hoeren','${key}',this.value)" class="mt-3 w-full px-4 py-3 rounded-xl border ${S.dark?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}" placeholder="Kurze Antwort …">`:`<textarea oninput="simAnswer('hoeren','${key}',this.value)" class="mt-3 w-full h-28 p-3 rounded-xl border ${S.dark?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}" placeholder="1–2 Sätze …">${safeText(val||'')}</textarea>`}</div>`}
function renderSimHoeren(content){let globalNo=0;return`<div class="space-y-5">${content.texts.map((part,pi)=>`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-purple-500 font-bold">Audio ${pi+1} · ${safeText(part.kind)} · ${part.questions.length} Aufgaben</p><h2 class="font-black text-xl mt-1">${safeText(part.title)}</h2></div><span class="text-xs text-gray-500">${part.time} min</span></div><div class="mt-4 flex flex-wrap gap-2"><button type="button" onclick="playSimHoeren(${JSON.stringify(part.text)})" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-sm">Audio abspielen</button><button type="button" onclick="stopSimHoeren()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-gray-700 text-sm font-bold">Stoppen</button></div><details class="mt-4 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><summary class="font-bold cursor-pointer">Transkript erst nach dem Hören kontrollieren</summary><p data-learning-content class="mt-3 leading-8 whitespace-pre-line">${safeText(part.text)}</p></details>${part.questions.map((q,qi)=>renderSimHoerenQuestion(q,`${pi}-${qi}`,++globalNo)).join('')}</section>`).join('')}</div>`}
function renderSimSchreiben(content){const val=ensureTestdafSimState().answers?.schreiben||'',count=simWordCount(val);return`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-amber-500 font-bold">Grafikbeschreibung · Argumentation</p><h2 class="text-2xl font-black">${safeText(content.title)}</h2></div><span class="text-xs text-gray-500">${content.time} min</span></div><p class="mt-3 leading-7">${safeText(content.task)}</p><div class="mt-5 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><b>${safeText(content.chartTitle)}</b><div class="mt-4 grid grid-cols-5 gap-2">${content.chart.map(([y,v])=>`<div class="text-center"><div class="h-36 flex items-end justify-center"><span class="w-8 md:w-10 rounded-t bg-gradient-to-t from-indigo-600 to-cyan-400" style="height:${v}%"></span></div><small>${y}</small><b class="block">${v}%</b></div>`).join('')}</div></div><textarea oninput="simWritingAnswer(this.value)" class="mt-5 w-full min-h-[420px] p-4 rounded-2xl border ${S.dark?'bg-gray-900 border-gray-700':'bg-gray-50 border-gray-200'}" placeholder="Schreiben Sie hier 350–400 Wörter …">${safeText(val)}</textarea><div class="mt-2 flex justify-between text-xs"><span>Grafik beschreiben · Ursachen erklären · Position begründen</span><span id="simWritingCount" class="font-bold ${count>=350&&count<=400?'text-emerald-500':'text-amber-500'}">${count} Wörter</span></div></section>`}
async function startSimSpeakingRecording(index){const sim=ensureTestdafSimState(),task=testdafSimData().sprechen.tasks[index];if(!task||!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){S.simSpeakingStatus='unsupported';render();return}try{if(S.speakingRecorder?.state==='recording')return;const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});S.speakingStream=stream;S.speakingChunks=[];const preferred=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'].find(type=>MediaRecorder.isTypeSupported(type)),recorder=preferred?new MediaRecorder(stream,{mimeType:preferred}):new MediaRecorder(stream);S.speakingRecorder=recorder;S.simSpeakingTask=index;recorder.ondataavailable=e=>{if(e.data?.size)S.speakingChunks.push(e.data)};recorder.onstop=async()=>{const mime=(recorder.mimeType||'audio/webm').split(';')[0],blob=new Blob(S.speakingChunks,{type:mime});stopSpeakingStream();await uploadSimSpeakingRecording(blob,mime,index)};recorder.start(250);S.simSpeakingStatus='recording';sim.recordingStartedAt=Date.now();if(S.speakingRecordingInterval)clearInterval(S.speakingRecordingInterval);S.speakingRecordingInterval=setInterval(()=>{const elapsed=Math.floor((Date.now()-sim.recordingStartedAt)/1000),el=$(`#simSpeakingTime-${index}`);if(el)el.textContent=timeStr(elapsed);if(elapsed>=Math.min(600,task.time))stopSimSpeakingRecording()},500);render()}catch(error){console.warn(error);S.simSpeakingStatus='denied';render()}}
function stopSimSpeakingRecording(){if(S.speakingRecorder?.state==='recording'){S.simSpeakingStatus='uploading';if(S.simSpeakingStopTimeout)clearTimeout(S.simSpeakingStopTimeout);S.speakingRecorder.stop();render()}}
async function uploadSimSpeakingRecording(blob,mime,index){const sim=ensureTestdafSimState();try{const form=new FormData();form.append('user_id',S.currentUser);form.append('plan_id','testdaf-simulation');form.append('task_id',`testdaf-sim-${index+1}`);form.append('audio',blob,`testdaf-sim-${index+1}.${mime.includes('ogg')?'ogg':mime.includes('mp4')?'m4a':'webm'}`);const response=await fetch(`${APP_API_BASE}/speaking/recordings`,{method:'POST',body:form});if(!response.ok)throw new Error(`Upload failed: ${response.status}`);const saved=await response.json();sim.recordings[index]={...saved,savedAt:new Date().toISOString()};sim.answers.sprechen[index]=`Audioaufnahme gespeichert: ${saved.id}`;S.recordingDate=today();S.simSpeakingStatus='saved'}catch(error){console.warn(error);const localUrl=URL.createObjectURL(blob);sim.recordings[index]={playback_url:localUrl,local:true,savedAt:new Date().toISOString()};sim.answers.sprechen[index]='Audioaufnahme lokal verfügbar';S.simSpeakingStatus='local-saved'}saveData();render()}
function simRecordingPlayback(recording){if(!recording?.playback_url)return'';return recording.local?recording.playback_url:`${APP_API_BASE.replace(/\/v1$/,'')}${recording.playback_url}`}
function renderSimSprechen(content){const sim=ensureTestdafSimState();return`<div class="space-y-4"><section class="p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-900/20 text-sm"><b>Prüfungsmodus:</b> Lesen Sie die Aufgabe, nutzen Sie die Vorbereitungszeit und nehmen Sie anschließend Ihre Antwort auf. Es gibt kein Textfeld.</section>${content.tasks.map((task,i)=>{const recording=sim.recordings?.[i],playback=simRecordingPlayback(recording),active=S.simSpeakingTask===i,status=active?S.simSpeakingStatus:'idle';return`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-indigo-500 font-bold">Aufgabe ${i+1} · ${safeText(task.type)}</p><h2 class="font-black text-xl mt-1">${safeText(task.q)}</h2></div><div class="text-right text-xs text-gray-500"><div>Vorbereitung ${task.prep}s</div><div>Sprechen ${task.time}s</div></div></div><div class="mt-5 p-5 rounded-2xl text-center ${status==='recording'?'bg-red-50 dark:bg-red-900/20 ring-2 ring-red-400':S.dark?'bg-gray-900':'bg-gray-50'}"><div class="mx-auto w-12 h-12 rounded-full grid place-items-center ${status==='recording'?'bg-red-500 text-white animate-pulse':'bg-indigo-100 text-indigo-600'}">${iconSvg('microphone')}</div><p id="simSpeakingTime-${i}" class="mt-2 font-mono font-bold">${status==='recording'?'00:00':recording?'Gespeichert':'Bereit'}</p><p class="mt-1 text-xs text-gray-500">${status==='recording'?'Aufnahme läuft …':status==='uploading'?'Aufnahme wird gespeichert …':status==='denied'?'Mikrofonzugriff wurde abgelehnt.':status==='unsupported'?'Dieser Browser unterstützt keine Audioaufnahme.':status==='local-saved'?'Lokal gespeichert; Server war nicht erreichbar.':'Maximal 10 Minuten; für diese Aufgabe gilt die angegebene Sprechzeit.'}</p><div class="mt-4 flex flex-wrap justify-center gap-2">${status==='recording'?`<button onclick="stopSimSpeakingRecording()" class="px-5 py-2.5 rounded-xl bg-red-600 text-white font-bold">Aufnahme stoppen</button>`:status==='uploading'?`<button disabled class="px-5 py-2.5 rounded-xl bg-gray-300 text-gray-600">Speichern …</button>`:`<button onclick="startSimSpeakingRecording(${i})" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold">${recording?'Neu aufnehmen':'Aufnahme starten'}</button>`}</div>${recording?`<audio controls class="w-full mt-4" src="${safeText(playback)}"></audio>`:''}</div></section>`}).join('')}</div>`}

function answerListening(i){

function nextListeningQ(){
  const h=S.listeningData;
  if(S.listeningStep<h.questions.length){S.listeningStep++;S.activityProgress.listening.step=S.listeningStep;render()}
  else{finishListening()}
}

async function finishListening(){
  S.listeningDone=true;S.activityProgress.listening.done=true;
  stopTimers();

  // Calculate score locally first
  const h=S.listeningData;
  let correct=0;
  h.questions.forEach((q,i)=>{if(S.listeningAnswers[i]===q.c)correct++;else rememberLearningError({type:'hoeren',category:'listening',question:q.q||'',userAnswer:S.listeningAnswers[i]!==undefined?q.o?.[S.listeningAnswers[i]]:'Keine Antwort',correctAnswer:q.o?.[q.c]||'',explanation:q.ex||'',context:h.text||'',source:'hoeren',sourceKey:`${S.plan?.id||today()}:hoeren:${i}`})});
  const localScore={score:correct,total:h.questions.length,feedback:''};

  // Send to AI for grading
  S.aiStatus='🤖 Bewertung durch AI...';render();
  const topicLabel=S.user.customTopic||getSubtopicLabel(S.user.subtopic)||getTopicLabel(S.user.topic);
  const prompt=`Du bist ein TestDaF-Prüfer. Bewerte das Hörverständnis eines Schülers zum Thema "${topicLabel}".

Hörtext:
"${h.text}"

Fragen und Antworten des Schülers:
${h.questions.map((q,i)=>`Frage ${i+1}: ${q.q}\nAntwortmöglichkeiten: ${q.o.join(' | ')}\nRichtige Antwort: ${q.o[q.c]}\nSchüler-Antwort: ${S.listeningAnswers[i]!==undefined?q.o[S.listeningAnswers[i]]:'Keine Antwort'}`).join('\n\n')}

Antworte NUR mit JSON (kein Markdown):
{"score": ${correct}, "total": ${h.questions.length}, "feedback": "Feedback auf Deutsch (2-3 Sätze, positiv und konstruktiv)"}`;

  const result=await callAI(prompt);
  if(result&&result.content){
    try{
      let jsonStr=result.content.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
      const data=JSON.parse(jsonStr);
      S.listeningGrading={score:data.score||correct,total:data.total||h.questions.length,feedback:data.feedback||''};
    }catch(e){}
  }
  if(!S.listeningGrading)S.listeningGrading=localScore;
  S.aiStatus='';render();
}

function generateGesamttest(){
  const vocab=getVocabForTopic().sort(()=>Math.random()-.5).slice(0,3).map(v=>({type:'vocab',q:v.w,options:[v.t,'ترجمه دیگر','معنی نادرست','بدون معنی'],c:0,ex:v.ex}));
  const grammar=getGrammarForTopic().sort(()=>Math.random()-.5).slice(0,3).map(g=>({type:'grammar',...g}));
  const listen=getHoerenForTopic();
  const listenQ=listen.questions.slice(0,2).map(lq=>({type:'listening',...lq}));
  return[...vocab,...grammar,...listenQ].sort(()=>Math.random()-.5);
}

function renderGesamttest(){
  const g=S.gesamttest;
  if(g.done){
    const pts=S.activityPoints.gesamttest||0;
    const totalQ=g.sections.length;
    return`<div class="min-h-screen ${S.dark?'bg-gray-900':'bg-gray-50'} flex items-center justify-center p-4"><div class="slide-up ${S.dark?'bg-gray-800':'bg-white'} rounded-3xl shadow-xl p-8 max-w-md w-full text-center">

      <h2 class="text-2xl font-bold ${S.dark?'text-white':'text-gray-900'}">${g.score}/${totalQ} richtig</h2>
      <p class="text-sm ${S.dark?'text-gray-400':'text-gray-500'} mt-2">Gesamttest abgeschlossen!</p>

    </div></div>`;
  }
  const q=g.sections[g.current];
  const ans=g.answers[g.current]||null;
  const totalQ=g.sections.length;
  const el=S.activityTimers.gesamttest||0;
  const typeIcon=q.type==='vocab'?'📚':q.type==='grammar'?'📝':'🎧';
  const typeLabel=q.type==='vocab'?'Vokabel':q.type==='grammar'?'Grammatik':'Hören';
  return`<div class="min-h-screen ${S.dark?'bg-gray-900':'bg-gray-50'}"><div class="max-w-lg mx-auto p-4 py-6">
    <div class="flex items-center justify-between mb-5"><button onclick="pauseActivity()" class="p-2 rounded-lg ${S.dark?'bg-gray-800 text-gray-400':'bg-white text-gray-500'} shadow">✕</button><div class="flex items-center gap-3"><span id="actTimer" class="text-sm font-mono font-bold text-indigo-500 timer-pulse">⏱ ${timeStr(el)}</span><span class="text-sm ${S.dark?'text-gray-400':'text-gray-500'}">${g.current+1}/${totalQ}</span></div></div>
    <div class="h-2 ${S.dark?'bg-gray-700':'bg-gray-200'} rounded-full overflow-hidden mb-4"><div class="h-full bg-gradient-to-r from-purple-400 to-indigo-500 rounded-full transition-all" style="width:${(g.current/totalQ)*100}%"></div></div>
    <div class="slide-up ${S.dark?'bg-gray-800':'bg-white'} rounded-2xl shadow-lg p-6">
      <div class="flex items-center gap-2 mb-4"><span class="text-lg">${typeIcon}</span><span class="text-xs px-2 py-1 rounded-full ${q.type==='vocab'?'bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400':q.type==='grammar'?'bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400':'bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400'}">${typeLabel}</span></div>
      <p class="text-lg font-medium ${S.dark?'text-white':'text-gray-900'} mb-6">${q.q}</p>
      <div class="space-y-3">${q.o.map((opt,i)=>{const isC=i===q.c,isS=ans&&ans.sel===i;let bg=S.dark?'bg-gray-700 hover:bg-gray-600':'bg-gray-50 hover:bg-gray-100';if(ans){if(isC)bg='bg-green-100 dark:bg-green-900/30 border-green-400';else if(isS)bg='bg-red-100 dark:bg-red-900/30 border-red-400';else bg=S.dark?'bg-gray-700 opacity-50':'bg-gray-50 opacity-50'}
        return`<button onclick="answerGesamttest(${i})" class="w-full p-4 rounded-xl border-2 text-left font-medium transition ${bg} ${ans&&isC?'border-green-400':ans&&isS?'border-red-400':'border-transparent'} ${S.dark?'text-white':'text-gray-800'}"><span class="inline-block w-8 h-8 rounded-full ${S.dark?'bg-gray-600':'bg-gray-200'} text-center leading-8 text-sm mr-3">${String.fromCharCode(65+i)}</span>${opt}</button>`}).join('')}</div>
      ${ans?`
        ${ans.ok?`<div class="mt-4 p-3 rounded-xl bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800"><p class="text-sm text-green-700 dark:text-green-400">✅ Richtig!</p></div>`:`<div class="mt-4 p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800"><p class="text-sm text-red-700 dark:text-red-400">❌ Falsch — ${q.ex||''}</p></div>`}
        <button onclick="nextGesamttestQ()" class="mt-4 w-full py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-500 to-purple-500 transition shadow-lg">${g.current<totalQ-1?'Nächste →':'Ergebnis'}</button>
      `:''}
    </div>
  </div></div>`;
}

function answerGesamttest(i){
  if(S.gesamttest.answers[S.gesamttest.current])return;
  const g=S.gesamttest,q=g.sections[g.current];
  const ok=i===q.c;
  if(ok)g.score++;else rememberLearningError({type:q.type||'mini_test',category:'mini_test',question:q.q||'',userAnswer:q.options?.[i]||q.o?.[i]||String(i),correctAnswer:q.options?.[q.c]||q.o?.[q.c]||'',explanation:q.ex||'',source:'mini_test',sourceKey:`${S.plan?.id||today()}:mini:${g.current}`});
  g.answers[g.current]={sel:i,ok};
  S.activityProgress.gesamttest={...g};
  render();
}

function nextGesamttestQ(){
  const g=S.gesamttest;
  if(g.current<g.sections.length-1){g.current++;S.activityProgress.gesamttest={...g};render()}
  else{g.done=true;S.activityProgress.gesamttest={...g};stopTimers();render()}
}

function addErrorManual(){

async function generateErrorWithAI(){
  if(S.aiLoading)return;
  const input=($('#aiErrInput')||{}).value?.trim();
  if(!input)return;
  S.aiLoading=true;S.aiStatus='AI analysiert...';render();
  const prompt=`Analysiere diesen Fehler eines TestDaF-Schülers und erstelle ein Fehler-Entry. Antworte NUR mit JSON (kein Markdown):
Input: "${input}"

JSON Mini schema:
{
  "type": "grammar|vocabulary|style",
  "category": "Artikel|Kasus|Konjugation|Rechtschreibung|Wortschatz|...",
  "userAnswer": "der Fehler des Schülers",
  "correctAnswer": "die korrekte Form",
  "explanation": "Erklärung auf Deutsch",
  "context": "Beispielsatz mit dem Fehler",
  "severity": 0.5-2.0
}`;
  const result=await callAI(prompt);
  if(result&&result.content){
    try{
      let jsonStr=result.content.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
      const data=JSON.parse(jsonStr);
      addError({type:data.type||'grammar',category:data.category||'Sonstiges',userAnswer:data.userAnswer||input,correctAnswer:data.correctAnswer||'',explanation:data.explanation||'',context:data.context||'',source:'ai',severity:data.severity||1});
      S.aiLoading=false;S.aiStatus='✅ Fehler gespeichert!';render();
      setTimeout(()=>{S.aiStatus='';render()},2000);
    }catch(e){
      S.aiLoading=false;S.aiStatus='⚠️ parsing error';render();
    }
  }else{
    S.aiLoading=false;S.aiStatus='⚠️ Kein AI-Antwort';render();
  }
}

  return`<div class="history-shell min-h-screen pb-28 text-slate-100"><main class="history-board max-w-[1500px] mx-auto p-3 md:p-6"><header class="history-topbar"><div class="flex items-center gap-3"><div class="history-avatar">${userAvatar}</div><div><p class="text-xs text-slate-400">Learning analytics</p><h1 class="text-xl md:text-3xl font-black">Hallo, ${safeText(S.user.name||'Learner')}</h1></div></div><div class="flex items-center gap-2"><label class="history-period"><span>Zeitraum</span><select onchange="S.historyFilter=this.value;saveData();render()">${periods.map(p=>`<option value="${p.v}" ${timeFilter===p.v?'selected':''}>${p.l}</option>`).join('')}</select></label><button onclick="toggleDark()" class="history-icon-btn" aria-label="Darstellung wechseln">${S.dark?'☀️':'◐'}</button></div></header>
  <div class="history-layout"><aside class="history-side-card"><div><span class="history-eyebrow">FORTSCHRITT</span><h2 class="mt-2 text-2xl font-black">Deine Lernreise</h2><p class="mt-2 text-sm text-slate-400 leading-6">Alle Pläne, Lernzeiten und Ergebnisse kompakt an einem Ort.</p></div><div class="history-completion"><div class="history-ring" style="--value:${activityRate*3.6}deg"><div><b>${activityRate}%</b><span>erledigt</span></div></div></div><div class="space-y-3">${[['Lernpläne',filtered.length,'#38bdf8'],['Aktivitäten',`${completedActivities}/${totalActivities}`,'#a855f7'],['Lernzeit',timeStr(totalSeconds),'#fb7185']].map(x=>`<div class="history-mini-stat"><i style="background:${x[2]}"></i><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><button onclick="navigateApp('dashboard')" class="history-primary-btn">Weiterlernen <span>→</span></button></aside>
  <section class="history-center"><article class="history-panel history-trend"><div class="history-panel-head"><div><span class="history-eyebrow">REPORT</span><h2>Lernleistung</h2></div><div class="history-score-pill"><small>Lernzeit / Tag - Trend ${trendText}</small><b>${chartAverage==null?'--':fmtChartTime(chartAverage)}</b></div></div><div class="history-chart-wrap">${chartValues.length?`<svg viewBox="0 0 ${chartW} ${chartH}" role="img" aria-label="Lernzeit pro Tag mit Minutenachse"><defs><linearGradient id="historyArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>${chartTicks.map(v=>{const y=padT+plotH-(v/chartMax*plotH);return`<g><line x1="${padL}" y1="${y}" x2="${chartW-padR}" y2="${y}" class="history-gridline"/><text x="${padL-8}" y="${y+4}" text-anchor="end" class="history-axis-label">${fmtChartTime(v)}</text></g>`}).join('')}<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" class="history-axis-line"/><line x1="${padL}" y1="${padT+plotH}" x2="${chartW-padR}" y2="${padT+plotH}" class="history-axis-line"/><polygon points="${areaPoints}" fill="url(#historyArea)"/><polyline points="${points}" class="history-line"/>${pointList.map((pt,i)=>`<g><circle cx="${pt.x}" cy="${pt.y}" r="${i===pointList.length-1?5:3}" class="history-dot"><title>${new Date(`${chronological[i].date}T00:00:00`).toLocaleDateString('de-DE')} - ${fmtChartTime(pt.value)}</title></circle>${pointList.length<=10?`<text x="${pt.x}" y="${Math.max(12,pt.y-10)}" text-anchor="middle" class="history-point-label">${fmtChartTime(pt.value)}</text>`:''}</g>`).join('')}</svg>`:`<div class="history-empty-chart"><span>--</span><p>Noch keine Lernzeit fuer diesen Zeitraum.</p></div>`}</div><div class="history-chart-labels" style="padding-left:58px">${chronological.map(d=>`<span>${new Date(`${d.date}T00:00:00`).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})}</span>`).join('')}</div></article>
  <article class="history-panel"><div class="history-panel-head"><div><span class="history-eyebrow">TÄGLICHE ÜBERSICHT</span><h2>Letzte Lernpläne</h2></div><span class="text-xs text-slate-400">Tippen für Details</span></div>${filtered.length?`<div class="history-days">${filtered.map((day,index)=>{const rowKey=day.date,expanded=S.expandedHistoryPlan===rowKey,groupedTimes={};Object.entries(day.activityTimes||{}).forEach(([id,value])=>{const skill=historySkillId(id);groupedTimes[skill]=(groupedTimes[skill]||0)+(Number(value)||0)});const skillIds=[...new Set([...Object.keys(groupedTimes),...Object.keys(day.skillScores||{}).filter(id=>id!=='gesamt')])],score=Number.isFinite(day.score)?day.score:null;return`<article class="history-day ${expanded?'is-open':''}"><div class="history-day-row"><button type="button" onclick='toggleHistoryDay(${JSON.stringify(rowKey)})' aria-expanded="${expanded}" class="history-day-main"><span class="history-day-index">${String(index+1).padStart(2,'0')}</span><span class="min-w-0 flex-1"><b>${new Date(`${day.date}T00:00:00`).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'})}</b><small>${safeText(day.examName||EXAM_PLANS[day.examType]?.name||'TestDaF')} · ${day.comp||0}/${day.acts||0} Aktivitäten</small></span><span class="history-day-time">${timeStr(day.time||0)}</span><span class="history-day-score ${score>=70?'good':score!=null?'warn':''}">${score==null?'—':score}</span><span class="history-chevron">⌄</span></button></div>${expanded?`<div class="history-day-detail">${skillIds.length?skillIds.map((id,i)=>`<div><span><i style="background:${palette[i%palette.length]}"></i>${historyActivityLabel(id)}</span><b>${timeStr(groupedTimes[id]||0)}</b><strong>${Number.isFinite(day.skillScores?.[id])?day.skillScores[id]+'/100':'—'}</strong></div>`).join(''):`<p>Noch keine Skill-Daten gespeichert.</p>`}</div>`:''}</article>`}).join('')}</div>`:`<div class="history-empty-chart py-14"><span>◇</span><p>Keine Lerndaten in diesem Zeitraum</p><button onclick="navigateApp('dashboard')">Erste Aktivität starten</button></div>`}</article></section>
  <aside class="history-right"><article class="history-panel history-distribution"><div class="history-panel-head"><div><span class="history-eyebrow">VERTEILUNG</span><h2>Lernzeit nach Skill</h2></div></div><div class="history-donut" style="background:conic-gradient(${donutStops})"><div><b>${Math.round(totalSeconds/60)}</b><span>Minuten</span></div></div><div class="history-legend">${skillEntries.length?skillEntries.slice(0,6).map(([id,value],i)=>`<div><i style="background:${palette[i%palette.length]}"></i><span>${historyActivityLabel(id)}</span><b>${Math.round(value/60)}m</b></div>`).join(''):`<p>Noch keine Lernzeit erfasst.</p>`}</div></article>
  <article class="history-panel"><div class="history-panel-head"><div><span class="history-eyebrow">SKILL-ZIELE</span><h2>Wochenfokus</h2></div></div><div class="history-goals">${SKILLS.map((skill,i)=>{const key=skill.id==='vocab'?'wortschatz':skill.id,actual=skillTimes[key]||0,targetMinutes=Number(S.skillTargets[key]||15),targetSeconds=targetMinutes*60,progress=Math.min(100,Math.round(actual/targetSeconds*100)||0);return`<label><span><i style="background:${palette[i%palette.length]}"></i>${skill.l}<b>${progress}%</b></span><div><em style="width:${progress}%;background:${palette[i%palette.length]}"></em></div><small>${timeStr(actual)} / ${targetMinutes} Min</small><input aria-label="Ziel für ${skill.l}" type="range" min="5" max="120" step="5" value="${targetMinutes}" onchange="setSkillTarget('${key}',this.value)"></label>`}).join('')}</div></article></aside></div></main></div>`;
}function setSkillTarget(skill,val){
  const v=parseInt(val)||0;
  if(!S.skillTargets)S.skillTargets={};
  S.skillTargets[skill]=v;
  saveData();render();
}

if(session&&REQUIRE_SERVER_ACCOUNT&&!authTokens()){DB.clearSession();S.authError='???? ????? ??????? ??? ????????? ???? ?????? ???? ???? ????.';S.screen='auth';render()}

</script>
