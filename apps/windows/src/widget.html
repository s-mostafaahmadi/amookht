<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amookht — Widget</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="widget" id="widget">
    <header class="w-head">
      <h1 class="w-title" id="w-title">کارها</h1>
      <div class="w-tools">
        <button class="w-icon" id="btn-pin" type="button" data-act="pin" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 10h4v7h6v-7h4zM7 20h10v1.6H7z"/></svg>
        </button>
        <button class="w-icon" id="btn-add" type="button" data-act="add">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        </button>
        <button class="w-icon" id="btn-refresh" type="button" data-act="refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button class="w-icon" id="btn-close" type="button" data-act="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
        </button>
      </div>
    </header>

    <nav class="w-tabs" role="tablist">
      <button class="w-tab is-active" type="button" role="tab" data-tab="todos" id="tab-todos">کارها</button>
      <button class="w-tab" type="button" role="tab" data-tab="notes" id="tab-notes">یادداشت‌ها</button>
    </nav>

    <main class="w-body" id="w-body">
      <form class="w-add" id="add-form" hidden autocomplete="off">
        <input id="add-title" type="text" maxlength="200" />
        <textarea id="add-content" rows="3" maxlength="20000" hidden></textarea>
        <div class="w-add-actions">
          <button class="w-btn w-btn-primary" type="submit" id="add-submit">افزودن</button>
          <button class="w-btn" type="button" data-act="add-cancel" id="add-cancel">انصراف</button>
        </div>
      </form>
      <ul class="w-list" id="w-list"></ul>
      <div class="w-empty" id="w-empty" hidden></div>
    </main>

    <footer class="w-foot">
      <span class="w-count" id="w-count"></span>
      <span class="w-status" id="w-status"></span>
      <button class="w-link" type="button" data-act="logout" id="btn-logout">خروج از حساب</button>
    </footer>
  </div>

  <script src="widget.js"></script>
</body>
</html>
