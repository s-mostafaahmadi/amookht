  if(typeRequired&&!String(question.type||question.question_type||'').trim())errors.push(`${path}.type is required.`);
  if(!String(question.diff||question.difficulty||question.cefr_level||'').trim())errors.push(`${path}.diff is required.`);
  if(!(Number(question.time||question.recommended_answering_time_seconds||question.recommended_time_seconds)>0))errors.push(`${path}.time must be a positive number of seconds.`);
  if(!String(question.a||question.answer||question.correct_answer||'').trim())errors.push(`${path}.a is required.`);

function addReviewDays(days){const date=new Date();date.setHours(12,0,0,0);date.setDate(date.getDate()+Math.max(0,Math.round(days||0)));return date.toISOString().split('T')[0]}
function errorKind(error){
  const value=String(error?.type||error?.category||'other').toLowerCase();
  if(/wort|vocab|word|nicht gewusst/.test(value))return'vocabulary';
  if(/gramm/.test(value))return'grammar';
  if(/lesen|read/.test(value))return'reading';
  if(/h[o?]ren|hoeren|listen/.test(value))return'listening';
  if(/schreib|writ/.test(value))return'writing';
  if(/sprech|speak/.test(value))return'speaking';
  return'other';
}
function normalizeLearningError(error={}){
  const history=Array.isArray(error.history)?error.history:[];
  const successful=history.filter(item=>Number(item.rating??item.quality)>=2).length;
  return{...error,id:error.id||('err_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)),type:error.type||'practice',category:error.category||error.type||'practice',question:String(error.question||''),userAnswer:String(error.userAnswer||''),correctAnswer:String(error.correctAnswer||''),explanation:String(error.explanation||''),context:String(error.context||''),source:error.source||'auto',createdAt:error.createdAt||new Date().toISOString(),mistakeCount:Math.max(1,Number(error.mistakeCount)||1),reviewCount:Math.max(history.length,Number(error.reviewCount)||0),successCount:Number.isFinite(Number(error.successCount))?Number(error.successCount):successful,lapses:Math.max(0,Number(error.lapses)||0),easeFactor:Math.min(3,Math.max(1.3,Number(error.easeFactor)||2.5)),intervalDays:Math.max(0,Number(error.intervalDays)||0),nextReview:error.nextReview===null?null:(error.nextReview||today()),nextReviewAt:error.nextReviewAt||null,isMastered:!!error.isMastered,history};
}
function addError(err){const item=normalizeLearningError({...err,id:'err_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),nextReview:today(),nextReviewAt:null,isMastered:false,history:[]});S.errors.push(item);saveData();return item}
function learningErrorWorthReview(err){/*REVIEW-FILTER*/const src=String(err.source||''),qt=String(err.qtype||'').toLowerCase();if(['coach','mini_test','grammar','hoeren'].includes(src))return false;if(['mc','rf','jnt','match','tf','multiple_choice','true_false','richtig_falsch','selfcheck'/*REVIEW-FILTER2*/].includes(qt))return false;if(!String(err.correctAnswer||'').trim()&&!String(err.explanation||'').trim())return false;return true}
function rememberLearningError(err){
  if(!err||!learningErrorWorthReview(err))return false;
  const sourceKey=err.sourceKey||[err.type,err.category,err.userAnswer,err.correctAnswer,err.question].join('|');
  const existing=S.errors.find(item=>(item.sourceKey||'')===sourceKey);
  if(existing){const normalized=normalizeLearningError(existing);Object.assign(existing,normalized,{mistakeCount:normalized.mistakeCount+1,lastMistakeAt:new Date().toISOString(),nextReview:today(),nextReviewAt:null,isMastered:false,severity:Math.max(Number(existing.severity)||1,Number(err.severity)||1)});saveData();return true}
  addError({type:err.type||'practice',category:err.category||err.type||'practice',question:err.question||'',userAnswer:String(err.userAnswer||'').slice(0,800),correctAnswer:String(err.correctAnswer||'').slice(0,800),explanation:err.explanation||'',context:err.context||'',source:err.source||'auto',severity:err.severity||1,sourceKey,createdAt:new Date().toISOString(),planId:S.plan?.id||null,mistakeCount:1});return true;
}
function rememberVocabUnknown(item,source='vocabulary'){if(!item)return;const word=item.word||item.w||'';rememberLearningError({type:'wortschatz',category:'Nicht gewusst',question:'Flashcard vocabulary',userAnswer:word,correctAnswer:item.meaning_native||item.meaning_english||item.t||item.en||'',explanation:item.example_sentence||item.ex||'',context:(item.collocations||[]).join(' - '),source,sourceKey:source+':vocab:'+word})}
function ankiSchedule(error,rating){
  const card=normalizeLearningError(error),old=Math.max(0,card.intervalDays||0),ease=card.easeFactor||2.5;
  if(rating===0)return{intervalDays:0,nextReview:today(),nextReviewAt:new Date(Date.now()+10*60000).toISOString(),easeFactor:Math.max(1.3,ease-.2),lapses:card.lapses+1,isMastered:false,label:'10 min'};
  if(rating===1){if(old<1)return{intervalDays:.5,nextReview:today(),nextReviewAt:new Date(Date.now()+12*60*60000).toISOString(),easeFactor:Math.max(1.3,ease-.15),lapses:card.lapses,isMastered:false,label:'12 h'};const interval=Math.max(1,Math.round(old*1.2));return{intervalDays:interval,nextReview:addReviewDays(interval),nextReviewAt:null,easeFactor:Math.max(1.3,ease-.15),lapses:card.lapses,isMastered:false,label:interval+' d'}}
  if(rating===2){const interval=old<1?1:old===1?3:Math.max(old+1,Math.round(old*ease));return{intervalDays:interval,nextReview:addReviewDays(interval),nextReviewAt:null,easeFactor:ease,lapses:card.lapses,isMastered:interval>=90,label:interval+' d'}}
  const interval=old<1?4:Math.max(old+2,Math.round(old*ease*1.3));return{intervalDays:interval,nextReview:addReviewDays(interval),nextReviewAt:null,easeFactor:Math.min(3,ease+.15),lapses:card.lapses,isMastered:interval>=60,label:interval+' d'};
}
function reviewError(id,rating,timeSpent){const error=S.errors.find(item=>item.id===id);if(!error)return;const card=normalizeLearningError(error),result=ankiSchedule(card,Number(rating));Object.assign(error,card,result,{reviewCount:card.reviewCount+1,successCount:card.successCount+(Number(rating)>=2?1:0),lastReview:new Date().toISOString()});error.history.push({rating:Number(rating),quality:Number(rating),date:today(),at:new Date().toISOString(),timeSpent:Number(timeSpent)||0,intervalDays:result.intervalDays});saveData()}
function getDueErrors(){const day=today(),now=Date.now();return S.errors.map(normalizeLearningError).filter(error=>!error.isMastered&&error.nextReview&&error.nextReview<=day&&(!error.nextReviewAt||new Date(error.nextReviewAt).getTime()<=now)).sort((a,b)=>(Number(b.mistakeCount)-Number(a.mistakeCount))||String(a.nextReview).localeCompare(String(b.nextReview)))}

async function deleteAdminCreatedContent(entryId,confirmed=false){const normalized=String(entryId||'').replace(/^created-/,'');if(!isGlobalContentAdmin()||!normalized||S.adminContentDeleteBusy||(!confirmed&&!await appConfirm('این محتوا برای همه کاربران حذف شود؟')))return;S.adminContentDeleteBusy=true;try{const currentScreen=S.screen,currentActivity=S.activeActivity;if(currentScreen==='vocabulary'&&findCreatedContentEntry(S.vocabData?.[S.vocabIndex])===normalized){S.vocabData.splice(S.vocabIndex,1);S.vocabIndex=Math.min(S.vocabIndex,Math.max(0,S.vocabData.length-1));S.vocabFlipped=false;if(S.activityProgress.vocab){S.activityProgress.vocab.data=S.vocabData;S.activityProgress.vocab.index=S.vocabIndex}}await apiRequest(`/content-bank/items/${encodeURIComponent(normalized)}`,{method:'DELETE'});removeCreatedEntryFromBank(S.contentBankGlobal,normalized);removeCreatedEntryFromBank(S.contentBankPersonal,normalized);await Promise.all([loadGlobalContentBank(),loadPrivateCreatedContent()]);S.learningResources=null;if(S.plan)await loadStoredResources({silent:true});S.screen=currentScreen;S.activeActivity=currentActivity;saveData();showGlassAlarm('محتوا حذف شد.',{type:'success',source:'admin-content-delete'})}catch(error){showGlassAlarm('حذف انجام نشد: '+error.message,{type:'error',source:'admin-content-delete'})}finally{S.adminContentDeleteBusy=false;render()}}
function findCreatedContentEntry(value,depth=0){if(!value||depth>4)return'';if(typeof value==='object'&&!Array.isArray(value)){if(value.created_entry_id)return value.created_entry_id;if(/^created-/.test(String(value.id||'')))return String(value.id).slice(8);for(const child of Object.values(value)){const found=findCreatedContentEntry(child,depth+1);if(found)return found}}else if(Array.isArray(value))for(const child of value){const found=findCreatedContentEntry(child,depth+1);if(found)return found}return''}
function findAdminContentLocator(value,depth=0){if(!value||depth>4)return null;if(typeof value==='object'&&!Array.isArray(value)){const entryId=value.created_entry_id||(/^created-/.test(String(value.id||''))?String(value.id).slice(8):'');if(entryId)return{kind:'created',entryId:String(entryId)};if(value._global_topic&&value._global_skill&&Number.isInteger(Number(value._global_item_index)))return{kind:'global',topic:String(value._global_topic),skill:String(value._global_skill),itemIndex:Number(value._global_item_index),questionIndex:Number.isInteger(Number(value._global_question_index))?Number(value._global_question_index):null};for(const child of Object.values(value)){const found=findAdminContentLocator(child,depth+1);if(found)return found}}else if(Array.isArray(value))for(const child of value){const found=findAdminContentLocator(child,depth+1);if(found)return found}return null}
async function toggleOwnerDatabaseMode(){S.ownerDatabaseMode='public';return;if(S.activeActivity)checkpointActiveActivity({stop:true});S.ownerDatabaseMode=S.ownerDatabaseMode==='private'?'public':'private';localStorage.setItem('amookht_owner_db_mode_'+String(S.currentUser).toLowerCase(),S.ownerDatabaseMode);S.learningResources=null;S.dataSource=null;S.activeActivity=null;S.screen='dashboard';showGlassAlarm(S.ownerDatabaseMode==='private'?'دیتابیس خصوصی فعال شد.':'دیتابیس عمومی فعال شد.',{type:'success',source:'owner-database-mode'});render();await loadStoredResources({silent:true});render()}
function removeCreatedEntryFromBank(bank,entryId){const normalized=String(entryId||'').replace(/^created-/,'');Object.values(bank?.topics||{}).forEach(topic=>Object.values(topic||{}).forEach(skill=>{if(Array.isArray(skill?.items))skill.items=skill.items.filter(item=>String(item?.created_entry_id||item?.id||'').replace(/^created-/,'')!==normalized)}))}
function removeCreatedEntryFromPersonalBank(entryId){removeCreatedEntryFromBank(S.contentBankPersonal,entryId)}
async function publishOwnerContent(entryId){if(!isOwnerAccount()||S.ownerDatabaseMode!=='private'||!await appConfirm('این محتوا برای تمام کاربران به دیتابیس عمومی منتقل شود؟'))return;try{const saved=await apiRequest(`/content-bank/items/${encodeURIComponent(entryId)}/publish`,{method:'POST'});removeCreatedEntryFromPersonalBank(entryId);mergeCreatedContentTopics(S.contentBankGlobal,{topics:{[saved.topic_key]:{[saved.skill_key]:{items:[saved.item]}}}});S.learningResources=null;await loadStoredResources({silent:true});saveData();showGlassAlarm('محتوا به دیتابیس عمومی منتقل شد.',{type:'success',source:'owner-content-publish'});render()}catch(error){showGlassAlarm('انتقال انجام نشد: '+error.message,{type:'error',source:'owner-content-publish'});render()}}
function activeCreatedContentSource(){const skill=activeSkillComposerKey();if(!skill)return null;if(skill==='wortschatz'&&S.screen==='vocabulary')return S.vocabData?.[S.vocabIndex];if(skill==='hoeren'&&S.screen==='listening')return S.listeningData;const section=S.learningResources?.package?.content?.[skill];if(S.screen==='contractActivity'){const current=S.activityProgress?.[S.activeActivity?.id]?.current||0,question=sectionQuestions(skill,section)?.[current];if(findCreatedContentEntry(question))return question;if(skill==='wortschatz')return contractVocabularyItems(section)?.[current]}return section}
function activeCreatedQuestionContext(){const skill=activeSkillComposerKey();let questions=[],current=0;if(S.screen==='contractActivity'){const section=S.learningResources?.package?.content?.[skill];questions=sectionQuestions(skill,section)||[];current=S.activityProgress?.[S.activeActivity?.id]?.current||0}else if(S.screen==='grammar'){questions=getGrammarForTopic()||[];current=S.grammarQuiz?.current||0}else if(S.screen==='listening'){questions=S.listeningData?.questions||[];current=Math.max(0,Number(S.listeningStep)||0)}else return null;const question=questions[current],entryId=findCreatedContentEntry(question);if(!entryId)return null;const siblings=questions.filter(item=>findCreatedContentEntry(item)===entryId),questionIndex=Math.max(0,siblings.indexOf(question));return{entryId,questionId:String(question?.id||questionIndex),questionIndex,question}}
function removeCreatedQuestionFromBank(bank,entryId,questionId,questionIndex){const normalized=String(entryId).replace(/^created-/,'');Object.values(bank?.topics||{}).forEach(topic=>Object.values(topic||{}).forEach(skill=>(skill?.items||[]).forEach(item=>{if(String(item?.created_entry_id||item?.id||'').replace(/^created-/,'')!==normalized)return;const key=Array.isArray(item.questions)?'questions':Array.isArray(item.exercises)?'exercises':'';if(!key)return;const exact=item[key].findIndex(q=>String(q?.id||'')===String(questionId));item[key].splice(exact>=0?exact:questionIndex,1)})))}
async function deleteAdminActiveQuestion(){if(!isGlobalContentAdmin()||S.adminQuestionDeleteBusy||!await appConfirm('فقط همین سؤال حذف شود؟'))return;const locator=activeAdminQuestionLocator();if(!locator)return;const currentScreen=S.screen,currentActivity=S.activeActivity;S.adminQuestionDeleteBusy=true;try{if(locator.kind==='created'){await apiRequest(`/content-bank/items/${encodeURIComponent(locator.entryId)}/questions/${encodeURIComponent(locator.questionId)}?question_index=${locator.questionIndex}`,{method:'DELETE'});removeCreatedQuestionFromBank(S.contentBankGlobal,locator.entryId,locator.questionId,locator.questionIndex);removeCreatedQuestionFromBank(S.contentBankPersonal,locator.entryId,locator.questionId,locator.questionIndex)}else{const qi=locator.questionIndex;if(qi===null)throw new Error('شناسه سؤال پیدا نشد.');await apiRequest(`/content-bank/global/${encodeURIComponent(locator.topic)}/${encodeURIComponent(locator.skill)}/items/${locator.itemIndex}/questions/${qi}`,{method:'DELETE'});await loadGlobalContentBank()}S.learningResources=null;await loadStoredResources({silent:true});S.screen=currentScreen;S.activeActivity=currentActivity;saveData();showGlassAlarm('سؤال حذف شد.',{type:'success',source:'admin-question-delete'})}catch(error){showGlassAlarm('حذف سؤال انجام نشد: '+error.message,{type:'error',source:'admin-question-delete'})}finally{S.adminQuestionDeleteBusy=false;render()}}
function activeAdminQuestionLocator(){const created=activeCreatedQuestionContext();if(created)return{kind:'created',...created};const skill=activeSkillComposerKey();if(S.screen!=='contractActivity'&&!['grammar','listening'].includes(S.screen))return null;let questions=[],current=0;if(S.screen==='contractActivity'){const section=S.learningResources?.package?.content?.[skill];questions=sectionQuestions(skill,section)||[];current=S.activityProgress?.[S.activeActivity?.id]?.current||0}else if(S.screen==='grammar'){questions=getGrammarForTopic()||[];current=S.grammarQuiz?.current||0}else{questions=S.listeningData?.questions||[];current=Math.max(0,Number(S.listeningStep)||0)}const question=questions[current],locator=findAdminContentLocator(question);return locator?{...locator,question}:null}

async function ownerAIDeleteConversation(id){if(!await appConfirm('این گفتگو و تمام پیام‌های آن حذف شود؟'))return;const c=ownerAIState();try{await apiRequest('/owner-ai/conversations/'+encodeURIComponent(id),{method:'DELETE'});c.conversations=c.conversations.filter(x=>x.id!==id);if(c.activeId===id){c.activeId=c.conversations[0]?.id||null;c.messages=[];if(c.activeId)await ownerAILoadConversation(c.activeId,false)}render()}catch(error){c.error=error.message||'حذف گفتگو انجام نشد';render()}}
async function ownerAIChangeProvider(providerId){const c=ownerAIState(),active=c.conversations.find(x=>x.id===c.activeId);if(!active||c.sending)return;const previous=active.provider_preference||'';active.provider_preference=providerId||null;render();try{const updated=await apiRequest('/owner-ai/conversations/'+encodeURIComponent(active.id)+'/provider',{method:'PATCH',body:JSON.stringify({provider_id:providerId||null})});Object.assign(active,updated)}catch(error){active.provider_preference=previous||null;c.error=error.message||'تغییر API انجام نشد'}render()}

async function ownerAISaveProvider(event){event.preventDefault();const c=ownerAIState(),edit=c.editingProvider||{},payload={name:$('#ownerAIProviderName').value.trim(),model:$('#ownerAIProviderModel').value.trim(),base_url:$('#ownerAIProviderUrl').value.trim()},key=$('#ownerAIProviderKey').value.trim();if(key)payload.api_key=key;try{if(edit.id)await apiRequest('/owner-ai/providers/'+encodeURIComponent(edit.id),{method:'PATCH',body:JSON.stringify(payload)});else await apiRequest('/owner-ai/providers',{method:'POST',body:JSON.stringify({...payload,api_key:key})});await ownerAILoadProviders();c.editingProvider=null;c.notice=uiTerm('API با موفقیت ذخیره شد.','API key saved.','API-Schlüssel gespeichert.')}catch(error){c.notice=error.message||uiTerm('ثبت API انجام نشد','Saving the API failed','Speichern der API fehlgeschlagen')}render()}

async function ownerAISend(){const c=ownerAIState(),input=$('#ownerAIInput'),content=input?.value.trim();if(!content||c.sending||c.loading)return;if(!c.activeId){await ownerAINewConversation();if(!c.activeId)return}const requestId=c.retryRequestId||ownerAIClientMessageId(),pendingId='pending-'+requestId;c.retryRequestId=null;c.sending=true;c.error='';c.messages=[...c.messages,{id:pendingId,role:'user',content,requestId}];input.value='';render();ownerAIScrollBottom();try{const data=await ownerAIRequest('/owner-ai/conversations/'+encodeURIComponent(c.activeId)+'/messages',{method:'POST',body:JSON.stringify({content,client_message_id:requestId})},120000);c.messages=c.messages.filter(x=>x.id!==pendingId);ownerAIRemoveFailedText(c.activeId,content);c.messages.push(data.user_message,data.assistant_message);const updated=data.conversation;c.conversations=[updated,...c.conversations.filter(x=>x.id!==updated.id)];if(data.pending_action){render();ownerAIScrollBottom();const approved=await appConfirm(uiTerm('دستیار می‌خواهد عملیات زیر را انجام دهد:','The assistant wants to run the following action:','Der Assistent möchte die folgende Aktion ausführen:')+'\n\n'+data.pending_action.summary+'\n\n'+uiTerm('آیا اجرا شود؟','Run it?','Ausführen?'));if(approved){const executed=await ownerAIRequest('/owner-ai/conversations/'+encodeURIComponent(c.activeId)+'/actions/confirm',{method:'POST',body:JSON.stringify({token:data.pending_action.token})},30000);c.messages.push(executed.assistant_message)}else c.messages.push({id:'cancelled-'+Date.now(),role:'assistant',content:'عملیات با تصمیم شما لغو شد.',provider:'Amookht Agent',model:'approval-gate'})}}catch(error){const failed={id:'failed-'+requestId,role:'user',content,requestId,failed:true,error:error.message||'ارسال انجام نشد'};c.messages=c.messages.map(x=>x.id===pendingId?failed:x);ownerAIStoreFailed(c.activeId,failed);c.error=''}finally{c.sending=false;render();ownerAIScrollBottom()}}
function ownerAIFailedKey(conversationId){return'owner_ai_failed_'+String(S.currentUser||'owner').toLowerCase()+'_'+conversationId}
function ownerAIFailedMessages(conversationId){try{const items=JSON.parse(localStorage.getItem(ownerAIFailedKey(conversationId))||'[]');return Array.isArray(items)?items.filter(x=>x&&x.failed&&x.content).slice(-20):[]}catch{return[]}}
function ownerAIStoreFailed(conversationId,message){const items=ownerAIFailedMessages(conversationId);if(!items.some(x=>x.id===message.id))items.push(message);localStorage.setItem(ownerAIFailedKey(conversationId),JSON.stringify(items.slice(-20)))}
function ownerAIRemoveFailedText(conversationId,content){const items=ownerAIFailedMessages(conversationId).filter(x=>x.content!==content);if(items.length)localStorage.setItem(ownerAIFailedKey(conversationId),JSON.stringify(items));else localStorage.removeItem(ownerAIFailedKey(conversationId))}
function ownerAIRetryFailed(id){const c=ownerAIState(),message=c.messages.find(x=>x.id===id&&x.failed);if(!message||c.sending)return;c.messages=c.messages.filter(x=>x.id!==id);ownerAIRemoveFailedText(c.activeId,message.content);c.retryRequestId=message.requestId||ownerAIClientMessageId();render();const input=$('#ownerAIInput');if(!input)return;input.value=message.content;ownerAISend()}
function ownerAIDecorateFailed(){const c=ownerAIState(),bubbles=[...document.querySelectorAll('#ownerAIMessages .owner-ai-bubble')];c.messages.forEach((message,index)=>{if(!message.failed||!bubbles[index])return;const bubble=bubbles[index];bubble.classList.add('owner-ai-failed');if(bubble.querySelector('.owner-ai-retry'))return;const label=document.createElement('small');label.className='owner-ai-failed-label';label.textContent='ارسال نشد · برای تلاش دوباره فلش را بزنید';const button=document.createElement('button');button.type='button';button.className='owner-ai-retry';button.title='تلاش دوباره';button.setAttribute('aria-label','تلاش دوباره برای ارسال پیام');button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>';button.addEventListener('click',()=>ownerAIRetryFailed(message.id));bubble.append(label,button)})}

const BUILTIN_TESTDAF_EXAM_ID='builtin-testdaf-1';
function testdafExamLibraryEntries(){const builtin={id:BUILTIN_TESTDAF_EXAM_ID,title:'TestDaF Modellprüfung 1',description:'Vollständige TestDaF-Simulation mit 40 Leseaufgaben, 35 Höraufgaben, Schreiben und 7 Sprechaufgaben.',builtin:true,created_at:'2026-07-28',data:AMOOKHT_TESTDAF_SIM_DATA};return[builtin,...(S.testdafExamLibraryRemote||[]).filter(exam=>exam?.id&&exam.id!==BUILTIN_TESTDAF_EXAM_ID&&exam.data)]}
function selectedTestdafExam(){const entries=testdafExamLibraryEntries();return entries.find(exam=>exam.id===S.selectedTestdafExamId)||entries[0]}
async function loadGlobalTestdafExams(){if(!hasPremiumAccess()){S.testdafExamLibraryRemote=[];S.testdafExamLibraryLoaded=true;S.testdafExamMessage='';return[]}try{const payload=await apiRequest('/testdaf-exams',{},false);S.testdafExamLibraryRemote=Array.isArray(payload?.exams)?payload.exams:[];S.testdafExamLibraryLoaded=true;S.testdafExamMessage=''}catch(error){console.warn('TestDaF exam library unavailable:',error);S.testdafExamLibraryRemote=S.testdafExamLibraryRemote||[];S.testdafExamLibraryLoaded=true;S.testdafExamMessage='Die öffentliche Prüfungsliste konnte nicht aktualisiert werden.'}return S.testdafExamLibraryRemote}
function validateTestdafExamData(data){if(!data||typeof data!=='object')throw new Error('Die Prüfungsdaten fehlen.');for(const section of['lesen','hoeren','schreiben','sprechen'])if(!data[section]||typeof data[section]!=='object')throw new Error(`Bereich ${section} fehlt.`);const lesenTexts=data.lesen.texts,hoerenTexts=data.hoeren.texts,sprechenTasks=data.sprechen.tasks;if(!Array.isArray(lesenTexts)||lesenTexts.length!==4)throw new Error('Lesen benötigt genau 4 Texte.');const lesenQuestions=lesenTexts.reduce((sum,item)=>sum+(Array.isArray(item?.questions)?item.questions.length:0),0);if(lesenQuestions!==40)throw new Error(`Lesen benötigt genau 40 Fragen; gefunden: ${lesenQuestions}.`);if(!Array.isArray(hoerenTexts)||hoerenTexts.length!==4)throw new Error('Hören benötigt genau 4 Texte.');const hoerenQuestions=hoerenTexts.reduce((sum,item)=>sum+(Array.isArray(item?.questions)?item.questions.length:0),0);if(hoerenQuestions!==35)throw new Error(`Hören benötigt genau 35 Fragen; gefunden: ${hoerenQuestions}.`);if(!Array.isArray(data.schreiben.chart)||data.schreiben.chart.length<3||Number(data.schreiben.min)!==350||Number(data.schreiben.max)!==400)throw new Error('Schreiben benötigt eine Grafik und den Wortbereich 350–400.');if(!Array.isArray(sprechenTasks)||sprechenTasks.length!==7)throw new Error('Sprechen benötigt genau 7 Aufgaben.');return{lesenQuestions,hoerenQuestions,sprechenTasks:sprechenTasks.length}}
function parseTestdafExamFile(raw){const source=String(raw||'').replace(/^\uFEFF/,'').trim();let payload=null;try{payload=JSON.parse(source)}catch{const match=source.match(/^(?:const|let|var)\s+(?:AMOOKHT_TESTDAF_EXAM|AMOOKHT_TESTDAF_SIM_DATA)\s*=\s*([\s\S]*?);?\s*$/);if(!match)throw new Error('Nur JSON oder eine von Amookht exportierte testdaf-simulation-data.js ist erlaubt.');try{payload=JSON.parse(match[1].trim())}catch{throw new Error('Die JS-Datei enthält kein gültiges exportiertes JSON. Bitte zuerst die Amookht-Vorlage herunterladen.')}}const meta=payload?.meta||{},data=payload?.data||payload?.exam?.data||payload;const stats=validateTestdafExamData(data);return{meta,data,stats}}
async function handleTestdafExamFile(input){const file=input?.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw new Error('Die Datei darf höchstens 5 MB groß sein.');const parsed=parseTestdafExamFile(await file.text()),fallback=file.name.replace(/\.(?:json|js)$/i,'').replace(/[-_]+/g,' ');S.testdafExamImport={id:parsed.meta.id||'',title:parsed.meta.title||fallback||'Neue TestDaF-Prüfung',description:parsed.meta.description||'',source_filename:file.name,data:parsed.data,stats:parsed.stats};S.testdafExamMessage='Datei geprüft: 40 Lesen · 35 Hören · 1 Schreiben · 7 Sprechen.'}catch(error){S.testdafExamImport=null;S.testdafExamMessage='Importfehler: '+error.message}finally{input.value=''}render()}

function downloadTestdafExam(examId=BUILTIN_TESTDAF_EXAM_ID){if(!isGlobalContentAdmin())return;const exam=testdafExamLibraryEntries().find(item=>item.id===examId);if(!exam)return;const payload={meta:{id:exam.builtin?'':exam.id,title:exam.title,description:exam.description,format_version:1},data:exam.data},source=`const AMOOKHT_TESTDAF_EXAM=${JSON.stringify(payload,null,2)};\n`,blob=new Blob([source],{type:'text/javascript;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a'),slug=String(exam.title||'testdaf-exam').toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-').replace(/^-|-$/g,'');link.href=url;link.download=`${slug||'testdaf'}-simulation-data.js`;link.click();URL.revokeObjectURL(url)}
async function saveImportedTestdafExam(){const draft=S.testdafExamImport;if(!draft)return;draft.title=String(draft.title||'').trim();if(draft.title.length<3){S.testdafExamMessage='Bitte einen Namen mit mindestens 3 Zeichen eingeben.';render();return}try{validateTestdafExamData(draft.data);const result=await apiRequest('/testdaf-exams',{method:'POST',body:JSON.stringify({id:draft.id||null,title:draft.title,description:draft.description||'',source_filename:draft.source_filename||'',data:draft.data})});S.testdafExamImport=null;await loadGlobalTestdafExams();S.testdafExamMessage=`„${result.exam.title}“ wurde für alle Benutzer veröffentlicht.`;render()}catch(error){S.testdafExamMessage='Speichern fehlgeschlagen: '+error.message;render()}}

function normalizeTestdafRuntimeQuestion(question,section,index){if(!question||typeof question!=='object')return null;const options=Array.isArray(question.options)?question.options.map(value=>String(value??'')).filter(Boolean):[],text=String(question.q||question.question||question.prompt||'').trim()||`${section==='lesen'?'Lesen':'Hören'} Frage ${index+1}`;let answer=question.answer??question.c??question.a??'';if(options.length){const optionIndex=options.findIndex(value=>String(value).trim()===String(answer).trim());answer=optionIndex>=0?optionIndex:Number.isInteger(Number(answer))?Math.max(0,Math.min(options.length-1,Number(answer))):0}const type=section==='hoeren'?(options.length>=2?'mc':['gap','summary'].includes(question.type)?question.type:'gap'):(options.length<2&&question.type==='gap'?'gap':'mc');return{...question,q:text,type,options:section==='lesen'&&options.length<2&&type!=='gap'?[options[0]||'Richtig','Falsch']:options,answer}}
function normalizeTestdafRuntimeData(raw){const source=raw&&typeof raw==='object'?raw:{},normalizeParts=section=>{const rows=Array.isArray(source[section]?.texts)?source[section].texts:[];return rows.filter(item=>item&&typeof item==='object').map((item,index)=>{const rawQuestions=Array.isArray(item.questions)?item.questions:(item.question||item.q?[item]:[]),questions=rawQuestions.map((question,qi)=>normalizeTestdafRuntimeQuestion(question,section,qi)).filter(Boolean);return{...item,title:String(item.title||`${section==='lesen'?'Lesetext':'Hörtext'} ${index+1}`),text:String(item.text||item.transcript||item.content||''),kind:String(item.kind||'Aufgabe'),time:Math.max(1,Number(item.time)||10),questions}}).filter(item=>item.questions.length>0)},writing=source.schreiben&&typeof source.schreiben==='object'?{...source.schreiben}:{},rawChart=Array.isArray(writing.chart)?writing.chart:[],chart=rawChart.map((point,index)=>Array.isArray(point)?[String(point[0]??index+1),Math.max(0,Math.min(100,Number(point[1])||0))]:[String(index+1),Math.max(0,Math.min(100,Number(point)||0))]),rawTasks=Array.isArray(source.sprechen?.tasks)?source.sprechen.tasks:[],tasks=rawTasks.filter(task=>task&&typeof task==='object').map((task,index)=>({...task,type:String(task.type||task.level||`Aufgabe ${index+1}`),q:String(task.q||task.question||task.instructions||`Sprechaufgabe ${index+1}`),prep:Math.max(1,Number(task.prep)||30),time:Math.max(1,Number(task.time)||90)}));return{lesen:{texts:normalizeParts('lesen')},hoeren:{texts:normalizeParts('hoeren')},schreiben:{...writing,title:String(writing.title||'Schreiben'),task:String(writing.task||writing.question||''),chartTitle:String(writing.chartTitle||'Grafik'),chart:chart.length?chart:[['1',0],['2',0],['3',0]],min:Number(writing.min)||350,max:Number(writing.max)||400,time:Math.max(1,Number(writing.time)||60)},sprechen:{tasks}}}

function simTotalItems(id,data=testdafSimData()){if(id==='lesen'||id==='hoeren')return data[id].texts.reduce((sum,part)=>sum+part.questions.length,0);if(id==='schreiben')return 1;if(id==='sprechen')return data.sprechen.tasks.length;return 0}

function simQuestionCorrect(question,value){if(question.type==='mc')return Number(value)===Number(question.answer);const actual=normalizeSimAnswer(value);return String(question.answer||'').split('|').some(answer=>normalizeSimAnswer(answer)===actual)}
function simAutoStats(id,data=testdafSimData()){let correct=0,total=0;if(id!=='lesen'&&id!=='hoeren')return{correct,total};data[id].texts.forEach((part,pi)=>part.questions.forEach((q,qi)=>{if(q.type==='summary')return;total++;if(simQuestionCorrect(q,ensureTestdafSimState().answers[id]?.[`${pi}-${qi}`]))correct++}));return{correct,total}}
function simWordCount(value){return String(value||'').trim()?String(value).trim().split(/\s+/).length:0}
function simWritingAnswer(value){ensureTestdafSimState().answers.schreiben=value;const count=simWordCount(value),counter=$('#simWritingCount');if(counter){counter.textContent=`${count} Wörter`;counter.className=`font-bold ${count>=350&&count<=400?'text-emerald-500':'text-amber-500'}`}saveData()}
async function finishTestDaFSimSection(id){const sim=ensureTestdafSimState(),data=testdafSimData(),answered=simAnsweredCount(id,data),total=simTotalItems(id,data);if(id==='sprechen'&&S.speakingRecorder?.state==='recording'){showGlassAlarm('Bitte stoppen Sie zuerst die laufende Aufnahme.',{type:'warning',source:'simulation-recording'});render();return}if(id==='schreiben'&&!Array.isArray(data.schreiben.tasks)){const words=simWordCount(sim.answers.schreiben);if(words<350||words>400){showGlassAlarm(`Der Text muss 350–400 Wörter enthalten. Aktuell: ${words}.`,{type:'warning',source:'simulation-writing'});render();return}}if(answered<total&&!await appConfirm(`${total-answered} Aufgabe(n) sind noch unbeantwortet. Abschnitt trotzdem abgeben?`))return;if(S.testdafSimTimer){clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}sim.done[id]=true;sim.active='overview';delete sim.sectionStarts[id];if(['lesen','hoeren','schreiben','sprechen'].every(key=>sim.done[key])){sim.finished=true;sim.finishedAt=sim.finishedAt||new Date().toISOString();rememberTestdafExamVisit(sim.examId,true)}else rememberTestdafExamVisit(sim.examId,false);S.testdafExamStates[sim.examId]=sim;saveData();render()}
function simAnswer(section,key,value){const sim=ensureTestdafSimState();sim.answers[section]=sim.answers[section]||{};sim.answers[section][key]=value;saveData();const data=testdafSimData(),counter=$('#simAnswered');if(counter)counter.textContent=`${simAnsweredCount(section,data)}/${simTotalItems(section,data)}`}
function simRemaining(section){const sim=ensureTestdafSimState(),started=sim.sectionStarts[section]||Date.now(),limit=(simMeta(section)?.minutes||0)*60,elapsed=Math.floor((Date.now()-started)/1000);return Math.max(0,limit-elapsed)}
function playSimHoeren(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}catch(e){console.warn('speech synthesis unavailable',e)}}

ck="openTestDaFSimSection('${id}')" class="text-left p-6 rounded-3xl border ${done[id]?'border-emerald-300 bg-emerald-50 dark:bg-emerald-900/20':'border-transparent '+(S.dark?'bg-gray-800':'bg-white')} shadow hover:-translate-y-1 transition"><div class="flex justify-between gap-3"><div><h2 class="text-2xl font-black">${simMeta(id).label}</h2><p class="mt-2 text-sm text-gray-500">${simMeta(id).desc}</p></div><span class="text-sm font-bold ${done[id]?'text-emerald-600':'text-indigo-600'}">${done[id]?'Done':simAnsweredCount(id,data)?'Weiter':'Start'}</span></div><div class="mt-5 flex flex-wrap gap-2 text-xs"><span class="px-2 py-1 rounded bg-indigo-100 text-indigo-700">${simMeta(id).minutes} min</span><span class="px-2 py-1 rounded bg-slate-100 text-slate-600">${simMeta(id).parts} Teile</span><span class="px-2 py-1 rounded bg-cyan-100 text-cyan-700">${simAnsweredCount(id,data)}/${simTotalItems(id,data)} beantwortet</span></div></button>`).join('')}</section></main></div>`;
}
function renderTestDaFSimSection(id,content){const meta=simMeta(id),remaining=simRemaining(id),data=testdafSimData();if(S.testdafSimTimer)clearInterval(S.testdafSimTimer);S.testdafSimTimer=setInterval(()=>{if(S.screen==='testdafSim'&&ensureTestdafSimState().active===id){const e=$('#simTimer');if(e)e.textContent=timeStr(simRemaining(id))}else{clearInterval(S.testdafSimTimer);S.testdafSimTimer=null}},1000);return`<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gray-50 text-gray-900'} pb-28"><main class="max-w-5xl mx-auto p-4 pt-6"><header class="sticky top-0 z-30 flex items-center justify-between gap-2 mb-4 p-3 rounded-2xl ${S.dark?'bg-gray-900/95':'bg-gray-50/95'} backdrop-blur"><button onclick="pauseTestDaFSimSection()" class="px-3 py-2 rounded-xl ${S.dark?'bg-gray-800':'bg-white'} shadow">Übersicht</button><div class="text-center"><h1 class="font-black text-lg">${meta.label}</h1><div class="flex items-center justify-center gap-2 text-xs"><span id="simTimer" class="font-mono text-indigo-500">${timeStr(remaining)}</span><span class="text-gray-400">·</span><span id="simAnswered" class="font-bold">${simAnsweredCount(id,data)}/${simTotalItems(id,data)}</span></div></div><button onclick="finishTestDaFSimSection('${id}')" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">Abgeben</button></header>${id==='lesen'?renderSimLesen(content):id==='hoeren'?renderSimHoeren(content):id==='schreiben'?renderSimSchreiben(content):renderSimSprechen(content)}</main></div>`}
function renderSimLesen(content){let globalNo=0;return`<div class="space-y-5">${content.texts.map((part,pi)=>`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-indigo-500 font-bold">Text ${pi+1} · ${part.questions.length} Aufgaben</p><h2 class="font-black text-xl mt-1">${safeText(part.title)}</h2></div><span class="text-xs text-gray-500">${part.time} min</span></div><article data-learning-content class="mt-4 leading-8 whitespace-pre-line ${S.dark?'text-gray-200':'text-gray-700'}">${safeText(part.text)}</article><div class="mt-5 space-y-4">${part.questions.map((q,qi)=>{const key=`${pi}-${qi}`,val=ensureTestdafSimState().answers?.lesen?.[key],number=++globalNo;return`<div class="favorite-anchor p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}">${favoriteButton({kind:'reading',skill:'lesen',sourceId:'sim-reading-'+key,title:q.q,subtitle:part.title||'TestDaF Lesen',answer:q.options?.[Number(q.answer)]||q.options?.[q.c]||q.a||'',context:part.text||'',source:'testdaf-exam'},'favorite-overlay')}<b class="block pr-16">${number}. ${safeText(q.q)}</b><div class="mt-3 grid gap-2">${q.options.map((opt,oi)=>`<label class="flex gap-2 items-start text-sm p-2 rounded-xl hover:bg-indigo-50 dark:hover:bg-gray-800"><input type="radio" name="sim-l-${key}" class="mt-1" ${String(val)===String(oi)?'checked':''} onchange="simAnswer('lesen','${key}',${oi})"><span>${safeText(opt)}</span></label>`).join('')}</div></div>`}).join('')}</div></section>`).join('')}</div>`}
function renderSimHoerenQuestion(q,key,number){const val=ensureTestdafSimState().answers?.hoeren?.[key],typeLabel=q.type==='mc'?'Mehrfachauswahl':q.type==='gap'?'Lücke':'Zusammenfassung';return`<div class="favorite-anchor mt-4 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}">${favoriteButton({kind:'listening',skill:'hoeren',sourceId:'sim-listening-'+key,title:q.q,subtitle:typeLabel,answer:q.options?.[Number(q.answer)]||q.options?.[q.c]||q.a||q.answer||'',source:'testdaf-exam'},'favorite-overlay')}<div class="flex items-start gap-2 pr-16"><span class="shrink-0 px-2 py-1 rounded-lg bg-purple-100 text-purple-700 text-[10px] font-bold">${typeLabel}</span><b>${number}. ${safeText(q.q)}</b></div>${q.type==='mc'?`<div class="mt-3 grid gap-2">${q.options.map((opt,oi)=>`<label class="flex gap-2 items-start text-sm p-2 rounded-xl hover:bg-purple-50 dark:hover:bg-gray-800"><input type="radio" name="sim-h-${key}" class="mt-1" ${String(val)===String(oi)?'checked':''} onchange="simAnswer('hoeren','${key}',${oi})"><span>${safeText(opt)}</span></label>`).join('')}</div>`:q.type==='gap'?`<input value="${safeText(val||'')}" oninput="simAnswer('hoeren','${key}',this.value)" class="mt-3 w-full px-4 py-3 rounded-xl border ${S.dark?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}" placeholder="Kurze Antwort …">`:`<textarea oninput="simAnswer('hoeren','${key}',this.value)" class="mt-3 w-full h-28 p-3 rounded-xl border ${S.dark?'bg-gray-800 border-gray-700':'bg-white border-gray-200'}" placeholder="1–2 Sätze …">${safeText(val||'')}</textarea>`}</div>`}
function renderSimHoeren(content){let globalNo=0;return`<div class="space-y-5">${content.texts.map((part,pi)=>`<section class="p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><div class="flex flex-wrap justify-between gap-3"><div><p class="text-xs text-purple-500 font-bold">Audio ${pi+1} · ${safeText(part.kind)} · ${part.questions.length} Aufgaben</p><h2 class="font-black text-xl mt-1">${safeText(part.title)}</h2></div><span class="text-xs text-gray-500">${part.time} min</span></div><div class="mt-4 flex flex-wrap gap-2"><button type="button" onclick="window.playSimHoerenAt?playSimHoerenAt(${pi}):playSimHoeren(testdafSimData().hoeren.texts[${pi}].text)" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-sm">Audio abspielen</button><button type="button" onclick="stopSimHoeren()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-gray-700 text-sm font-bold">Stoppen</button></div><details class="mt-4 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><summary class="font-bold cursor-pointer">Transkript erst nach dem Hören kontrollieren</summary><p data-learning-content class="mt-3 leading-8 whitespace-pre-line">${safeText(part.text)}</p></details>${part.questions.map((q,qi)=>renderSimHoerenQuestion(q,`${pi}-${qi}`,++globalNo)).join('')}</section>`).join('')}</div>`}
function renderSimSchreiben(content){const val=ensureTestdafSimState().answers?.schreiben||'',count=simWordCount(val);return`<section class="favorite-anchor p-5 rounded-3xl ${S.dark?'bg-gray-800':'bg-white'} shadow">${favoriteButton({kind:'writing',skill:'schreiben',sourceId:content.id||content.title,title:content.task||content.title,subtitle:content.title||'TestDaF Schreiben',context:content.chartTitle||'',source:'testdaf-exam'},'favorite-overlay')}<div class="flex flex-wrap justify-between gap-3 pr-16"><div><p class="text-xs text-amber-500 font-bold">Grafikbeschreibung · Argumentation</p><h2 class="text-2xl font-black">${safeText(content.title)}</h2></div><span class="text-xs text-gray-500">${content.time} min</span></div><p class="mt-3 leading-7">${safeText(content.task)}</p><div class="mt-5 p-4 rounded-2xl ${S.dark?'bg-gray-900':'bg-gray-50'}"><b>${safeText(content.chartTitle)}</b><div class="mt-4 grid grid-cols-5 gap-2">${content.chart.map(([y,v])=>`<div class="text-center"><div class="h-36 flex items-end justify-center"><span class="w-8 md:w-10 rounded-t bg-gradient-to-t from-indigo-600 to-cyan-400" style="height:${v}%"></span></div><small>${y}</small><b class="block">${v}%</b></div>`).join('')}</div></div><textarea oninput="simWritingAnswer(this.value)" class="mt-5 w-full min-h-[420px] p-4 rounded-2xl border ${S.dark?'bg-gray-900 border-gray-700':'bg-gray-50 border-gray-200'}" placeholder="Schreiben Sie hier 350–400 Wörter …">${safeText(val)}</textarea><div class="mt-2 flex justify-between text-xs"><span>Grafik beschreiben · Ursachen erklären · Position begründen</span><span id="simWritingCount" class="font-bold ${count>=350&&count<=400?'text-emerald-500':'text-amber-500'}">${count} Wörter</span></div></section>`}
async function startSimSpeakingRecording(index){const sim=ensureTestdafSimState(),task=testdafSimData().sprechen.tasks[index];if(!task||!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){S.simSpeakingStatus='unsupported';render();return}try{if(S.speakingRecorder?.state==='recording')return;const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});S.speakingStream=stream;S.speakingChunks=[];const preferred=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'].find(type=>MediaRecorder.isTypeSupported(type)),recorder=preferred?new MediaRecorder(stream,{mimeType:preferred}):new MediaRecorder(stream);S.speakingRecorder=recorder;S.simSpeakingTask=index;recorder.ondataavailable=e=>{if(e.data?.size)S.speakingChunks.push(e.data)};recorder.onstop=async()=>{const mime=(recorder.mimeType||'audio/webm').split(';')[0],blob=new Blob(S.speakingChunks,{type:mime});stopSpeakingStream();await uploadSimSpeakingRecording(blob,mime,index)};recorder.start(250);S.simSpeakingStatus='recording';sim.recordingStartedAt=Date.now();if(S.speakingRecordingInterval)clearInterval(S.speakingRecordingInterval);S.speakingRecordingInterval=setInterval(()=>{const elapsed=Math.floor((Date.now()-sim.recordingStartedAt)/1000),el=$(`#simSpeakingTime-${index}`);if(el)el.textContent=timeStr(elapsed);if(elapsed>=Math.min(600,task.time))stopSimSpeakingRecording()},500);render()}catch(error){console.warn(error);S.simSpeakingStatus='denied';render()}}
function stopSimSpeakingRecording(){if(S.speakingRecorder?.state==='recording'){S.simSpeakingStatus='uploading';if(S.simSpeakingStopTimeout)clearTimeout(S.simSpeakingStopTimeout);S.speakingRecorder.stop();render()}}
async function uploadSimSpeakingRecording(blob,mime,index){const sim=ensureTestdafSimState();try{const form=new FormData();form.append('plan_id',`testdaf-simulation-${S.selectedTestdafExamId||BUILTIN_TESTDAF_EXAM_ID}`);form.append('task_id',`testdaf-sim-${index+1}`);form.append('audio',blob,`testdaf-sim-${index+1}.${mime.includes('ogg')?'ogg':mime.includes('mp4')?'m4a':'webm'}`);const saved=await apiRequest('/speaking/recordings',{method:'POST',body:form});sim.recordings[index]={...saved,savedAt:new Date().toISOString()};sim.answers.sprechen[index]=`Audioaufnahme gespeichert: ${saved.id}`;S.recordingDate=today();S.simSpeakingStatus='saved'}catch(error){console.warn(error);const localUrl=URL.createObjectURL(blob);sim.recordings[index]={playback_url:localUrl,local:true,savedAt:new Date().toISOString()};sim.answers.sprechen[index]='Audioaufnahme lokal verfügbar';S.simSpeakingStatus='local-saved'}saveData();render()}
function simRecordingPlayback(recording){if(!recording?.playback_url)return'';if(recording.local)return recording.playback_url;const query=recording.playback_token?`?user_id=${encodeURIComponent(S.accountId||S.currentUser)}&token=${encodeURIComponent(recording.playback_token)}`:'';return`${APP_API_BASE.replace(/\/v1$/,'')}${recording.playback_url}${query}`}
async function playAuthenticatedRecording(button,playbackUrl){if(!playbackUrl||button?.disabled)return;const original=button?.textContent||'';if(button){button.disabled=true;button.textContent='...'}try{const tokens=authTokens(),response=await fetch(`${APP_API_BASE.replace(/\/v1$/,'')}${playbackUrl}`,{headers:tokens?.access_token?{Authorization:`Bearer ${tokens.access_token}`}:{}});if(!response.ok)throw new Error(`Audio load failed: ${response.status}`);const objectUrl=URL.createObjectURL(await response.blob()),audio=new Audio(objectUrl);audio.addEventListener('ended',()=>URL.revokeObjectURL(objectUrl),{once:true});audio.addEventListener('error',()=>URL.revokeObjectURL(objectUrl),{once:true});await audio.play()}catch(error){console.warn(error);showGlassAlarm(S.uiLanguage==='fa'?'پخش فایل صوتی انجام نشد.':S.uiLanguage==='en'?'The recording could not be played.':'Die Aufnahme konnte nicht abgespielt werden.',{type:'error',source:'recording-playback'})}finally{if(button){button.disabled=false;button.textContent=original}}}

function answerListening(i){

function nextListeningQ(){

}

async function finishListening(){
  S.listeningDone=true;S.activityProgress.listening.done=true;
  stopTimers();

  // Calculate score locally first
  const h=S.listeningData;
  let correct=0;
  h.questions.forEach((q,i)=>{if(S.listeningAnswers[i]===q.c)correct++;else rememberLearningError({type:'hoeren',category:'listening',question:q.q||'',userAnswer:S.listeningAnswers[i]!==undefined?q.o?.[S.listeningAnswers[i]]:'Keine Antwort',correctAnswer:q.o?.[q.c]||'',explanation:q.ex||'',context:h.text||'',source:'hoeren',sourceKey:`${S.plan?.id||today()}:hoeren:${i}`})});
  const localScore={score:correct,total:h.questions.length,feedback:''};

  S.listeningGrading=localScore;render();
}

// GESAMTTEST (آزمون جامع)

function generateGesamttest(){
  const vocabTerm=(fa,en,de)=>S.uiLanguage==='fa'?fa:S.uiLanguage==='en'?en:de,vocab=getVocabForTopic().sort(()=>Math.random()-.5).slice(0,3).map(v=>({type:'vocab',q:v.w,options:[v.t,vocabTerm('ترجمه دیگر','Other translation','Andere Übersetzung'),vocabTerm('معنی نادرست','Wrong meaning','Falsche Bedeutung'),vocabTerm('بدون معنی','No meaning','Ohne Bedeutung')],c:0,ex:v.ex}));
  const grammar=getGrammarForTopic().sort(()=>Math.random()-.5).slice(0,3).map(g=>({type:'grammar',...g}));
  const listen=getHoerenForTopic();
  const listenQ=listen.questions.slice(0,2).map(lq=>({type:'listening',...lq}));
  return[...vocab,...grammar,...listenQ].sort(()=>Math.random()-.5);
}

function renderGesamttest(){
  const g=S.gesamttest;
  if(g.done){
    const pts=S.activityPoints.gesamttest||0;
    const totalQ=g.sections.length;
    return`<div class="min-h-screen ${S.dark?'bg-gray-900':'bg-gray-50'} flex items-center justify-center p-4"><div class="favorite-anchor slide-up ${S.dark?'bg-gray-800':'bg-white'} rounded-3xl shadow-xl p-8 max-w-md w-full text-center">

      <h2 class="text-2xl font-bold ${S.dark?'text-white':'text-gray-900'}">${g.score}/${totalQ} ${uiTerm('درست','correct','richtig')}</h2>
      <p class="text-sm ${S.dark?'text-gray-400':'text-gray-500'} mt-2">Gesamttest abgeschlossen!</p>
      
      <button onclick="completeActivity('gesamttest')" class="mt-6 w-full py-3 rounded-xl font-semibold text-white bg-gradient-to-r from-indigo-500 to-purple-500 transition shadow-lg">${t('practice.finishSection')}</button>
    </div></div>`;
  }
  const q=g.sections[g.current];
  const ans=g.answers[g.current]||null;
  const totalQ=g.sections.length;
  const el=S.activityTimers.gesamttest||0;

pp appearance settings','Einstellungen der App-Oberfläche')}</p></div></div><div class="pref-toggles"><label><span><b>${L('حالت تاریک','Dark mode','Dunkelmodus')}</b><small>${L('نمای تیره برای محیط کم‌نور','Dark appearance for low light','Dunkle Ansicht für wenig Licht')}</small></span><input type="checkbox" ${S.dark?'checked':''} onchange="toggleDark(this.checked)"></label><label><span><b>${L('افکت شیشه‌ای','Glass effect','Glaseffekt')}</b><small>${L('شفافیت و محوشدگی پنل‌ها','Panel transparency and blur','Transparenz und Unschärfe der Bereiche')}</small></span><input type="checkbox" ${p.glass!==false?'checked':''} onchange="setAppSetting('glass',this.checked)"></label><label><span><b>${L('کنتراست بیشتر','Higher contrast','Mehr Kontrast')}</b><small>${L('مرزبندی واضح‌تر عناصر','Clearer element borders','Deutlichere Umrandungen')}</small></span><input type="checkbox" ${p.highContrast?'checked':''} onchange="setAppSetting('highContrast',this.checked)"></label><label><span><b>${L('کاهش حرکت','Reduce motion','Bewegung reduzieren')}</b><small>${L('خاموش‌کردن انیمیشن‌های رابط','Turn off interface animations','Animationen der Oberfläche ausschalten')}</small></span><input type="checkbox" ${S.user.reducedMotion?'checked':''} onchange="S.user.reducedMotion=this.checked;document.documentElement.classList.toggle('reduce-motion',this.checked);saveData();render()"></label><label><span><b>${L('یادآوری روزانه','Daily reminder','Tägliche Erinnerung')}</b><small>${L('ذخیره ترجیح اعلان‌های برنامه','Save the app notification preference','Benachrichtigungseinstellung speichern')}</small></span><input type="checkbox" ${S.user.notifications!==false?'checked':''} onchange="S.user.notifications=this.checked;saveData();render()"></label><label><span><b>${L('سایدبار فشرده','Compact sidebar','Kompakte Seitenleiste')}</b><small>${L('فضای بیشتر برای محتوای اصلی','More space for main content','Mehr Platz für Hauptinhalte')}</small></span><input type="checkbox" ${p.sidebarCompact?'checked':''} o atarFile(this)"></label>${S.user.avatarDataUrl?`<button type="button" onclick="removeAvatar()" class="px-3 py-2 rounded-xl bg-red-100 text-red-600 text-xs font-bold">Remove photo</button>`:''}</div></div></div><div class="grid sm:grid-cols-2 gap-3"><label class="text-sm">نام<input id="setName" value="${safeText(S.user.name)}" class="mt-1 w-full px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></label><label class="text-sm">ایمیل<input value="${safeText(S.currentUser)}" disabled class="mt-1 w-full px-3 py-2.5 rounded-xl border opacity-60 ${S.dark?'bg-gray-700 border-gray-600':'bg-gray-100 border-gray-200'}"></label><label class="text-sm">زبان مادری<select id="setLanguage" class="mt-1 w-full px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}">${[['fa','فارسی'],['de','Deutsch'],['en','English'],['other','سایر']].map(([v,l])=>`<option value="${v}" ${S.user.nativeLanguage===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="text-sm">منطقه زمانی<input id="setTimezone" value="${safeText(S.user.timezone||'')}" class="mt-1 w-full px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></label></div></section><section class="p-5 rounded-2xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><h2 class="font-bold mb-4">تنظیمات یادگیری</h2><div class="grid sm:grid-cols-2 gap-3"><label class="text-sm">سطح<select id="setLevel" class="mt-1 w-full px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}">${LEVELS.map(l=>`<option value="${l.id}" ${(S.appSettings?.levelNext||S.user.level)===l.id?'selected':''}>${l.l} — ${l.d}</option>`).join('')}</select>${amkLevelNote()}</label><label class="text-sm">زمان روزانه<input id="setMinutes" type="number" min="60" max="720" value="${Math.max(60,Math.min(720,Number(S.user.dailyMinutes)||60))}" class="mt-1 w-full px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></label><label class="text-sm sm:col-span-2">هدف اصلی<input id="setGoal" value="${safeText(S.user.learningGoal||'')}" class="mt-1 w-full px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></label><label class="text-sm">تاریخ آزمون یا هدف<input id="setExamDate" type="date" min="${futureDateMin()}" value="${isFutureDate(S.user.examDate)?safeText(S.user.examDate):''}" class="mt-1 w-full px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></label></div><button onclick="saveAccountSettings()" class="mt-4 w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold">ذخیره تغییرات</button></section><section class="hidden p-5 rounded-2xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><h2 class="hidden font-bold mb-4">ظاهر و اعلان‌ها</h2><label class="flex items-center justify-between py-3 border-b ${S.dark?'border-gray-700':'border-gray-100'}"><span><b class="block text-sm">کاهش حرکت</b><small class="text-gray-500">انیمیشن‌های کمتر</small></span><input type="checkbox" ${S.user.reducedMotion?'checked':''} onchange="S.user.reducedMotion=this.checked;document.documentElement.classList.toggle('reduce-motion',this.checked);saveData()" class="w-5 h-5 accent-indigo-600"></label><label class="flex items-center justify-between py-3"><span><b class="block text-sm">یادآوری روزانه</b><small class="text-gray-500">ذخیره ترجیح اعلان</small></span><input type="checkbox" ${S.user.notifications!==false?'checked':''} onchange="S.user.notifications=this.checked;saveData()" class="w-5 h-5 accent-indigo-600"></label></section><section class="p-5 rounded-2xl ${S.dark?'bg-gray-800':'bg-white'} shadow"><h2 class="font-bold mb-4">امنیت</h2><div class="grid sm:grid-cols-2 gap-3"><input id="currentPassword" type="password" placeholder="رمز فعلی" class="px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"><input id="newPassword" type="password" placeholder="رمز جدید — حداقل ۸ کاراکتر" class="px-3 py-2.5 rounded-xl border ${S.dark?'bg-gray-700 border-gray-600':'border-gray-200'}"></div><button onclick="changeAccountPassword()" class="mt-3 px-4 py-2.5 rounded-xl bg-gray-700 text-white text-sm">تغییر رمز</button></section><section class="p-5 rounded-2xl border border-red-200 dark:border-red-900 ${S.dark?'bg-red-950/20':'bg-red-50'}"><h2 class="font-bold text-red-600">حذف حساب کاربری</h2><p class="text-xs text-red-500 mt-1">حذف حساب قابل بازگشت نیست. برای امنیت، باید نام کاربری و عبارت تأیید را بنویسید و کدی را که به ایمیل‌تان فرستاده می‌شود وارد کنید.</p><button onclick="window.AmkAccountDelete&&AmkAccountDelete.open()" class="mt-3 px-4 py-2.5 rounded-xl bg-red-600 text-white">شروع حذف حساب</button></section></main></div>`}
/*LEVEL-PREF*/
function amkLevelMapFs(v){return /A1|A2/.test(v)?'1':/C1|C2/.test(v)?'3':'2'}
function amkTomorrow(){const t=new Date(today()+'T12:00:00');t.setDate(t.getDate()+1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function amkLevelSideEffects(v,now){try{localStorage.setItem('amookht_fs_level',amkLevelMapFs(v))}catch(e){}if(now){try{if((S.user.examPlan||'')==='oesd'){const m=S.oesdMethod||(S.oesdMethod={});m.level=/C1|C2/.test(v)?'C1':'B2';delete m.levelNext;delete m.levelFrom}}catch(e){}if(window.TDM&&typeof TDM.applyLevelChange==='function'){try{TDM.applyLevelChange()}catch(e){console.warn(e)}}}}
window.amkApplyPendingLevel=function(){const a=S.appSettings;if(!a||!a.levelNext||!a.levelFrom||today()<a.levelFrom)return false;const v=a.levelNext;delete a.levelNext;delete a.levelFrom;if(v!==S.user.level){S.user.level=v;amkLevelSideEffects(v,false)}try{saveData()}catch(e){}try{syncProfileToServer()}catch(e){}return true};
function amkSetLevelFromSettings(v){try{window.amkApplyPendingLevel()}catch(e){}const a=S.appSettings||(S.appSettings={}),cur=S.user.level;if(!v)return'';if(v===cur){const had=!!a.levelNext;delete a.levelNext;delete a.levelFrom;if(had&&(S.user.examPlan||'')==='oesd'&&S.oesdMethod){delete S.oesdMethod.levelNext;delete S.oesdMethod.levelFrom}return had?'cancel':''}if(hasPremiumAccess()||!cur){S.user.level=v;delete a.levelNext;delete a.levelFrom;amkLevelSideEffects(v,true);return'now'}a.levelNext=v;a.levelFrom=amkTomorrow();try{if((S.user.examPlan||'')==='oesd'){const m=S.oesdMethod||(S.oesdMethod={}),ol=/C1|C2/.test(v)?'C1':'B2';if(ol!==(m.level||'')){m.levelNext=ol;m.levelFrom=a.levelFrom}}}catch(e){}return'next'}
function amkLevelMsg(r){const a=S.appSettings||{};if(r==='now')return`تغییرات حساب ذخیره شد. سطح شما ${S.user.level} شد و سؤال‌ها و برنامه امروز همین حالا متناسب با سطح جدید از نو ساخته شدند (فعالیت‌های تمام‌شده دست نخوردند).`;if(r==='next')return`تغییرات حساب ذخیره شد. سطح جدید ${a.levelNext} از فردا در سؤال‌ها و برنامه اعمال می‌شود؛ برنامه امروز با سطح ${S.user.level||'—'} می‌ماند. (در اشتراک پرمیوم تغییر سطح همان لحظه اعمال می‌شود.)`;if(r==='cancel')return'تغییرات حساب ذخیره شد. تغییر سطحی که برای فردا ثبت شده بود لغو شد.';return'تغییرات حساب ذخیره شد.'}
function amkLevelNote(){const a=S.appSettings||{},p=!!(a.levelNext&&a.levelFrom&&today()<a.levelFrom),lang=S.uiLanguage==='en'?'en':S.uiLanguage==='de'?'de':'fa';const txt=p?(lang==='fa'?`سطح فعلی ${S.user.level||'—'} است؛ سطح ${a.levelNext} از فردا در سؤال‌ها و برنامه اعمال می‌شود.`:lang==='en'?`Your current level is ${S.user.level||'—'}; level ${a.levelNext} applies to questions and the plan from tomorrow.`:`Dein aktuelles Niveau ist ${S.user.level||'—'}; Niveau ${a.levelNext} gilt ab morgen für Fragen und Plan.`):hasPremiumAccess()?(lang==='fa'?'سؤال‌ها و برنامه با این سطح ساخته می‌شوند؛ با تغییر سطح، برنامه امروز همان لحظه از نو ساخته می‌شود.':lang==='en'?'Questions and the plan are built at this level; changing it rebuilds today’s plan right away.':'Fragen und Plan werden auf diesem Niveau erstellt; eine Änderung baut den heutigen Plan sofort neu.'):(lang==='fa'?'سؤال‌ها و برنامه با این سطح ساخته می‌شوند؛ تغییر سطح از فردا اعمال می‌شود (در پرمیوم: همان لحظه).':lang==='en'?'Questions and the plan are built at this level; a change applies from tomorrow (with Premium: immediately).':'Fragen und Plan werden auf diesem Niveau erstellt; eine Änderung gilt ab morgen (mit Premium: sofort).');return`<small class="amk-level-note block mt-1 text-xs ${p?'text-amber-600':'text-gray-500'}">${safeText(txt)}</small>`}
function amkLevelPool(arr){try{const u=String(S.user.level||'B2'),want=/C1|C2/.test(u)?'C1':'B2',tag=x=>String((x&&(x.level||x.cefr_level||x.diff||x.difficulty||x.lv||x.lvl))||'').toUpperCase(),m=arr.filter(x=>tag(x).includes(want));return m.length?m:arr}catch(e){return arr}}

function freeStudyPersistCheckpoint(){const f=freeStudyState(),dateKey=f.startedDate||today();if(f.mode==='free'||f.mode==='long'){freeStudyCheckpoint();return}if(f.mode==='focus'){if(f.running)freeStudyCheckpoint();const elapsed=Math.max(0,f.duration*60-f.remaining),uncommitted=Math.max(0,elapsed-(Number(f.focusCommitted)||0));if(uncommitted){f.sessions[dateKey]=(Number(f.sessions[dateKey])||0)+uncommitted;freeStudyCommitCategory(uncommitted,dateKey)}f.focusCommitted=elapsed;f.startedDate=today()}}

// Account-scoped, Redis-backed cross-device synchronization for the premium library.
const libraryRealtime={controller:null,token:'',retryTimer:0,retryMs:1000,refreshTimer:0,generation:0};
function libraryRealtimeStop(){libraryRealtime.generation++;libraryRealtime.controller?.abort();libraryRealtime.controller=null;libraryRealtime.token='';clearTimeout(libraryRealtime.retryTimer);clearTimeout(libraryRealtime.refreshTimer)}
function libraryRealtimeScheduleRefresh(event){
  if(S.screen!=='library')return;
  const l=libraryState();
  if(event.item_kind==='document'&&event.action==='annotations'&&l.pdf?.id===event.item_id){
    apiRequest('/library/documents/'+encodeURIComponent(event.item_id)+'/annotations').then(items=>{if(l.pdf?.id!==event.item_id)return;l.pdf.annotations=items;libraryRenderPdfPage()}).catch(error=>console.warn('PDF realtime refresh failed:',error));
    return;
  }
  if(event.item_kind==='note'&&l.editor?.id===event.item_id){
    if(event.action==='deleted'){l.editor=null;l.noteMode=null;l.toast=S.uiLanguage==='fa'?'این یادداشت در دستگاه دیگری حذف شد.':S.uiLanguage==='en'?'This note was deleted on another device.':'Diese Notiz wurde auf einem anderen Gerät gelöscht.';render();return}
    if(l.noteDirty)return;
    clearTimeout(libraryRealtime.refreshTimer);libraryRealtime.refreshTimer=setTimeout(async()=>{try{const data=await apiRequest('/library'+(l.folderId?'?folder_id='+encodeURIComponent(l.folderId):'')),fresh=(data.notes||[]).find(note=>String(note.id)===String(event.item_id));l.data=data;if(fresh&&l.editor?.id===fresh.id){const mode=l.noteMode;l.editor=fresh;l.noteMode=mode;render()}}catch(error){console.warn('Note realtime refresh failed:',error)}},90);
    return;
  }
  if(l.editor?.id&&l.noteDirty)return;
  clearTimeout(libraryRealtime.refreshTimer);libraryRealtime.refreshTimer=setTimeout(()=>{if(S.screen==='library'&&!libraryState().loading)libraryLoad(libraryState().folderId)},120);
}
async function libraryRealtimeConnect(token,generation){
  const controller=new AbortController();libraryRealtime.controller=controller;
  try{
    const response=await fetch(APP_API_BASE+'/library/events',{headers:{Authorization:'Bearer '+token,Accept:'text/event-stream'},signal:controller.signal,cache:'no-store'});
    if(!response.ok)throw new Error('Library realtime HTTP '+response.status);
    libraryRealtime.retryMs=1000;const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
    while(generation===libraryRealtime.generation){const result=await reader.read();if(result.done)break;buffer+=decoder.decode(result.value,{stream:true}).replace(/\r/g,'');let boundary;while((boundary=buffer.indexOf('\n\n'))>=0){const block=buffer.slice(0,boundary);buffer=buffer.slice(boundary+2);const line=block.split('\n').find(value=>value.startsWith('data:'));if(!line)continue;try{const event=JSON.parse(line.slice(5).trim());if(event.item_kind)libraryRealtimeScheduleRefresh(event)}catch(error){console.warn('Invalid library realtime event:',error)}}}
  }catch(error){if(error.name!=='AbortError')console.warn('Library realtime disconnected:',error)}finally{
    if(generation!==libraryRealtime.generation)return;
    libraryRealtime.controller=null;const delay=libraryRealtime.retryMs;libraryRealtime.retryMs=Math.min(10000,Math.round(delay*1.7));libraryRealtime.retryTimer=setTimeout(()=>libraryRealtimeEnsure(true),delay);
  }
}
function libraryRealtimeEnsure(force=false){
  const token=authTokens()?.access_token||'';
  if(!S.currentUser||!token){libraryRealtimeStop();return}
  if(!force&&libraryRealtime.controller&&libraryRealtime.token===token)return;
  libraryRealtime.controller?.abort();clearTimeout(libraryRealtime.retryTimer);libraryRealtime.token=token;const generation=++libraryRealtime.generation;libraryRealtimeConnect(token,generation);
}
window.addEventListener('online',()=>libraryRealtimeEnsure(true));
const renderWithLibraryRealtime=render;
render=function(){renderWithLibraryRealtime();queueMicrotask(()=>libraryRealtimeEnsure())};

function ownerDayFileStore(){if(!S.ownerDayFiles||typeof S.ownerDayFiles!=='object')S.ownerDayFiles={};return S.ownerDayFiles}
function ownerDayFileFor(date){const store=ownerDayFileStore();return store[date]||null}
function captureOwnerDayFile(date){/*NO-DAYFILE*/if(S.ownerDayFiles&&Object.keys(S.ownerDayFiles).length){S.ownerDayFiles={};try{saveData()}catch(e){}}return null;
  if(!isOwnerAccount())return null;
  const key=date||S.plan?.date||today();
  try{
    const snap=window.TDM&&TDM.dayFileSnapshot?TDM.dayFileSnapshot(key):null;
    if(!snap)return null;
    const day=(S.history||[]).find(item=>item.date===key)||{};
    snap.planId=S.plan?.id||day.planId||'';
    snap.examName=S.plan?.examName||day.examName||examPlanLabel();
    snap.topic=S.user?.customTopic||day.topic||'';
    snap.time=key===today()?trackedLearningTimeSeconds():Number(day.time)||0;
    snap.score=Number.isFinite(day.score)?day.score:null;
    snap.comp=Number(day.comp)||S.completedActivities.length||0;
    snap.acts=Number(day.acts)||S.plan?.activities?.length||0;
    snap.updatedAt=new Date().toISOString();
    ownerDayFileStore()[key]=snap;
    ownerPruneDayFiles(OWNER_DAY_FILE_LIMIT);
    saveData();
    return snap
  }catch(error){console.warn('owner day file capture failed:',error);return null}
}

/* fresh material: archive the day, then let TDM pick content that was not used in this round */
function tdmPickIds(picks){
  const out=[];
  Object.entries(picks||{}).forEach(([key,value])=>{
    if(key==='spBase')return;
    (Array.isArray(value)?value:[value]).forEach(entry=>{
      const id=typeof entry==='string'?entry:(entry&&entry.id);
      if(id)out.push(key+':'+id)
    })
  });
  return out
}
const OWNER_DAY_FILE_LIMIT=30;
function ownerDayFileDates(){return Object.keys(ownerDayFileStore()).sort((a,b)=>b.localeCompare(a))}
function ownerPruneDayFiles(limit=OWNER_DAY_FILE_LIMIT){
  const store=ownerDayFileStore(),keys=ownerDayFileDates(),drop=keys.slice(Math.max(0,limit));
  drop.forEach(key=>{delete store[key]});
  if(drop.length)console.warn('owner day files pruned:',drop.join(', '));
  return drop
}

const DAILY_RENEW_LIMIT=3;
function renewLimitExempt(){return ['admin','owner'].includes(normalizedAccessRole())}
function renewUsedToday(){if(S.renewCountDate!==today()){S.renewCountDate=today();S.renewCount=0}return Number(S.renewCount)||0}
function renewRemaining(){return renewLimitExempt()?DAILY_RENEW_LIMIT:Math.max(0,DAILY_RENEW_LIMIT-renewUsedToday())}
function bumpRenewCount(){if(renewLimitExempt())return;renewUsedToday();S.renewCount=(Number(S.renewCount)||0)+1;saveData()}
async function renewDailyExercises(reason){
  if(!S.plan||S.planPreparing||S.resourceLoading)return;
  if(!renewLimitExempt()&&renewRemaining()<=0){
    try{showGlassAlarm(S.uiLanguage==='fa'?'سقف ۳ بار «ثبت نتیجه و تمرین تازه» در روز برای این حساب پر شده است؛ فردا دوباره فعال می‌شود.':S.uiLanguage==='en'?'The daily limit of 3 renewals is used up for this account; it resets tomorrow.':'Das Tageslimit von 3 Erneuerungen ist erreicht; morgen wieder verfügbar.',{type:'error',source:'renew-limit'})}catch(e){}
    return
  }
  const date=S.plan.date||today(),minutes=Number(S.plan.availableMinutes)||null;
  try{stopTimers()}catch(e){}
  try{captureOwnerDayFile(date)}catch(e){console.warn(e)}
  try{if(isOwnerAccount())await saveSessionPack(reason||'manual-renew')}catch(e){console.warn(e)}
  try{upsertDailyHistorySegment(currentPlanHistorySnapshot({closedAt:new Date().toISOString(),closeReason:reason||'renew'}))}catch(e){console.warn(e)}
  try{await cleanupSpeakingRecordings('renew')}catch(e){console.warn(e)}
  let day=null;
  try{if(window.TDM&&TDM.ensureDay)day=TDM.ensureDay(date)}catch(e){console.warn(e)}
  if(day){
    const used=new Set(tdmPickIds(day.picks));
    for(let attempt=0;attempt<12;attempt++){
      delete day.picks;delete day.redemittel;
      try{window.TDM.buildActivities(minutes,date)}catch(e){console.warn(e)}
      if(!tdmPickIds(day.picks).some(id=>used.has(id)))break
    }
    day.work={};day.results={}
  }
  S.plan=null;S.learningResources=null;S.dataSource=null;S.completedActivities=[];S.activityProgress={};S.activityTimers={};S.activityPoints={};S.activeActivity=null;S.showPlanEditor=false;S.screen='dashboard';
  saveData();
  await generatePlan();
  try{window.scrollTo({top:0})}catch(e){}
  bumpRenewCount();
}

/* ══════════════════════════════════════════════════════════════════
   OWNER-PACKS (2026-11-19): each time the six daily exercises are generated
   (manual «save & renew» or the day end) the owner client stores the whole
   pack on the server — plan, method picks, content of the six categories and
   the audio references. The owner can load a stored pack back into the run.
   ══════════════════════════════════════════════════════════════════ */
const OWNER_PACK_SCHEMA = 1;
function ownerPackReasonLabel(reason){
  const fa=S.uiLanguage==='fa',en=S.uiLanguage==='en';
  const map={
    'renew':{fa:'تمرین تازه',en:'Renewed',de:'Erneuert'},
    'manual-renew':{fa:'تمرین تازه',en:'Renewed',de:'Erneuert'},
    'fresh-start':{fa:'شروع تازه',en:'Fresh start',de:'Neustart'},
    'day-end':{fa:'پایان روز',en:'Day end',de:'Tagesende'},
    'manual-day-end':{fa:'پایان روز',en:'Day end',de:'Tagesende'},
    'new-day':{fa:'شروع روز جدید',en:'New day',de:'Neuer Tag'}
  };
  const row=map[reason]||{fa:'ثبت خودکار',en:'Automatic',de:'Automatisch'};
  return fa?row.fa:en?row.en:row.de
}
function ownerPackSnapshot(reason){
  const date=S.plan?.date||today();
  let dayFile=null;
  try{dayFile=window.TDM&&TDM.dayFileSnapshot?TDM.dayFileSnapshot(date):null}catch(e){console.warn(e)}
  let tdm=null;
  try{
    if(window.TDM&&TDM.active&&TDM.active()&&TDM.ensureDay){
      const day=TDM.ensureDay(date);
      tdm={date,wd:day?.wd??null,week:day?.week??null,mode:day?.mode||'normal',level:day?.level||null,picks:day?.picks||null,redemittel:Array.isArray(day?.redemittel)?day.redemittel:[]};
    }
  }catch(e){console.warn(e)}
  const audio=[];
  (dayFile?.modules||[]).forEach(module=>{if(module&&module.audio)audio.push({module:module.id,title:module.title||'',src:module.audio})});
  return{
    schema:OWNER_PACK_SCHEMA,
    kind:tdm?'method':'plan',
    reason:reason||'manual',
    source_date:date,
    created_at:new Date().toISOString(),
    user:{level:S.user?.level||'',topic:S.user?.customTopic||'',exam_plan:S.user?.examPlan||'',ui_language:S.uiLanguage||'fa'},
    plan:S.plan?{activities:(S.plan.activities||[]).map(item=>({...item})),totalMinutes:S.plan.totalMinutes||0,availableMinutes:S.plan.availableMinutes||0,examType:S.plan.examType||'',examName:S.plan.examName||''}:null,
    tdm,
    day_file:dayFile,
    resources:S.learningResources?.package?{package:S.learningResources.package}:null,
    audio
  };
}
function ownerPackLabel(snapshot){
  const date=snapshot?.source_date||today();
  const cats=((snapshot?.day_file?.modules)||[]).map(module=>module.de||module.id).filter(Boolean);
  const tail=cats.length?(cats.slice(0,3).join(' · ')+(cats.length>3?' +'+(cats.length-3):'')):(snapshot?.kind==='plan'?'Plan':'Method');
  return `${date} · ${ownerPackReasonLabel(snapshot?.reason)} · ${tail}`;
}
async function saveSessionPack(reason){/*NO-OWNERPACKS*/return null;
  if(!isOwnerAccount()||!S.currentUser)return null;
  let snapshot=null;
  try{snapshot=ownerPackSnapshot(reason)}catch(error){console.warn('owner pack snapshot failed',error);return null}
  if(!snapshot||!snapshot.plan||!(snapshot.plan.activities||[]).length)return null;
  try{
    const saved=await apiRequest('/owner-packs',{method:'POST',body:JSON.stringify({label:ownerPackLabel(snapshot),reason:snapshot.reason,source_date:snapshot.source_date,payload:snapshot})});
    S.ownerPackLastSaved=saved?.id||null;
    S.ownerPacksList=null;
    console.info('owner session pack saved',saved?.id);
    return saved;
  }catch(error){console.warn('owner session pack save failed',error);return null}
}
function openOwnerPacks(){
  if(!isOwnerAccount())return;
  S.screen='ownerPacks';S.ownerPacksLoading=true;S.ownerPacksError='';saveData();render();
  loadOwnerPacks();
}
async function loadOwnerPacks(){
  if(!isOwnerAccount())return;
  S.ownerPacksLoading=true;S.ownerPacksError='';
  try{
    const data=await apiRequest('/owner-packs');
    S.ownerPacksList=Array.isArray(data?.packs)?data.packs:[];
  }catch(error){S.ownerPacksError=String(error?.message||error);S.ownerPacksList=S.ownerPacksList||[]}
  S.ownerPacksLoading=false;
  if(S.screen==='ownerPacks')render();
}
async function deleteOwnerPack(packId){
  if(!isOwnerAccount()||!packId)return;
  const fa=S.uiLanguage==='fa',en=S.uiLanguage==='en';
  if(!await appConfirm(fa?'این پک ثبت‌شده حذف شود؟':en?'Delete this stored pack?':'Diesen gespeicherten Pack löschen?'))return;
  try{
    await apiRequest('/owner-packs/'+encodeURIComponent(packId),{method:'DELETE'});
    S.ownerPacksList=(S.ownerPacksList||[]).filter(item=>item.id!==packId);
    render();
  }catch(error){showGlassAlarm(String(error?.message||error),{type:'error',source:'owner-pack-delete'})}
}
function ownerPackChipStyle(id){
  const colors={hoeren:'#a855f7',lesen:'#0ea5e9',schreiben:'#f59e0b',sprechen:'#f43f5e',wortschatz:'#10b981',wiederholung:'#6366f1',fehleranalyse:'#ef4444',wochenbericht:'#14b8a6',extra:'#0d9488'};
  return colors[id]||'#64748b'
}
function renderOwnerPacks(){
  if(!isOwnerAccount()){S.screen='dashboard';return renderDashboard()}
  const fa=S.uiLanguage==='fa',en=S.uiLanguage==='en';
  const L=(a,b,c)=>fa?a:en?b:c;
  const packs=Array.isArray(S.ownerPacksList)?S.ownerPacksList:[];
  const loading=!!S.ownerPacksLoading,error=S.ownerPacksError||'';
  const card=S.dark?'bg-gray-800 text-white':'bg-white text-gray-900';
  const rows=packs.map(pack=>{
    const cats=(pack.categories||[]).map(id=>`<span style="display:inline-block;margin:0 4px 4px 0;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;color:#fff;background:${ownerPackChipStyle(id)}">${safeText(id)}</span>`).join('');
    const audio=(pack.audio||[]).length;
    return `<div class="p-4 rounded-2xl ${card} shadow mb-3">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div style="min-width:200px;flex:1">
          <b style="font-size:13px">${safeText(pack.label||pack.source_date||pack.id)}</b>
          <p style="font-size:10px;color:#94a3b8;margin-top:4px">${safeText(pack.source_date||'')} · ${safeText(ownerPackReasonLabel(pack.reason))} · ${Number(pack.question_count||0)} ${L('سؤال','questions','Fragen')} · ${audio} ${L('صوت','audio','Audio')} · ${Math.round(Number(pack.size_bytes||0)/1024)} KB</p>
          <div style="margin-top:8px">${cats}</div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="loadOwnerPack('${safeText(pack.id)}')" style="padding:9px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:11px;font-weight:900;cursor:pointer">${L('بارگذاری در اجرای برنامه','Load into the run','In den Durchlauf laden')}</button>
          <button onclick="deleteOwnerPack('${safeText(pack.id)}')" style="padding:9px 12px;border:0;border-radius:12px;background:rgba(244,63,94,.14);color:#fb7185;font-size:11px;font-weight:900;cursor:pointer">🗑</button>
        </div>
      </div>
    </div>`
  }).join('');
  return `<div class="min-h-screen ${S.dark?'bg-gray-900 text-white':'bg-gray-50 text-gray-900'}" dir="${fa?'rtl':'ltr'}">
    <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-4">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 style="font-size:19px;font-weight:950">${L('افزودن دستی محتوا','Add content manually','Inhalte manuell hinzufügen')}</h1>
          <p style="font-size:11px;color:#94a3b8;margin-top:5px">${L('پک‌های کامل ثبت‌شده از شش دسته تمرین (همراه صوت و پاسخ‌ها). یکی را انتخاب کنید تا اجرای برنامه با همان محتوا بارگذاری شود.','Stored complete packs of the six exercise categories, with audio and answers. Pick one to load it into the run.','Gespeicherte komplette Packs der sechs Übungsbereiche inklusive Audio und Antworten. Auswählen, um sie in den Durchlauf zu laden.')}</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="loadOwnerPacks()" style="padding:9px 13px;border-radius:12px;border:1px solid rgba(148,163,184,.4);background:transparent;color:inherit;font-size:11px;font-weight:900;cursor:pointer">↻ ${L('به‌روزرسانی','Refresh','Aktualisieren')}</button>
          <button onclick="S.screen='dashboard';render()" style="padding:9px 13px;border:0;border-radius:12px;background:#475569;color:#fff;font-size:11px;font-weight:900;cursor:pointer">${L('بازگشت','Back','Zurück')}</button>
        </div>
      </header>
      ${error?`<div class="p-3 rounded-2xl" style="background:rgba(244,63,94,.12);color:#fb7185;font-size:11px;font-weight:800">${safeText(error)}</div>`:''}
      ${loading?`<div class="p-6 rounded-2xl ${card} text-center" style="font-size:12px;color:#94a3b8">${L('در حال خواندن پک‌ها…','Loading packs…','Packs werden geladen…')}</div>`:(rows||`<div class="p-6 rounded-2xl ${card} text-center" style="font-size:12px;color:#94a3b8">${L('هنوز پکی ثبت نشده است. با «ثبت نتیجه و تمرین تازه» یا پایان روز، پک بعدی خودکار ثبت می‌شود.','No pack stored yet. The next pack is stored automatically on “save & renew” or at the day end.','Noch kein Pack gespeichert. Der nächste Pack wird bei „Speichern & erneuern“ oder am Tagesende automatisch abgelegt.')}</div>`)}
    </div>
  </div>`
}
async function loadOwnerPack(packId){
  if(!isOwnerAccount()||!packId)return;
  const fa=S.uiLanguage==='fa',en=S.uiLanguage==='en';
  try{
    const data=await apiRequest('/owner-packs/'+encodeURIComponent(packId));
    const payload=data?.payload||{};
    const ok=await appConfirm(fa?'اجرای فعلی با این پک بارگذاری شود؟ تمرین‌ها و پاسخ‌های امروز جایگزین می‌شوند.':en?'Load this pack into the current run? Today’s exercises and answers are replaced.':'Diesen Pack in den aktuellen Durchlauf laden? Die heutigen Übungen und Antworten werden ersetzt.');
    if(!ok)return;
    applyOwnerPack(payload,packId);
  }catch(error){showGlassAlarm(String(error?.message||error),{type:'error',source:'owner-pack-load'})}
}
function applyOwnerPack(pack,packId){
  if(!isOwnerAccount()||!pack)return false;
  const plan=pack.plan||{};
  const activities=Array.isArray(plan.activities)?plan.activities.map(item=>({...item})):[];
  if(!activities.length)throw new Error('Der Pack enthält keine Übungen.');
  const key=today();
  if(pack.kind==='method'&&window.TDM&&TDM.ensureDay){
    try{
      const day=TDM.ensureDay(key);
      if(pack.tdm){
        if(pack.tdm.mode)day.mode=pack.tdm.mode;
        if(pack.tdm.picks)day.picks=JSON.parse(JSON.stringify(pack.tdm.picks));
        if(Array.isArray(pack.tdm.redemittel))day.redemittel=JSON.parse(JSON.stringify(pack.tdm.redemittel));
        if(pack.tdm.level)day.level=pack.tdm.level;
      }
      day.work={};day.results={};day.loadedPack=packId||'';day.createdAt=new Date().toISOString();
    }catch(error){console.warn('owner pack method restore failed',error)}
  }
  S.plan={id:'plan-'+Date.now(),date:key,createdAt:new Date().toISOString(),examType:plan.examType||S.user?.examPlan||'',examName:plan.examName||examPlanLabel(),activities,totalMinutes:Number(plan.totalMinutes)||0,availableMinutes:Number(plan.availableMinutes)||0,dataSource:'owner-pack',schemaVersion:'1.0.0',ownerPack:{id:packId||'',label:ownerPackLabel(pack),loadedAt:new Date().toISOString()}};
  if(pack.kind!=='method'&&pack.resources?.package){
    const pkg=pack.resources.package,content=pkg?.content||{};
    S.learningResources={vocab:content.wortschatz?.items||[],grammar:content.grammatik?.questions||[],writingTopic:content.schreiben?.writing_task||'',hoeren:content.hoeren||null,package:pkg};
    S.dataSource={type:'owner-pack',label:'Owner pack loaded',receivedAt:new Date().toISOString()};
  }
  S.completedActivities=[];S.activityProgress={};S.activityTimers={};S.activityPoints={};S.activeActivity=null;S.showPlanEditor=false;
  saveData();
  S.screen='dashboard';render();
  return true;
}

</script>
